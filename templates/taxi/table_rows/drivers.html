{% for driver in items %}
  <tr class="hover:bg-gray-50">
    <td class="border-b text-right tabular-nums">
      {{ start_index|add:forloop.counter0 }}
    </td>
    <td class="border-b">
      <a href="{% url 'taxi:driver-detail' driver.pk %}"
         class="text-blue-600 hover:underline px-1.5 py-0.5 -m-0.5 rounded-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 focus-visible:ring-offset-white">
        {{ driver.username }}
      </a>
    </td>
    <td class="border-b whitespace-nowrap">
      {{ driver.first_name }} {{ driver.last_name }}
    </td>
  </tr>
{% empty %}
  <tr>
    <td colspan="{{ headers|length }}" class="px-4 py-2 text-center text-gray-500">
      No drivers
    </td>
  </tr>
{% endfor %}
