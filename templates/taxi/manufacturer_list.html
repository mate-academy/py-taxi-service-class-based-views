{% extends "base.html" %}

{% block content %}
  {% if manufacturer_list %}
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Company name</th>
          <th>Country</th>
        </tr>
      </thead>
      <tbody>
        {% for manufacturer in manufacturer_list %}
          <tr>
            <td>{{ manufacturer.name }}</td>
            <td>{{ manufacturer.country }}</td>
          </tr>
        {% empty %}
          <tr>
            <td>No manufacturer</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
