{% extends "base.html" %}

{% block content %}
<h1>Manufacturers</h1>
  {% if manufacturer_list %}
    <ul>
      {% for manufacture in manufacturer_list %}
        <li>{{ manufacture.name }} ({{ manufacture.country }})</li>
        {% empty %}
          <p>No manufacturers available.</p>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
