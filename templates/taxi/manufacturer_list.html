{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer List</h1>
  {% if manufacturer_list %}
    <ul>
      {% for manufacturer in manufacturer_list %}
        <li>Name of Company: {{ manufacturer.name }}</li>
        <p>Country: {{ manufacturer.country }}</p>
        <hr>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
