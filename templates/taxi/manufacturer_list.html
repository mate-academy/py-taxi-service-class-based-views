{% extends "base.html" %}

{%  block content %}
  <h2> Manufacturer list</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Country</th>
      </tr>
    </thead>
    <tbody>
      {% if manufacturer_list %}
        {% for manufacturer in manufacturer_list %}
          <tr>
            <th>{{ manufacturer.name }}</th>
            <th>{{ manufacturer.country }}</th>
          </tr>
        {% endfor %}
      {% endif %}
    </tbody>
  </table>


{% endblock %}
