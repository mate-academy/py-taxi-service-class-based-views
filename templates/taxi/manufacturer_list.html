{% extends "base.html" %}

{% block content %}
  <h1>Manufacturers</h1>
  <table class="table">
    <tr><th>Name</th><th>Country</th></tr>
    {% for manufacturer in manufacturer_list %}
      <tr>
        <td>{{ manufacturer.name }}</td>
        <td>{{ manufacturer.country }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="2">No manufacturers available.</td></tr>
    {% endfor %}
  </table>
{% endblock %}
