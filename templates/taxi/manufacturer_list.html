{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer List</h1>

  {% if manufacturer_list %}
    <table>
      {% for manufacturer in manufacturer_list %}
        <tr>
          <td>{{ manufacturer.name }} ({{ manufacturer.country }})</td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>There are no Manufacturers</p>
  {% endif %}
{% endblock %}
