{% extends "base.html" %}
{% block content %}
  <h1>Manufacturers</h1>
  <table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Country</th>
  </tr>
  </thead>
  <tbody>
  {% for manufacturer in object_list %}
    <tr>
    <td>{{ manufacturer.pk }}</td>
    <td>{{ manufacturer.name }} </td>
    <td>{{ manufacturer.country }}</td>
    </tr>
    {% empty %}
    <tr>
    <td colspan="3"> No manufacturers</td>
    </tr>
  {% endfor %}
  </tbody>
  </table>
  {% include "includes/pagination.html" %}
{% endblock %}
