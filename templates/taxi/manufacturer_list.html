{% extends "base.html" %}

{% block content %}
  <h1>Manufacturers</h1>
  <table class="table">
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Country</th>
      </tr>
    </thead>
    <tbody>
      {% for manufacturer in manufacturers %}
        <tr>
          <td>{{ manufacturer.name }}</td>
          <td>{{ manufacturer.country }}</td>
        </tr>
      {% empty %}
        <tr><td colspan="2">No manufacturers found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
