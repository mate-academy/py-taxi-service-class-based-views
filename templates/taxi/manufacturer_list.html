{% extends "base.html" %}
{% block content %}
  <h1>Manufacturers</h1>
  <table class="table table-striped">
    <thead>
    <tr>
      <th>Manufacturer</th>
      <th>Country</th>
    </tr>
    </thead>
    <tbody>
    {% for manufacturer in object_list %}
      <tr>
        <td>
          {{ manufacturer.name }}
        </td>
        <td>
          {{ manufacturer.country }}
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
