{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer</h1>
  {% if manufacturer_list %}
  <table>
    <thead>
      <tr>
        <th>Назва</th>
        <th>Країна</th>
      </tr>
    </thead>
    <tbody>
      {% for manufacturer in manufacturer_list %}
        <tr>
          <td>{{ manufacturer.name }}</td>
          <td>{{ manufacturer.country }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endif %}
{% endblock %}
