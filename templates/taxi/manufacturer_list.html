{% extends "base.html" %}
{% block content %}
  <h1>
    Manufacturer
  </h1>
  {% if manufacturer_list %}
    <table>
      <tr>
        <th>Name</th>
        <th>Country</th>
      </tr>
      {% for manufacturer in object_list %}
        <tr>
          <td>{{ manufacturer.name }}</td>
          <td>{{ manufacturer.country }}</td>
        </tr>
      {% endfor %}
    </table>
  {% endif %}
{% endblock %}
