{% extends "base.html" %}

{% block content %}
  {% if manufacturer_list %}
    <h1>Manufacturer List</h1>
    <table class="table table-bordered w-50">
      <tr>
        <th>name</th>
        <th>country</th>
      </tr>
      {% for manufacturer in manufacturer_list %}
        <tr>
          <th>{{ manufacturer.name }}</th>
          <th>{{ manufacturer.country }}</th>
        </tr>
      {% endfor %}
    </table>
  {% endif %}
{% endblock  %}
