{%extends "base.html"%}
{%block content%}
  <h1>Manufacturer List</h1>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Manufacturer</th>
        <th>Country</th>
      </tr>
    </thead>
    <tbody>
      {%for manufacturer in manufacturer_list%}
        <tr>
          <td>{{manufacturer.id}}</td>
          <td>{{manufacturer.name}}</td>
          <td>{{manufacturer.country}}</td>
        </tr>
     {%empty%}
        <tr>
          <td colspan="3">No Manufacturer found</td>
        </tr>
      {%endfor%}
    </tbody>
  </table>
  {% include "includes/pagination.html" %}
{%endblock%}
