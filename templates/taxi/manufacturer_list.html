{% extends "base.html" %}

{% block content %}
  <h1>Manufacturers list</h1>
  <table class="table table-striped">
    <thead>
      <th>Manufacturer</th>
    </thead>
    <tbody>
      {% for manufacturer in manufacturers %}
        <tr>
          <td>{{ manufacturer.name }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
