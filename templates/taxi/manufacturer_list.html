{% extends "base.html" %}

{% block content %}
  <table>
    <thead>
    <tr>
      <th>Manufacturer List</th>
    </tr>
    </thead>
    <tbody>
    {% for manufacturer in manufacturer_list %}
      <tr>
        <td>
          {{ manufacturer.name }}
        </td>
        <td>
          {{ manufacturer.country }}
        </td>
      </tr>
    {% empty %}
      <li>No manufacturer found</li>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
