{% extends "base.html" %}

{% block title %}Manufacturers{% endblock %}

{% block content %}
  <h1>Manufacturers</h1>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Country</th>
      </tr>
    </thead>
    <tbody>
      {% for object in object_list %}
        <tr>
          <td>{{ object.name }}</td>
          <td>{{ object.country }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="2">No manufacturers yet</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
