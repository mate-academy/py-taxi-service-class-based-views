{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer</h1>
  <table border="1px">
    <thead>
      <tr align="center">
        <th>ID</th>
        <th>Name</th>
        <th>Country</th>
      </tr>
    </thead>
    <tbody>
      {% for manufacturer in manufacturer_list %}
        <tr align="center">
          <td>{{ manufacturer.id }}</td>
          <td>{{ manufacturer.name }}</td>
          <td>{{ manufacturer.country }}</td>
        </tr>
      {% empty %}
        <tr align="center">
          <td colspan="3">No manufacturers found.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% include "includes/pagination.html" %}
{% endblock %}
