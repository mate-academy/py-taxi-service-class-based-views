{% extends "base.html" %}

{% block content %}
  <h1>Manufacturers list</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Country</th>
      </tr>
    </thead>
    <tbody>
      {% for manufacturer in manufacturer_list %}
        <tr>
          <td>{{ manufacturer.id }}</td>
          <td>{{ manufacturer.name }}</td>
          <td>{{ manufacturer.country }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3">No manufacturers found.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
