{% extends "base.html" %}
{% block content %}
  <h2>Manufacturers</h2>
  <table>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Country</th>
    </tr>
    {% for manufacturer in object_list %}
      <tr>
        <td>{{ manufacturer.id }}</td>
        <td>{{ manufacturer.name }}</td>
        <td>{{ manufacturer.country }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="3">No manufacturers found.</td></tr>
    {% endfor %}
  </table>
{% endblock %}
