{% extends "base.html" %}
{% block content %}
  <h1>Manufacturer List</h1>
  <ul>
    {% for manufacturer in manufacturer_list %}
      <li>
        <a href="#">{{ manufacturer.name }} (Country: {{ manufacturer.country }}) </a>
      </li>
    {% empty %}
      <p>There are no manufacturers</p>
    {% endfor %}
  </ul>
{% endblock %}
