{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer List</h1>

  {% if manufacturer_list %}
    <table>
      {% for manufacturer in manufacturer_list %}
        <tr>
          <td>
            {{ manufacturer.name }}
          </td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>No manufacturers found.</p>
  {% endif %}

{% endblock %}
