{% extends "base.html" %}

{% block content %}
<h1><strong>Manufacturers</strong></h1>

<table class="table">
  <thead>
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Country</th>
  </tr>
  </thead>
  <tbody>
  {% for manufacturer in manufacturer_list %}
  <tr>
    <td>{{ manufacturer.id }}</td>
    <td>{{ manufacturer.name }}</td>
    <td>{{ manufacturer.country }}</td>
  </tr>
  {% empty %}
  <tr>
    <td colspan="3">There are no such a Manufacturer</td>
  </tr>
  {% endfor %}
  </tbody>
</table>

{% endblock %}
