{% extends "base.html" %}

{% block title %}
  <title>Manufacturer List</title>
{% endblock %}

{% block content %}
  {% if manufacturer_list %}
    <table>
      <tbody>
        {% for manufacturer in manufacturer_list %}
          <tr>
            <td>{{ manufacturer.name }}</td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="1">No manufacturers found</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
