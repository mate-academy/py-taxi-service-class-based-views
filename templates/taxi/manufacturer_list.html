{% extends "base.html" %}
{% block content %}
  <table>
    <thead>
    <tr>
      <th>Manufacturer</th>
    </tr>
    </thead>

    {% if manufacturer_list %}
      <tbody>
      {% for manufacturer in manufacturer_list %}
        <tr>
          <td>{{ manufacturer.name }}</td>
        </tr>
      {% endfor %}
      </tbody>
    {% else %}
      <p>There is no Manufacturer</p>
    {% endif %}

  </table>
{% endblock %}
