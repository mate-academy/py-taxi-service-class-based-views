{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer list:</h1>
  {% if manufacturer_list %}
  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
      </tr>
    </thead>
    <tbody>
      {% for manufacturer in manufacturer_list %}
        <tr>
          <td>{{ manufacturer.name }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
    {% else %}
      <p>Manufacturers don't exist.</p>
    {% endif %}
{% endblock %}
