{% extends "base.html" %}

{% block content %}
  <h1>Manufacturers</h1>
  <table class="table">
    <tr>
      <th>id</th>
      <th>name</th>
      <th>country</th>
    </tr>


    {% for manufacturer in manufacturer_list %}
      <tr>
        <td>{{ manufacturer.id }}</td>
        <td>{{ manufacturer.name }}</td>
        <td>{{ manufacturer.country }}</td>
      </tr>
    {% empty %}
      <p>No manufacturers yet.</p>
    {% endfor %}

  </table>

{% endblock %}
