{% extends "base.html" %}


{% block content %}
  <table>
    <tr>
      <th>id</th>
      <th>Name</th>
      <th>Country</th>
    </tr>
    {% for manufacturer in manufacturer_list %}
    <tr>
      <td>{{ manufacturer.id }}</td>
      <td>{{ manufacturer.name }}</td>
      <td>{{ manufacturer.country }}</td>
    </tr>
    {% empty %}
      <tr><td colspan="3">There are no manufacturers</td></tr>
    {% endfor %}
  </table>
{% endblock %}
