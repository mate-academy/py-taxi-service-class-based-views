{% extends "base.html" %}

{% block content %}
  <h3 style="text-align: center;">Manufacturers:</h3>
  <table border="1" style="margin: 0 auto;">
    {% for manufacturer in manufacturer_list %}
      <tr>
        <td>{{ manufacturer.name }}</td>
        <td>{{ manufacturer.country }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
