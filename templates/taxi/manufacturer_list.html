{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer List</h1>
  <style>
      table, th, td {
          border: 1px solid black;
      }
  </style>
  <table style="width: 30%">
    <tr>
      <th>Name</th>
      <th>Country</th>
    </tr>
    {% for manufacturer in manufacturer_list %}
      <tr>
        <td>{{ manufacturer.name }}</td>
        <td>{{ manufacturer.country }}</td>
      </tr>

    {% endfor %}
  </table>
{% endblock %}
