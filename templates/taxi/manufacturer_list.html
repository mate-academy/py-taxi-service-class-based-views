{% extends "base.html"%}

{% block content %}
  <h1>Manufacturer List</h1>
  {% if manufacturer_list %}
    <table>
      <tr>
        <th>Name</th>
        <th>Country</th>
      </tr>
      {% for manufacturer in manufacturer_list %}
        <tr>
          <th><a href="#">{{ manufacturer.name }}</a></th>
          <th>{{ manufacturer.country }}</th>
        </tr>
      {% endfor %}
    </table>
  {% endif %}
{% endblock %}
