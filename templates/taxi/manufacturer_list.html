{% extends "base.html" %}

{% block content %}

<table  border="1">
  <thead>
    <tr>
      <th>Name</th>
      <th>Country</th>
    </tr>
  </thead>

  <tbody>
    {% for manufacturer in manufacturer_list %}
      <tr>
        <td>{{ manufacturer.name }}</td>
        <td>{{ manufacturer.country }}</td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="2">Nenhum fabricante encontrado</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
