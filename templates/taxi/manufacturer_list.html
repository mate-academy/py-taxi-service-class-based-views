{% extends "base.html" %}
{% block content %}
  {% if manufacturer_list %}
    <table class="table">
      <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Country</th>
      </tr>
      </thead>
      <tbody>
      {% for manufacturer in manufacturer_list %}
        <tr>
          <th scope="row">{{ manufacturer.name }}</th>
          <td>{{ manufacturer.country }}</td>
        </tr>
      {% empty %}
        <p>No Data</p>
      {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
