{% extends "base.html" %}

{% block content %}
<h1>Manufacturers</h1>

{% if manufacturer_list %}
<table border="1" cellspacing="0" cellpadding="5">
    <thead>
        <tr>
            <th>Name</th>
            <th>Country</th>
        </tr>
    </thead>
    <tbody>
        {% for manufacturer in manufacturer_list %}
            <tr>
                <td>{{ manufacturer.name }}</td>
                <td>{{ manufacturer.country }}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>No manufacturers found.</p>
{% endif %}
{% endblock %}
