{% extends "base.html" %}

{% block content %}
  <h2>Manufacturers list:</h2>
  {% if object_list %}
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Manufacturer</th>
          <th>Country</th>
        </tr>
      </thead>
      <tbody>
        {% for manufacturer in object_list %}
          <tr>
            <td>{{ manufacturer.name }}</td>
            <td>{{ manufacturer.country }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No manufacturers found!</p>
  {% endif %}
{% endblock %}
