{% extends "base.html" %}

{% block content %}
	<h1>Manufacture</h1>
	<table class="table table-hover">
		<tr>
			<th>ID</th>
			<th>Name</th>
			<th>Country</th>
		</tr>
		{% for manufacture in manufacturer_list %}
			<tr>
				<td>{{ manufacture.id }}</td>
				<td>{{ manufacture.name }}</td>
				<td>{{ manufacture.country }}</td>
			</tr>
		{% endfor %}
	</table>
{% endblock %}
