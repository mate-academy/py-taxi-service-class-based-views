{% extends "base.html" %}
{% block content %}
  <h1>Manufacturers:</h1>
  <div class="ml-3">
    {% if manufacturer_list %}
    <table class="table">
      <tr>
        <th>Name:</th>
        <th>Country:</th>
      </tr>
      {% for manufacturer in manufacturer_list %}
      <tr>
        <th>{{ manufacturer.name }}</th>
        <th>{{ manufacturer.country }}</th>
      </tr>
        {% empty %}
        There are no manufacturers.
      {% endfor %}
    </table>
  {% endif %}
  </div>
{% endblock %}
