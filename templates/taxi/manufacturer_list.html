{% extends "base.html" %}
{% block content %}
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Country</th>
        </tr>
        {% for manufacturer in manufacturer_list %}
            <tr>
                <th>{{manufacturer.id}}</th>
                <th>{{manufacturer.name}}</th>
                <th>{{manufacturer.country}}</th>
            </tr>
        {% endfor %}
    </table>
{% endblock %}
