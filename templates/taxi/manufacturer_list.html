{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer List</h1>
  {% if manufacturer_list %}
    <ul>
      {% for manufacturer in manufacturer_list %}
        <li>{{ manufacturer.pk }}: (name: {{ manufacturer.name }} country: {{ manufacturer.country }})</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
