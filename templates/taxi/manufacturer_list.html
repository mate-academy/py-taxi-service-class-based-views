{% extends "base.html" %}

{% block content %}
<h1>Manufacturers</h1>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Country</th>
    </tr>
  </thead>
  <tbody>
    {% for manufacturer in manufacturer_list %}
      <tr>
        <td>{{ manufacturer.name }}</td>
        <td>{{ manufacturer.country }}</td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="2">No manufacturers found.</td>
      </tr>
    {% endfor %}
  </tbody>
</table>

  {% include "includes/pagination.html" %}
{% endblock %}
