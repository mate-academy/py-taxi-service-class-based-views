{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer List</h1>

  {% if manufacturer_list %}
    <table border="1" cellpadding="6">
      <thead>
        <tr>
          <th>Name</th>
          <th>Country</th>
        </tr>
      </thead>

      <tbody>
        {% for manufacturer in manufacturer_list %}
          <tr>
            <td>{{ manufacturer.name }}</td>
            <td>{{ manufacturer.country }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>There are no Manufacturers!</p>
  {% endif %}

{% endblock %}
