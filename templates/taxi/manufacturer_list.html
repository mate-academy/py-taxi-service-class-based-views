{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer list</h1>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>NAME</th>
          <th>COUNTRY</th>
        </tr>
      </thead>
      <tbody>
        {% for manufacturer in manufacturer_list %}
          <tr>
            <td>{{ manufacturer.id }}</td>
            <td>{{ manufacturer.name }}</td>
            <td>{{ manufacturer.country }}</td>
          </tr>
        {% empty %}
          <tr><td colspan="3">No Manufacturers</td></tr>
        {% endfor %}
      </tbody>
    </table>
{% endblock %}
