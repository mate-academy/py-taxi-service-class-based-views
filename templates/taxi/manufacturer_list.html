{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer List</h1>
  {% if manufacturer_list %}
    <ul>
      {% for manufacturer in manufacturer_list %}
        <li>
          <strong>{{ manufacturer.name }}</strong> - {{ manufacturer.country }}
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No manufacturers</p>
  {% endif %}
{% endblock %}
