{% extends "base.html" %}

{% block content %}
  <h1>Manufacturers</h1>

  {% if manufacturer_list %}
    <ul>
    {% for manufacturer in manufacturer_list %}
      <li>
        name: <strong>{{ manufacturer.name }}</strong>,
        country: <strong> {{manufacturer.country }}</strong>
      <hr>
      </li>
    {% endfor %}
    </ul>
  {% else %}
    <p>No manufacturers in list</p>
  {% endif %}
{% endblock %}
