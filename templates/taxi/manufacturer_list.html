{% extends "base.html" %}
{% block content %}
  <h1>Manufacturer List</h1>
  <table border="1">
    <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Country</th>
    </tr>
    </thead>
    <tbody>
    {% for manufacturer in manufacturers %}
      <tr>
        <td>{{ manufacturer.id }}</td>
        <td>{{ manufacturer.name }}</td>
        <td>{{ manufacturer.country }}</td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="3">No manufacturers available.</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
