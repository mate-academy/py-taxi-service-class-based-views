{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer List</h1>

  <ul>
    {% for manufacturer in manufacturer_list %}
      <li>
        <a href="{% url 'taxi:manufacturer-detail' manufacturer.pk %}">
          {{ manufacturer.pk }}:</a>
          {{ manufacturer.name }}
          ({{ manufacturer.country }})
      </li>
    {% empty %}
      <p>No manufacturers!</p>
    {% endfor %}
  </ul>
{% endblock %}
