{% extends "base.html" %}

{% block title %}
  <title>Manufacturers</title>
{% endblock %}
{% block content %}
  {% if manufacturer_list %}
    <table class="table">
      <thead class="table-dark">
      <tr>
        <th>Name</th>
        <th>Country</th>
      </tr>
      </thead>
      <tbody>
      {% for manufacturer in manufacturer_list %}
        <tr>
          <td>{{ manufacturer.name }}</td>
          <td>{{ manufacturer.country }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No manufacturers</p>
  {% endif %}
{% endblock %}
