{% extends 'base.html' %}

{% block content %}
  <table>
    <caption>Manufacturer list</caption>
    {% if manufacturer_list %}
      <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Country</th>
      </tr>
      </thead>
      <tbody>
      {% for manufacturer in manufacturer_list %}
        <tr>
          <td>{{ manufacturer.name }}</td>
          <td>{{ manufacturer.country }}</td>
        </tr>
        </tbody>
      {% endfor %}
    {% endif %}
  </table>
{% endblock %}
