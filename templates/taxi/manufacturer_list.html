{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer</h1>
  {% if manufacturer_list %}
    <table>
      {% for manufacturer in manufacturer_list %}
        <tr>
          <td>{{ manufacturer.name }}</td>
          <td>{{ manufacturer.country }}</td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    There are no manufacturers in the database
  {% endif %}
{% endblock %}
