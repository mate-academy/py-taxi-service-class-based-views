{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer list</h1>
  <table>
    <tr>
      <th>name</th>
      <th>country</th>
    </tr>
    {% for manufacturer in manufacturer_list %}
      <tr>
        <td>{{ manufacturer.name }}</td>
        <td>{{ manufacturer.country }}</td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="2">No manufacturers available</td>
      </tr>
    {% endfor %}
    </table>
{% endblock %}
