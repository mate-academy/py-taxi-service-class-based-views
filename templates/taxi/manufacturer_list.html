{% extends 'base.html' %}

{% block content %}
  <h1>Manufacturer List</h1>
  {% if manufacturer_list %}
    <ul>
      {% for manufacturer in manufacturer_list %}
        <li>Country: {{ manufacturer.country }}</li>
        <p>Model: {{ manufacturer.name }}</p>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
