{% extends "base.html" %}

{% block content %}
    <h1>Manufacturer table</h1>
        <table border="1">
            <thead>
                <tr>
                    <th>id</th>
                    <th>Name</th>
                    <th>Country</th>
                </tr>
            </thead>
            {% if manufacturer_list %}
                {% for manufacturer in manufacturer_list %}
                    <tr>
                        <td>{{ manufacturer.id }}</td>
                        <td>{{ manufacturer.name }}</td>
                        <td>{{ manufacturer.country }}</td>
                    </tr>
                {% endfor %}
            {% endif %}
        </table>
{% endblock %}
