{% extends "base.html" %}
{% block title %}
  <title>Manufacturers</title>
{% endblock %}
{% block content %}
  <div>
    <table class="table table-hover">
    <thead class="thead-dark">
      <tr>
        <th>Name</th>
        <th>Country</th>
      </tr>
    </thead>
    <tbody>
      {% for man in manufacturer_list %}
        <tr>
          <td>{{ man.name }}</td>
          <td>{{ man.country }}</td>
        </tr>
      {% endfor %}
    </tbody>
    </table>
  </div>
{% endblock %}
