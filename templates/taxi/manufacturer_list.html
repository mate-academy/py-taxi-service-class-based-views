{% extends "base.html" %}

{% block content %}
  <h1>List manufacturers</h1>
  <table>
    <tr>
      <th>Name</th>
      <th>Country</th>
    </tr>
    {% for manufacturer in manufacturer_list %}
      <tr>
        <td>{{ manufacturer.name }}</td>
        <td>{{ manufacturer.country }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="2">No manufacturers found</td></tr>
    {% endfor %}
  </table>
  {% include "includes/pagination.html" %}
{% endblock %}
