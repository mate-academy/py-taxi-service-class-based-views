{% extends "base.html" %}

{% block content %}
  <h1>Manufacturers list</h1>
  {% if manufacturer_list %}
    <table class="table table-striped">
      <thead>
        <tr>
          <td>name</td>
          <td>country</td>
        </tr>
      </thead>
      <tbody>
        {% for manufacturer in manufacturer_list %}
          <tr>
            <td>{{ manufacturer.name }}</td>
            <td>{{ manufacturer.country }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>There are no manufacturers.</p>
  {% endif %}
{% endblock %}
