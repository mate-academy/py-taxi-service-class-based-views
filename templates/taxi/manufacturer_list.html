{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer List</h1>
  <table class="table">
    <tr>
      <th>ID</th>
      <th>Manufacturer</th>
      <th>Country</th>
    </tr>
    {% for manufacturer in manufacturer_list %}
      <tr>
        <td>{{ manufacturer.id }}</td>
        <td><a href="{% url 'taxi:manufacturer-detail' pk=manufacturer.id %}">{{ manufacturer.name }}</a></td>
        <td>{{ manufacturer.country }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
