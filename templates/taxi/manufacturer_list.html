{% extends "base.html" %}

{% block content %}

  <h1>Manufacturers</h1>
  {% if manufacturer_list %}
    <table>
      <thead>
      <tr>
        <th>Name</th>
        <th>Country</th>
      </tr>
      </thead>
      <tbody>
      {% for manufacturer in manufacturer_list %}
        <tr>
          <td>{{ manufacturer.name }}</td>
          <td>{{ manufacturer.country }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p class="no-items">No manufacturers at the moment</p>
  {% endif %}

{% endblock %}
