{% extends "base.html" %}

{% block content %}
  <h1>Manufacturers</h1>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Country</th>
      </tr>
    </thead>
    <tbody>
      {% for manufacturer in object_list %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ manufacturer.name }}</td>
        <td>{{ manufacturer.country }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3">No manufacturers.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
