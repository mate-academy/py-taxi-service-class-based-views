{%  extends "base.html" %}

{%  block content %}
  <h2>Represented Manufacturers</h2>
  {% if manufacturer_list %}
    <ul>
      {%  for manufacturer in manufacturer_list %}
        <li>{{manufacturer.name}}</li>
      {%  endfor %}
    </ul>
  {% else %}
    <p>No manufacturers found.</p>
  {% endif %}
{% endblock %}
