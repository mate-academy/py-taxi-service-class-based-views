{% extends "base.html" %}
{% block content %}
  <h1>Manufacturer list</h1>
  {% if manufacturer_list %}
    <ul>
      {% for manufacturer in manufacturer_list %}
        <li>
          <a href={% url 'taxi:car-detail' manufacturer.id %}>{{ manufacturer.name }} - {{ manufacturer.country }}</a>
        </li>
      {% endfor %}
    </ul>
    {% else %}
    <p>No manufacturers available.</p>
  	{% endif %}
{% endblock %}
