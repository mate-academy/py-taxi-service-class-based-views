{% extends "base.html" %}
{% block content %}
  <h1>Manufacturers</h1>
  {% if manufacturer_list %}
    <table class="table" style="table-layout: fixed; width: 100%;">
      <thead>
        <tr>
          <th class="col">Manufacturer Name</th>
          <th class="col">Manufacturer Country</th>
        </tr>
      </thead>
      <tbody>
        {% for manufacturer in manufacturer_list %}
          <tr>
            <th scope="row">
              {{ manufacturer.name }}
            </th>
            <th>
              {{ manufacturer.country }}
            </th>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
