{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer List</h1>
  {% if manufacturer_list %}
    <table>
      {% for manufacturer in manufacturer_list %}
        <li>{{ manufacturer.name }}</li>
      {% endfor %}
    </table>
  {% else %}
    <p>There are no manufacturers in the Taxi Service</p>
  {% endif %}
{% endblock %}
