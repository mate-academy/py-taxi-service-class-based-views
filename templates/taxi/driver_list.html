{% extends "base.html" %}
{% block content %}
  <h1>Drivers</h1>
  <table border="1">
    <th>Username</th>
    <th>First Name</th>
    <th>Username</th>
  {% for driver in driver_list %}
  <tr>
    <td>
      <a href="{% url 'taxi:driver-detail' pk=driver.id %}">
        {{ driver.username }}
      </a>
    </td>
    <td>{{ driver.first_name }}</td>
    <td>{{ driver.last_name }}</td>
  </tr>
  {% endfor %}
  </table>
{% endblock %}
