{% extends "base.html" %}


{% block content %}
  <table>
    <tr>
      <td>id</td>
      <td>Username</td>
      <td>First name</td>
      <td>Last name</td>
      <td>License number</td>
    </tr>
  {% for driver in driver_list %}
    <tr>
      <td>{{ driver.id }}</td>
      <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
      <td>{{ driver.first_name }}</td>
      <td>{{ driver.last_name }}</td>
      <td>{{ driver.license_number }}</td>
    </tr>
  {% empty %}
    <tr><td colspan="5">There are no drivers</td></tr>
  {% endfor %}
  </table>
{% endblock %}
