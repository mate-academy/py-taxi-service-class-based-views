{% extends "base.html" %}

{% block content %}
  <h1>Driver list</h1>

  <table>
  <tr>
    <th>ID</th>
    <th>Username</th>
    <th>Licence number</th>
  </tr>
    {% for driver in driver_list %}
      <tr>
        <td>{{ driver.id }}</td>
        <td>
          <a href="{% url 'taxi:driver-detail' driver.id %}">
          {{ driver.username }}</a>
        </td>
        <td>{{ driver.license_number }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
