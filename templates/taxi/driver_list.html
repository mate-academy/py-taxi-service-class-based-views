{% extends "base.html" %}
{% block content %}
  <h1>Drivers List</h1>

  <table class="table">
    <tr>
      <th>Username</th>
      <th>Full name</th>
      <th>License number</th>
    </tr>
    {% for driver in object_list %}
      <tr>
        <td>
          <a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a>
        </td>
        <td>{{ driver.first_name }} {{ driver.last_name }}</td>
        <td>{{ driver.license_number }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
