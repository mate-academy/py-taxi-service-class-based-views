{% extends "base.html" %}

{% block content %}
  <h1>Drivers:</h1>
 {% if driver_list %}
  <table>
    <thead>
      <tr>
        <th>Ім'я користувача</th>
        <th>Ім'я</th>
        <th>Прізвище</th>
        <th>Номер ліцензії</th>
      </tr>
    </thead>
    <tbody>
      {% for driver in driver_list %}
        <tr>
          <td><a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a></td>
          <td>{{ driver.first_name }}</td>
          <td>{{ driver.last_name }}</td>
          <td>{{ driver.license_number }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endif %}
{% endblock %}
