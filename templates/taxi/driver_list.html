{% extends "base.html" %}

{% block content %}
  {% if driver_list %}
    <h1>Driver List</h1>
    <table class="table table-bordered w-50">
      <tr>
        <th>id</th>
        <th>username</th>
        <th>license_number</th>
      </tr>
      {% for driver in driver_list %}
        <tr>
          <th>{{ driver.id }}</th>
          <th><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></th>
          <th>{{ driver.license_number }}</th>
        </tr>
      {% endfor %}
    </table>
  {% endif %}
{% endblock  %}
