{% extends "base.html" %}

{% block content %}
  <h1>List driver</h1>
  <table>
    <tr>
      <th>Name user</th>
      <th>First_name</th>
      <th>Last_name</th>
    </tr>
    {% for driver in driver_list %}
      <tr>
        <td><a href="{% url 'taxi:driver-detail' driver.pk %}">{{ driver.username }}</a></td>
        <td>{{ driver.first_name }}</td>
        <td>{{ driver.last_name }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="3">No driver found</td></tr>
    {% endfor %}
  </table>
  {% include "includes/pagination.html" %}
{% endblock %}
