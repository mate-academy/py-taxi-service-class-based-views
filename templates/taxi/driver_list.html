{% extends "base.html" %}

{% block content %}
  <h1>Drivers List</h1>

  {% if driver_list %}
    <table>
    {% for driver in driver_list %}
      <li><a href="{{ driver.get_absolute_url }}">
        {{ driver.first_name }} {{ driver.last_name }}
      </a>
      </li>
    {% endfor %}
    </table>
  {% endif %}
  {% if is_paginated %}

  {% endif %}
{% endblock %}
