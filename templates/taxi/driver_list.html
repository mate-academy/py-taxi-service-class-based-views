{% extends "base.html" %}
{% block content %}
  <h1>Drivers</h1>
  {% if driver_list %}
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Full name</th>
        </tr>
      </thead>
      <tbody>
      {% for driver in driver_list %}
        <tr>
          <td>
            <a href="{% url 'taxi:driver-detail' driver.id %}">
              {{ driver.username }}
            </a>
          </td>
          <td>{{ driver.first_name }} {{ driver.last_name }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>Drivers were not found</p>
  {% endif %}
{% endblock %}
