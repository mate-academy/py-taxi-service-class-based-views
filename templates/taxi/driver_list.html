{% extends 'base.html' %}

{% block content %}
  <table>
    <caption>Drivers list</caption>
    {% if driver_list %}
      <thead>
      <tr>
        <th scope="col">id</th>
        <th scope="col">Username</th>
      </tr>
      </thead>
      <tbody>
      {% for driver in driver_list %}
        <tr>
          <th scope="row">{{ driver.id }}</th>
          <td><a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a></td>
        </tr>
        </tbody>
      {% endfor %}
    {% endif %}
  </table>
{% endblock %}
