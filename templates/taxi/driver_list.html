{% extends "base.html" %}

{% block content %}
  <h2>Drivers</h2>
   <table>
    <tr>
      <th>ID</th>
      <th>first name</th>
      <th>last name</th>
      <th>username</th>
    </tr>
    {% for driver in object_list %}
    <tr>
      <td>{{ driver.id }}</td>
      <td>{{ driver.first_name|default:"–" }}</td>
      <td>{{ driver.last_name }}</td>
      <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
    </tr>
    {% endfor %}
  </table>
  {% include "includes/pagination.html" %}
{% endblock %}
