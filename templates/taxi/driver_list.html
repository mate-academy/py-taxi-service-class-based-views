{% extends "base.html" %}

{% block content %}
    <h1>Drivers</h1>

    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
            </tr>
        </thead>
        <tbody>
            {% for driver in object_list %}
            <tr>
                <td>{{ driver.id }}</td>
                <td>
                    <a href="{% url 'taxi:driver-detail' driver.id %}">
                        {{ driver.username }}
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2">No drivers found</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
