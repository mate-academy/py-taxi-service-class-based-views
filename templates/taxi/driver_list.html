{% extends "base.html" %}
{% block content %}
  <h1>Driver list</h1>
  <table class="table">
    <thead class="thead-dark">
    <tr>
      <th scope="col">#</th>
      <th scope="col">username</th>
      <th scope="col">First name</th>
      <th scope="col">Last name</th>
    </tr>
    </thead>
    <tbody>
    {% if driver_list %}
      {% for driver in driver_list %}
        <tr>
          <th scope="row">
            {{ driver.pk }}
          </th>
          <th scope="row">
            <a href="{{ driver.get_absolute_url }}">
              {{ driver.username }}
            </a>
          </th>
          <td>{{ driver.first_name }}</td>
          <td>{{ driver.last_name }}</td>
        </tr>
      {% endfor %}
    {% else %}
      <td colspan="4" class="text-center align-middle">Drivers not added</td>
    {% endif %}
    </tbody>
  </table>
{% endblock %}
