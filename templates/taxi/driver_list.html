{% extends "base.html" %}
{% block content %}
  <h1>Driver list</h1>
  {% if driver_list %}
    <table>
    <thead><tr><th>Username</th></tr></thead>
    <tbody>
      {% for driver in driver_list %}
        <tr><td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td></tr>
      {% endfor %}
    </tbody>
    </table>
  {% endif %}
{% endblock %}
