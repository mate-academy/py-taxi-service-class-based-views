{% extends "base.html" %}

{% block content %}
<h1>Drivers list</h1>
<hr>
{% if driver_list %}
<table>
  <thead>
  <tr>
    <th>Username</th>
    <th>first_name</th>
    <th>last_name</th>
  </tr>
  </thead>

  <tbody>
  {% for driver in driver_list %}
    <tr>
    <td><a href="{{ driver.get_absolute_url }}">{{ driver.username }} </a></td>
    <td>{{ driver.first_name }}</td>
    <td>{{ driver.last_name }}</td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% else %}
<p>No driver found</p>
{% endif %}

{% endblock %}
