{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>
  <table>
    <thead>
      <tr>
        <th>Username</th>
        <th>License Number</th>
        <th>First Name</th>
        <th>Last Name</th>
      </tr>
    </thead>
    <tbody>
    {% for driver in driver_list %}
      <tr>
        <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
        <td>{{ driver.license_number }}</td>
        <td>{{ driver.first_name }}</td>
        <td>{{ driver.last_name }}</td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="4">No drivers are available.</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
