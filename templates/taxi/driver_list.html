{% extends "base.html" %}

{% block content %}
  <table>
    <thead>
    <tr>
      <th>License number</th>
    </tr>
    </thead>
    <tbody>
    {% for driver in driver_list %}
      <tr>
        <td>
          <a href={% url "taxi:driver-detail" driver.id %}>{{ driver.username }}</a>
        </td>
      </tr>
    {% empty %}
      <li>No drivers found</li>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
