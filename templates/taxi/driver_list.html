{% extends "base.html" %}

{% block content %}
<h1>Driver List</h1>
  <table>
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Full name</th>
      <th>License number</th>
    </tr>
    {% for driver in driver_list %}
    <tr>
      <td>{{ driver.id }}</td>
      <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
      <td>{{ driver.first_name }} {{ driver.last_name }}</td>
      <td>{{ driver.license_number }}</td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
