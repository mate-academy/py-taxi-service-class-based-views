{% extends 'base.html' %}

{% block content %}
  <h1>Driver List</h1>
  {% if driver_list %}
    <ul>
      {% for driver in driver_list %}
        <li><a href="{% url "taxi:driver-detail" driver.id %}">This car is driven by: {{ driver.username }}</a></li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
