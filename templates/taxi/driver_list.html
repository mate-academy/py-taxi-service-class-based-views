{% extends 'base.html' %}

{% block content %}
  <h1>Drivers List</h1>
  {% if driver_list %}
    <table>
      <thead>
        <tr>
          <th>Username</th>
          </tr>
      </thead>
      <tbody>
        {% for driver in driver_list %}
          <tr>
            <td><a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a></td>
            </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>There are no drivers</p>
  {% endif %}
{% endblock %}
