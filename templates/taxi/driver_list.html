{% extends "base.html" %}

{% block content %}
  <table>
    {% for driver in driver_list %}
      <tr>
        <td>
          <a href="{% url 'taxi:driver-detail' pk=driver.id %}">{{ driver.username }}</a>
        </td>
        <td>
          {{ driver.license_number }}
        </td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
