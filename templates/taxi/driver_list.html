{% extends "base.html" %}

{% block content %}
  <h1>Drivers</h1>
  <ul>
    {% if driver_list%}
      {% for driver in driver_list %}
        <li>
          <a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a>
        </li>
      {% endfor %}
    {% endif %}

  </ul>
{% endblock %}
