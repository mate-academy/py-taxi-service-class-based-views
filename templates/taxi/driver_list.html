{% extends "base.html" %}

{% block content %}
  <h1>Drivers:</h1>
  <hr>
  <table>
    {% for driver in driver_list %}
      <tr><td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a> {{ driver.first_name }} {{ driver.last_name }}</td></tr>
    {% empty %}
      <tr><td>No driver found!</td></tr>
    {% endfor %}
  </table>
{% endblock %}
