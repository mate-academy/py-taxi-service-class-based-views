{% extends "base.html" %}
{% block content %}
  <h1>Drivers</h1>
  {% if driver_list %}
    <table>
      <thead>
      <tr>
        <th>Username</th>
        <th>Full name</th>
        <th>License</th>
      </tr>
      </thead>
      <tbody>
      {% for driver in driver_list %}
        <tr>
          <td><a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a></td>
          <td>{{ driver.get_full_name }}</td>
          <td>{{ driver.license_number }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p class="no-items">No drivers at the moment</p>
  {% endif %}

{% endblock %}
