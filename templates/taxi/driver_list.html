{% extends "base.html" %}

{% block content %}
<h2>Drivers</h2>
<table>
    <tr>
        <th>Username</th>
        <th>First Name</th>
        <th>Last Name</th>
    </tr>
    {% for driver in drivers %}
    <tr>
        <td><a href="{% url 'taxi:driver_detail' driver.pk %}">{{ driver.username }}</a></td>  <!-- ✅ Fixed -->
        <td>{{ driver.first_name }}</td>
        <td>{{ driver.last_name }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3"><em>No drivers available.</em></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
