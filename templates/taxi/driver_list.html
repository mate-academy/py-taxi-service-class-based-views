{% extends "base.html" %}
{% block content %}
  <h1>Drivers</h1>
  <ul>
    {% for driver in driver_list %}
      <li><a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a>; {{ driver.first_name }} {{ driver.last_name }}</li>
    {% empty %}
      <li>There are no drivers in service</li>
    {% endfor %}
  </ul>
{% endblock %}
