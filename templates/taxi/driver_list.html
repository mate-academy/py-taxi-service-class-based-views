{% extends "base.html" %}
{% block content %}
  <h2>Drivers</h2>
  <table>
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>First name</th>
      <th>Last name</th>
    </tr>
    {% for driver in object_list %}
      <tr>
        <td>{{ driver.id }}</td>
        <td>
          <a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a>

        </td>
        <td>{{ driver.first_name }}</td>
        <td>{{ driver.last_name }}</td>
      </tr>
    {% endfor %}
  </table>
  {% include "includes/pagination.html" %}
{% endblock %}
