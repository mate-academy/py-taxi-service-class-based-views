{% extends "base.html" %}

{% block content %}
<h1>Drivers</h1>
{% if driver_list %}
<table border="1" cellspacing="0" cellpadding="5">
    <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>First Name</th>
            <th>Last Name</th>
        </tr>
    </thead>
    <tbody>
        {% for driver in driver_list %}
            <tr>
                <td>{{ driver.id }}</td>
                <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
                <td>{{ driver.first_name }}</td>
                <td>{{ driver.last_name }}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>No drivers found.</p>
{% endif %}
{% endblock %}
