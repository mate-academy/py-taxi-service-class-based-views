{% extends "base.html" %}

{% block content %}
  <h1>Drivers</h1>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>#</th>
        <th>Username</th>
        <th>License</th>
      </tr>
    </thead>
    <tbody>
      {% for driver in object_list %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td><a href="{% url 'taxi:driver-detail' driver.pk %}">{{ driver.username }}</a></td>
        <td>{{ driver.license_number }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3">No drivers.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
