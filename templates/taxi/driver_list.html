{% extends 'base.html' %}
{% block content %}
  <table>
    <thead>
    <tr>
      <th>Drivers</th>
    </tr>
    </thead>

    {% if driver_list %}
      <tbody>
      {% for driver in driver_list %}
        <tr>
          <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
        </tr>
      {% endfor %}
      </tbody>
    {% else %}
      <p>There are no Drivers</p>
    {% endif %}

  </table>
{% endblock %}
