{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">Driver List</h2>
  <table class="table table-striped">
    <thead class="thead-dark">
      <tr>
        <th scope="col">#ID</th>
        <th scope="col">Username</th>
        <th scope="col">License number</th>
      </tr>
    </thead>
    <tbody id="driver-table-body">
      {% for driver in object_list %}
      <tr>
        <td>
          <a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.id }}</a>
        </td>
        <td>{{ driver.username }}</td>
        <td>{{ driver.license_number }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3" class="text-center">No drivers found.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
