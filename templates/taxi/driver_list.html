{% extends "base.html" %}


{% block content %}

  <h1>Driver </h1>
  {% if driver_list %}
    <ul>
      {% for driver in driver_list %}
        <li> <a href="{% url "taxi:driver-detail" pk=driver.id  %}">{{ driver.username }}</a>, {{ driver.first_name }}, {{ driver.last_name }} License: {{ driver.license_number }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
