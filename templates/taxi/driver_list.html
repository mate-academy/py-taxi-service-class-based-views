{% extends "base.html" %}

{% block content %}
<h2>Drivers</h2>
<table>
  <thead>
  <tr>
    <th>Username</th>
    <th>Email</th>
    <th>License Number</th>
  </tr>
  </thead>
  <tbody>
  {% for driver in object_list %}
  <tr>
    <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
    <td>{{ driver.email }}</td>
    <td>{{ driver.license_number }}</td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
