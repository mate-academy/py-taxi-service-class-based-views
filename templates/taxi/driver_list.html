{% extends "base.html" %}
{% block content %}
  {% for driver in driver_list %}
    <ul>
      <li>ID: {{ driver.id }}</li>
      <li>Name: <a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.first_name }} {{ driver.last_name }}</a>
      </li>
    </ul>
  {% endfor %}

{% endblock %}
