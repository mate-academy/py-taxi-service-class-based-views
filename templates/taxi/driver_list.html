{% extends "base.html"%}

{% block content %}
  <h1>Driver List</h1>
  {% if driver_list %}
  <table>
    <tr>
      <th>ID</th>
      <th>First name</th>
      <th>Last name</th>
    </tr>
    {% for driver in driver_list %}
      <tr>
        <th><a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a></th>
        <th>{{ driver.first_name }}</th>
        <th>{{ driver.last_name }}</th>
      </tr>
    {% endfor %}
  </table>
  {% endif %}
{% endblock %}
