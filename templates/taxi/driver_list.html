{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>

  {% if driver_list %}
    <table class="table">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>License Number</th>
        </tr>
      </thead>
      <tbody>
        {% for driver in driver_list %}
          <tr>
            <td>{{ driver.id }}</td>
            <td>
              <a href="{% url 'taxi:driver-detail' driver.pk %}">
                {{ driver.username }}
              </a>
            </td>
            <td>{{ driver.license_number }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No drivers!</p>
  {% endif %}
{% endblock %}
