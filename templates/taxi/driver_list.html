{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>
  {% if driver_list %}
    <ul>
      {% for driver in driver_list %}
        {% for car in driver.cars.all %}
          <li>
            <a href="{% url 'taxi:car-detail' car.pk %}">
              {{ driver.license_number }}
            </a>
          </li>
        {% endfor %}
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no drivers</p>
  {% endif %}
{% endblock %}
