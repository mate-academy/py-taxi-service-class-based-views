{% extends "base.html" %}

{% block content %}
  <h1>Drivers list</h1>
  <table>
    <tr>
        <th>Username</th>
        <th>Name</th>
        <th>Lastname</th>
        <th>Licence</th>
    </tr>
    {% for driver in driver_list %}
      <tr>
        <td><a href={% url "taxi:driver-detail" driver.id %}>{{ driver.username }}</a></td>
        <td>{{ driver.first_name }}</td>
        <td>{{ driver.last_name }}</td>
        <td>{{ driver.license_number }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
