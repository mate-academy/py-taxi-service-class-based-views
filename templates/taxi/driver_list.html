{% extends "base.html" %}

{% block content %}
  <h1>Drivers List</h1>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>First name</th>
        <th>Last name</th>
      </tr>
    </thead>
    <tbody>
      {% for driver in driver_list %}
        <tr>
          <td>{{ driver.id }}</td>
          <td>
            <a href="{% url 'taxi:driver-detail' driver.id %}">
              {{ driver.username }}
            </a>
          </td>
          <td>{{ driver.first_name }}</td>
          <td>{{ driver.last_name }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="4">No drivers available.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

{% endblock %}
