{% extends "base.html" %}

{% block title %}Drivers{% endblock %}

{% block content %}
  <h1>Drivers</h1>
  {% if driver_list %}
    <table>
      <tr>
        <th>Username</th>
        <th>License Number</th>
      </tr>
      {% for driver in driver_list %}
        <tr>
          <td><a href="{% url 'taxi:driver-detail' driver.pk %}">{{ driver.username }}</a></td>
          <td>{{ driver.license_number }}</td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>No drivers found.</p>
  {% endif %}
{% endblock %}
