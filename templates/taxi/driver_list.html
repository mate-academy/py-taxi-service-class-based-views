{% extends "base.html" %}

{% block content %}
  {% if driver_list %}
  <table>
    <thead>
      <tr>
        <th>Username</th>
        <th>License number</th>
      </tr>
    </thead>
    <tbody>
    {% for driver in driver_list %}
      <tr>
        <td><a href="{% url "taxi:driver-detail" driver.id %}">{{ driver.username }}</a></td>
        <td>{{ driver.license_number }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  {% else %}
    <p>No drivers found</p>
  {% endif %}
{% endblock %}
