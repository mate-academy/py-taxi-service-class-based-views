{% extends "base.html" %}
{% block content %}
  <table>
    <thead>
    <tr>
      <th>Drivers:</th>
    </tr>
    </thead>
    <tbody>
    {% for driver in drivers %}
      <tr>
        <td><a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a></td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
