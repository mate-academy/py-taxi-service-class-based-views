{% extends "base.html" %}

{% block content %}
	<table>
        <thead>
            <td>Id</td>
            <td>Model</td>
            <td>Manufacturer</td>
            <td>Drivers</td>
        </thead>
        <tbody>
            {% for driver in driver_list %}
            <tr>
                <td>{{ driver.first_name }}</td>
                <td>{{ driver.last_name }}</td>
                <td>
                    <a href="{% url "taxi:driver-detail" driver.pk %}">{{ driver.username }}</a>
                </td>
            </tr>
            {% endfor %}

        </tbody>
    </table>
{% endblock %}
