{% extends "base.html" %}

{% block content %}
  {% if driver_list %}
    <table class="table">
      <tr>
        <th>Id</th>
        <th>Username</th>
      </tr>
      {% for driver in driver_list %}
        <tr>
          <td>{{ driver.id }}</td>
          <td><a href={{ driver.get_absolute_url }}> {{ driver.username }}</a></td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>There are no drivers</p>
  {% endif %}
{% endblock %}
