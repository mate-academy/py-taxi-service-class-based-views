{% extends "base.html" %}

{% block content %}
  <h1>Drivers</h1>
  <p>
    <ul>
      {% if driver_list %}
        {% for driver in driver_list %}
          <li>
          <a href="{% url "taxi:driver-detail" driver.id %}">
            {{ driver.license_number }}
          </a>
          </li>
        {% endfor %}
      {% else %}
        Not any drivers in taxi
      {% endif %}
    </ul>
  </p>
{% endblock %}
