{% extends "base.html" %}

{% block content %}
  <h1>Drivers</h1>

  <ul>
    {% for driver in object_list %}
      <li>
        <a href="{% url 'taxi:driver-detail' driver.id %}">
          {{ driver.username }}
        </a>
        — {{ driver.first_name }} {{ driver.last_name }}
      </li>
    {% empty %}
      <li>No drivers available.</li>
    {% endfor %}
  </ul>

{% endblock %}
