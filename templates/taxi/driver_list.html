{% extends "base.html" %}

{% block content %}
  <h1>Drivers</h1>
  <table class="table_driver_list">
    <thead>
      <tr>
        <th>Username</th>
      </tr>
    </thead>
    <tbody>
      {% for driver in object_list %}
        <tr>
          <td>
            <a href="{% url "taxi:driver-detail" driver.pk %}">{{ driver.username }}</a>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="1">No drivers available</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
  {% include "includes/pagination.html" %}

{% endblock %}
