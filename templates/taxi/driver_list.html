{% extends "base.html" %}

{% block content %}
<h1>Drivers</h1>
{% if driver_list %}
<div class="table-responsive">
  <table class="table table-striped table-hover table-bordered align-middle">
    <thead class="table-dark">
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Username</th>
      </tr>
    </thead>
    <tbody>
      {% for driver in driver_list %}
      <tr>
        <td>{{ driver.first_name }}</td>
        <td>{{ driver.last_name }}</td>
        <td><a class="btn btn-primary btn-sm" href="{% url 'taxi:driver-detail' driver.pk %}">{{ driver.username }}</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endif %}
{% endblock %}
