{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>
  <table class="table">
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Driver License</th>
    </tr>
    {% for driver in driver_list %}
      <tr>
        <td>{{ driver.id }}</td>
        <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
        <td>{{ driver.license_number }}</td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="3">No drivers yet!</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
