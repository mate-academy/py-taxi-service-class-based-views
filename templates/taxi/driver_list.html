{% extends "base.html" %}

{% block content %}
  <h1>Driver list</h1>

  {% if driver_list %}
    <table>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Full name</th>
      </tr>

      {% for driver in driver_list %}
        <tr>
          <td>{{ driver.id }}</td>
          <td>
            <a href="{% url 'taxi:driver-detail' pk=driver.id %}">
              {{ driver.username }}
            </a>
          </td>
          <td>{{ driver.first_name }} {{ driver.last_name }}</td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>There are no drivers.</p>
  {% endif %}
{% endblock %}
