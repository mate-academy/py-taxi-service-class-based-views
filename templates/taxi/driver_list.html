{% extends "base.html" %}
{% block content %}
  <h1>Drivers</h1>
  <table>
  <thead>
  <tr>
    <th>ID</th>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Username</th>
  </tr>
  </thead>
  <tbody>
  {% for driver in object_list %}
    <tr>
    <td>{{ driver.pk }}</td>
    <td>{{ driver.first_name }} </td>
    <td>{{ driver.last_name }}</td>
    <td><a href="{% url 'taxi:driver-detail' driver.pk %}">{{ driver.username }}</a></td>
    </tr>
    {% empty %}
    <tr>
    <td colspan="4"> No drivers</td>
    </tr>
  {% endfor %}
  </tbody>
  </table>
  {% include "includes/pagination.html" %}
{% endblock %}
