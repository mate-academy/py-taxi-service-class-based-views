{% extends "base.html" %}
{% block content %}
	<h1>Drivers List</h1>
  {% if driver_list %}
  	{% for driver in driver_list %}
  		<table>
        <tr><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.first_name }} {{ driver.last_name }}</a></tr>
      </table>
  	{% endfor %}
  {% endif %}
{% endblock %}
