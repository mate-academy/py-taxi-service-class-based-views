{% extends "base.html" %}
{% block title %}<title>Taxi Service - Drivers</title>{% endblock %}
{% block content %}
  <ul>
    {% for driver in driver_list %}
      <li>
        <a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a>
      </li>
    {% empty %}
      <li>There's no drivers on a Taxi Service.</li>
    {% endfor %}
  </ul>
{% endblock %}
