{% extends "base.html" %}
{% block content %}
  <h1>Drivers</h1>
  <table>
    <thead>
    <tr>
      <th>Username</th>
      <th>First name</th>
      <th>Last name</th>
    </tr>
    </thead>
    <tbody>
    {% for driver in driver_list %}
      <tr>
        <td>
          <a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a>
        </td>
        <td>{{ driver.first_name }}</td>
        <td>{{ driver.last_name }}</td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="3">There are no drivers in service</td>
      </tr>
    {% endfor %}

    </tbody>
  </table>
{% endblock %}
