{% extends "base.html" %}

{% block content %}
  <h1>Drivers:</h1>
  <ul>
  {% for driver in driver_list %}
    <li>
      <span>Username: <a href="{% url "taxi:driver-detail" driver.id %}">{{ driver.username }}</a>,</span>
      {{ driver.first_name }} {{ driver.last_name }}
    </li>
  {% empty %}
    <p>No cars found in the database.</p>
  {% endfor %}
  </ul>
{% endblock %}
