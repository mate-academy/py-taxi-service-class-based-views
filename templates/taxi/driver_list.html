{% extends 'base.html' %}
{% block content %}
  <h1>Cars</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>License_number</th>
      </tr>
    </thead>
    <tbody>
      {% for driver in object_list %}
        <tr>
         <td><a href="{% url 'taxi:driver-detail' driver.pk %}">{{ driver.username }}</a></td>
          <td>{{ driver.license_number }}</td>
        </tr>
      {% empty %}
        <tr><td colspan="N">No drivers found</td></tr>
      {% endfor %}
    </tbody>
  </table>
  {% include 'includes/pagination.html' %}
{% endblock %}
