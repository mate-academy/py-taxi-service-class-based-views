{% extends "base.html" %}

{% block content %}
  <h1>Driver list</h1>

  <ul>
    {% for driver in object_list %}
      <li>
        <a href="{% url 'taxi:driver-detail' driver.id %}">
          {{ driver.username }} - {{ driver.first_name }} {{ driver.last_name }}
        </a>
      </li>
    {% empty %}
      <li>No drivers available.</li>
    {% endfor %}
  </ul>

  {% include "includes/pagination.html" %}
{% endblock %}
