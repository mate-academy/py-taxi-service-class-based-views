{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>
  <style>
      table, th, td {
          border: 1px solid black;
      }
  </style>

  {% if driver_list %}
    <table style="width: 30%">

      <tr>
        <th>Username</th>
        <th>Full Name</th>
      </tr>

      {% for driver in driver_list %}

        <tr>
          <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
          <td>{{ driver.first_name }} {{ driver.last_name }}</td>
        </tr>

      {% endfor %}
    </table>
  {% endif %}
{% endblock %}
