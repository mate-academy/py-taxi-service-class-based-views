{% extends "base.html" %}

{% block content %}
  <h1>
    Driver List
  </h1>
  <table class="table">
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>First name</th>
      <th>Last name</th>
    </tr>
    {% for driver in driver_list %}
      <tr>
        <td>{{ driver.id }}</td>
        <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
        <td>{{ driver.first_name }}</td>
        <td>{{ driver.last_name }}</td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="4">There are no drivers in the service.</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
