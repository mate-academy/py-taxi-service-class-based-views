{% extends 'base.html' %}
{% block content %}
  <h1>List of drivers</h1>
  {% if driver_list %}
    <table>
    {% for driver in driver_list %}
    <tr> <td><a href="{{ driver.get_driver_url }}">{{driver.username}} {{ driver.license_number }}</a></td></tr>
    {% endfor %}
    </table>
    {% else %}
    <p>There aren't any drivers</p>
  {% endif %}
{% endblock %}
