{% extends "base.html" %}

{% block content %}
    <h2>Drivers</h2>
    <table>
        <tr>
            <th>Username</th>
            <th>License</th>
        </tr>
        {% for driver in drivers %}
            <tr>
                <td><a href="{% url 'driver-detail' driver.id %}">{{ driver.username }}</a></td>
                <td>{{ driver.license_number }}</td>
            </tr>
        {% endfor %}
    </table>
    {% include "includes/pagination.html" %}
{% endblock %}
