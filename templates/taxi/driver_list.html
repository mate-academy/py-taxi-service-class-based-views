{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>
    {% if driver_list %}
      <table>
        <tr>
          <th>Username</th>
          <th>License number</th>
          <th>First Name</th>
          <th>Last Name</th>
        </tr>
        {% for driver in driver_list %}
          <tr>
            <th>
              <a href="{% url "taxi:driver-detail" driver.id %}">
                {{ driver.username }}
              </a>
            </th>
            <th>
            {{ driver.license_number }},
            </th>
            <th>
            {{ driver.first_name }},
            </th>
            <th>
            {{ driver.last_name }}
            </th>
          </tr>
        {% endfor %}
      </table>
    {% endif %}
{% endblock %}
