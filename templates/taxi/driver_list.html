{% extends "base.html" %}

{% block content %}
  <table>
    <tr>
      <th>Username</th>
      <th>First_name</th>
      <th>Last_name</th>
      <th>E-mail</th>
      <th>License_number</th>
    </tr>
    {% for driver in driver_list %}
      <tr>
        <td>
          <a href="{% url 'taxi:driver-detail' pk=driver.id%}">{{ driver.username }}</a>
        </td>
        <td>{{ driver.first_name }}</td>
        <td>{{ driver.last_name }}</td>
        <td>{{ driver.email }}</td>
        <td>{{ driver.license_number }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
