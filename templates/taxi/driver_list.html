{% extends "base.html" %}
{% block content %}
  <h1>Drivers list:</h1>
  <table class="table table-striped">
    <thead>
    <tr>
      <th>Username:</th>
      <th>First Name:</th>
      <th>Last Name:</th>
      <th>License number:</th>
    </tr>
    </thead>
    <tbody>
    {% for driver in object_list %}
      <tr>
        <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
        <td>{{ driver.first_name }}</td>
        <td>{{ driver.last_name }}</td>
        <td>{{ driver.license_number }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
