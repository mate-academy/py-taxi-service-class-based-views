{% extends "base.html" %}

{% block content %}
  <h1>Drivers list</h1>
  {% if driver_list %}
    <table class="table table-striped">
      <thead>
        <tr>
          <td>ID</td>
          <td>Username</td>
        </tr>
      </thead>
      <tbody>
        {% for driver in driver_list %}
          <tr>
            <td>{{ driver.id }}</td>
            <td><a href="{% url "taxi:driver-detail" driver.id %}">{{ driver.username }}</a></td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    There are no cars.
  {% endif %}
{% endblock %}
