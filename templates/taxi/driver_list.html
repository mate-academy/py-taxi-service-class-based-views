{% extends "base.html" %}

{% block title %}
  <h1>Drivers</h1>
{% endblock %}

{% block content %}
  {% if driver_list %}
    {% for driver in driver_list %}
      <ul>
        <li>
          <a href={% url 'taxi:driver-detail' driver.id %}>{{ driver.username }}</a>
        </li>
      </ul>
    {% endfor %}
  {% endif %}
{% endblock %}
