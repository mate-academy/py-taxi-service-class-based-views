{% extends "base.html" %}

{% block content %}
  <h1>Drivers:</h1>

  {% if driver_list %}
    <table>
      <tr>
        <th>ID</th>
        <th>Username</th>
      </tr>
      {% for driver in driver_list %}
        <tr>
          <td>
            <a href="{{ driver.get_absolute_url }}">{{ driver.id }}</a>
          </td>
          <td>{{ driver.username }}</td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>There are no drivers</p>
  {% endif %}
{% endblock %}
