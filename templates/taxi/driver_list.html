{% extends "base.html" %}

{% block content %}
  {% if driver_list %}
    <table>
      <tr>
        <th>Driver List</th>
      </tr>
      {% for driver in driver_list %}
      <tr>
        <td><a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a></td>
      </tr>
      {% endfor %}
    </table>
  {% endif %}

{% endblock %}
