{% extends "base.html" %}

{% block content %}
  <h1>Drivers</h1>
  <table>
    <tr><th>Username</th><th>First Name</th><th>Last Name</th></tr>
      {% for driver in driver_list %}
        <tr>
          <td><a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a></td>
          <td><a href="{{ driver.get_absolute_url }}">{{ driver.first_name }}</a></td>
          <td><a href="{{ driver.get_absolute_url }}">{{ driver.last_name }}</a></td>
        </tr>
      {% empty %}
        <tr><td colspan="3">No drivers found.</td></tr>
      {% endfor %}
  </table>
{% endblock %}
