{% extends 'base.html' %}

{% block content %}
  <h1>Driver list</h1>
  {% if driver_list %}
    <table class="table">
      <tr>
        <th>ID</th>
        <th>Driver name</th>
      </tr>
      {% for driver in driver_list %}
        <tr>
          <td>{{ driver.id }}</td>
          <td><a href='{% url 'taxi:driver-detail' pk=driver.pk%}'>{{ driver.first_name }} {{ driver.last_name }}</a></td>
        </tr>
      {% endfor %}
    </table>

  {% endif %}
{% endblock %}
