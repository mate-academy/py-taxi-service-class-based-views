{% extends "base.html" %}
{% block content %}
    <h1>Drivers</h1>
    <table>
      <tr>
          <th>Name</th>
          <th>license number</th>
      </tr>
      {% for driver in driver_list %}
          <tr>
            <td>{{ driver.first_name }} {{ driver.last_name }}</td>
            <td><a href={% url 'taxi:driver-detail' driver.id %}>{{ driver.license_number }}</a></td>
          </tr>
      {% endfor %}
    </table>
{% endblock %}
