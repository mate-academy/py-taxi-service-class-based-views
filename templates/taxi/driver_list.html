{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>
  {% if driver_list %}
    <tr>
      {% for driver in driver_list %}
        <td><a href="{{ driver.get_absolute_url }}">{{ driver.first_name }} {{ driver.last_name }}({{ driver.license_number }})</a></td>
      {% endfor %}
    </tr>
  {% else %}
    <p>There are no drivers in the Taxi Service</p>
  {% endif %}
{% endblock %}
