{% extends "base.html" %}
{% block content %}
  <h1>List of Drivers</h1>
  <ul>
    {% for driver in driver_list %}
      <li><a
          href="{{ driver.get_absolute_url }}">{{ driver.username }} ({{ driver.first_name }} {{ driver.last_name }})</a>
      </li>
    {% empty %}
      <p>No drivers found.</p>
    {% endfor %}
  </ul>
{% endblock %}
