{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>

  <table class="data-table" border="1" cellpadding="15" cellspacing="0">
    <thead>
      <tr>
        <th>Username</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>License Number</th>
      </tr>
    </thead>
    <tbody>
      {% for driver in driver_list %}
        <tr>
          <td><a href="{{ driver.get_absolute_url }}">{{driver.username}}</a></td>
          <td>{{ driver.first_name }}</td>
          <td>{{ driver.last_name }}</td>
          <td>{{ driver.license_number }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="4">No drivers found.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
