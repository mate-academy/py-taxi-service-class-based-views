{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>
  {% if driver_list %}
    <table>
    <thead>
    <tr>
      <th>Username</th>
      <th>First Name</th>
      <th>Last Name</th>
    </tr>
    </thead>
    <tbody>
   {% for driver in driver_list %}
     <tr>
     <td>
       <a href="{{ driver.get_absolute_url }}">{{ driver.username }} </a>
     </td>
     <td>{{ driver.first_name }}</td>
     <td>{{ driver.last_name }}</td>
     </tr>
    {% endfor %}
    </tbody>
    </table>
  {% endif %}
{% endblock %}
