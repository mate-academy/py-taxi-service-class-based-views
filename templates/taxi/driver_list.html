{% extends "base.html" %}

{% block content %}
  <h3 style="text-align: center;">Drivers</h3>
  <table border="1" style="margin: 0 auto;">
    {% for driver in driver_list %}
      <tr>
        <td>{{ driver.id }}</td>
        <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
