{% extends "base.html" %}

{% block content %}
  <h1>Drivers List</h1>
  <ul>
    {% for driver in driver_list %}
        <li><a href="{% url "taxi:driver-detail" driver.pk %}">{{ driver.username }} - </a>{{ driver.license_number }}</li>
    {% empty %}
      <li>No drivers found.</li>
    {% endfor %}
  </ul>
  {% include "includes/pagination.html" %}
{% endblock %}
