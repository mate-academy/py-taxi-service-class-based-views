{% extends "base.html" %}
{% block content %}
<h1>Drivers</h1>
<table>
  <tr>
    <th>Username</th>
    <th>Name</th>
    <th>License number</th>
  </tr>

  {% for driver in driver_list %}
    <tr>
      <td><a href="{% url 'taxi:driver-detail' pk=driver.id %}">
        {{ driver.username }}
      </a></td>
      <td>{{ driver.first_name }} {{ driver.last_name }}</td>
      <td>{{ driver.license_number }}</td>
    </tr>
  {% endfor %}
</table>
{% endblock %}
