{% extends "base.html" %}

{% block content %}
  <table class="table table-bordered table-striped table-hover">
    <tr>
      <th>username</th>
      <th>license_number</th>
    </tr>
    {% for driver in driver_list %}
    <tr>
      <td><a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a></td>
      <td>{{ driver.license_number }}</td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
