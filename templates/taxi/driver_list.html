{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>

  {% if driver_list %}
    <table border="1" cellpadding="8" cellspacing="0">
      <thead>
      <tr>
        <th>Username</th>
        <th>First name</th>
        <th>Last name</th>
      </tr>
      </thead>

      <tbody>
      {% for driver in driver_list %}
        <tr class="driver_list_style">
          <td>
            <a href="{{ driver.get_absolute_url }}">
              {{ driver.username }}
            </a>
          </td>

          <td>{{ driver.first_name }}</td>
          <td>{{ driver.last_name }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>

  {% else %}
    <p>There are no Drivers!</p>
  {% endif %}

{% endblock %}
