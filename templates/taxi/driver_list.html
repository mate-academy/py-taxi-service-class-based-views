{% extends "base.html" %}
{% block content %}
<h2>Drivers List</h2>
<table>
  <tr><th>Name</th><th>License number</th></tr>
  {% for driver in object_list %}
    <tr>
      <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
      <td>{{ driver.license_number }}</td>
    </tr>
  {% endfor %}
</table>
{% include "includes/pagination.html" %}
{% endblock %}
