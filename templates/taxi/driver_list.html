{% extends "base.html" %}
{% block content %}
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Driver</th>
    </tr>
  </thead>
  <tbody>
    {% for driver in driver_list %}
      <tr>
        <td>{{ driver.id }}</td>
        <td>
          <a href="{% url 'taxi:driver-detail' driver.id %}">
            {{ driver.username }}
          </a>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
