{% extends "base.html" %}
{% block title %}
  <title>Drivers</title>
{% endblock %}
{% block content %}
  <h1>Drivers List</h1>
  {% if driver_list %}
    <table cellpadding="8" cellspacing="4" border="1">
      <thead>
      <tr>
        <th>Username</th>
        <th>Driver's full name</th>
      </tr>
      </thead>
      <tbody>
      {% for driver in driver_list %}
        <tr>
          <td>
            <a href="{% url 'taxi:driver-detail' driver.id %}">
              {{ driver.username }}
            </a>
          </td>
          <td>{{ driver.first_name }} {{ driver.last_name }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
