{% extends "base.html" %}

{% block title %}<title>Drivers</title>{% endblock %}

{% block content %}
  <h1>Driver list</h1>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>License number</th>
      </tr>
    </thead>
    <tbody>
      {% for driver in driver_list %}
        <tr>
          <td>{{ driver.id }}</td>
          <td>
            <a href="{% url 'taxi:driver-detail' pk=driver.id %}">
              {{ driver.username }}
            </a>
          </td>
          <td>{{ driver.license_number }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3">There are no drivers.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
