{% extends "base.html" %}

{% block content %}
  <h1>Drivers List</h1>
  {% if driver_list %}
    <table>
    {% for driver in driver_list %}
      <tr>
        <td><a href="{% url "taxi:driver-detail" driver.id %}">{{ driver.username }}</a></td>
        <td>{{ driver.first_name }}{{ driver.last_name }}</td>
      </tr>
    {% endfor %}
    </table>
    {% else %}
    <p>There are no Drivers to display</p>
  {% endif %}
{% endblock %}
