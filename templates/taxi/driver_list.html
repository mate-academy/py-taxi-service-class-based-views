{% extends "base.html" %}
{% block content %}
  {% if driver_list %}
    <ul>
      {% for driver in driver_list %}
        <li>
          <a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a>
          <p>{{ driver.first_name }} {{ driver.last_name }}</p>
        </li>
      {% endfor %}
    </ul>
    {% else %}
      <p>There is no any driver</p>
  {% endif %}
{% endblock %}
