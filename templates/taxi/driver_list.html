{% extends "base.html" %}

{% block content %}


  {% if driver_list %}
    <h2>DRIVERS:</h2>
    <table>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>License Number</th>
      </tr>
      {% for driver in driver_list %}
        <tr>
          <td>{{ driver.id }}</td>
          <td><a href="{% url 'taxi:driver-detail' driver.pk %}">{{ driver.username }}</a></td>
          <td>{{ driver.license_number }}</td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <h2>Currently, there are no drivers!</h2>
  {% endif %}


{% endblock %}
