{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>

  {% if driver_list %}
    <table>
      {% for driver in driver_list %}
        <tr>
          <td>
            <a href="{% url 'taxi:driver-detail' driver.id %}">
              {{ driver.username }}
            </a>
            <p>{{ driver.first_name }} {{ driver.last_name }}</p>
          </td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>No drivers found.</p>
  {% endif %}
{% endblock %}
