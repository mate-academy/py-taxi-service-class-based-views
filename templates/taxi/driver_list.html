{% extends "base.html" %}

{% block content %}
    <h1>Drivers table</h1>
        <table border="1">
            <thead>
                <tr>
                    <th>id</th>
                    <th>Username</th>
                    <th>First name</th>
                    <th>Last name</th>
                </tr>
            </thead>
            {% if driver_list %}
                {% for driver in driver_list %}
                    <tr>
                        <td>{{ driver.id }}</td>
                        <td><a href={{ driver.get_absolute_url }}>{{ driver.username}}</a></td>
                        <td>{{ driver.first_name }}</td>
                        <td>{{ driver.last_name }}</td>
                    </tr>
                {% endfor %}
            {% endif %}
        </table>
{% endblock %}
