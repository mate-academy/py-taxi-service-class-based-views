{% extends "base.html" %}

{% block content %}
  <h1>Drivers list:</h1>
  {% if driver_list %}
    <table border="1">
      <thead>
        <tr>
          <th>ID</th>
          <th>Driver</th>
        </tr>
      </thead>
      <tbody>
        {% for driver in driver_list %}
          <tr>
            <td>{{ driver.id }}</td>
            <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No drivers found.</p>
  {% endif %}
{% endblock %}
