{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>
  {% if driver_list %}
    <table>
      {% for driver in driver_list %}
        <tr>
          <td><a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a></td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    There are no drivers in the database
  {% endif %}
{% endblock %}
