{% extends "base.html" %}

{% block content %}
  <h1>Drivers list</h1>
  {% if driver_list %}
    <table class="table">
      <thead>
        <tr>
          <th>Username</th>
          <th>First name</th>
          <th>Last name</th>
        </tr>
      </thead>
      <tbody>
        {% for driver in driver_list %}
          <tr>
            <td>
              <a href="{% url 'taxi:driver-detail' pk=driver.pk %}">
                {{ driver.username }}
              </a>
            </td>
            <td>{{ driver.first_name }}</td>
            <td>{{ driver.last_name }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
