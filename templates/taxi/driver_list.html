{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>
  {% for driver in driver_list %}
    <li class="list-group-item">
      <a class="btn btn-primary" href="{% url 'taxi:driver-detail' driver.id %}">
        {{ driver.username }}
      </a>
    </li>
  {% endfor %}
{% endblock %}
