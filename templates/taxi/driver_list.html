<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>List of Drivers</title>
</head>
<body>
  <h1>List of Drivers</h1>
  <table>
    <thead>
      <tr>
        <th>Username</th>
        <th>First name</th>
        <th>Last name</th>
        <th>License number</th>
      </tr>
    </thead>
    <tbody>
      {% for driver in object_list %}
      <tr>
        <td>
          <a href="{% url 'taxi:driver-detail' driver.id %}">
            {{ driver.username }}
          </a>
        </td>
        <td>{{ driver.first_name }}</td>
        <td>{{ driver.last_name }}</td>
        <td>{{ driver.license_number }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
