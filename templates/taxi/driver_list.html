{% extends "base.html" %}

{% block content %}
  <h1>Drivers List</h1>
  <ul>
  {% for driver in driver_list %}
    <li><a href="{% url 'taxi:driver-detail' driver.pk %}">{{ driver.username }}</a> - {{ driver.license_number }}</li>
  {% empty %}
    <p>There are no drivers!</p>
  {% endfor %}
  </ul>
{% endblock %}
