{% extends "base.html" %}
{% block content %}
<h1>Drivers</h1>
<table>
  <tr>
    <th>ID</th>
    <th>Username</th>
  </tr>
  {% for driver in driver_list %}
  <tr>
    <td>{{ driver.pk }}</td>
    <td><a href="{% url 'taxi:driver-detail' driver.pk %}">{{ driver.username }}</a></td>
  </tr>
  {% endfor %}
</table>
{% include "includes/pagination.html" with page_obj=driver_list %}
{% endblock %}
