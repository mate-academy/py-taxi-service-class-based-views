{% extends "base.html" %}

{% block content %}
  <h1>Driver list</h1>
  {% if driver_list %}
    <table>
      <tr>
        <th>ID</th>
        <th>Username</th>
      </tr>
        {% for driver in driver_list %}
          <tr>
            <td>{{ driver.id }}</td>
            <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
          </tr>
        {% endfor %}
    </table>
  {% else %}
    No drivers found
  {% endif %}
{% endblock %}
