{% extends "base.html" %}
{% block content %}
  <h1>Drivers</h1>
  <ul class="list-group-item">
    {% for driver in driver_list %}
      <li>
        <a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.first_name }} {{ driver.last_name }}</a>
      </li>
    {% empty %}
      <p>No drivers.</p>
    {% endfor %}
  </ul>

{% endblock %}
