{% extends "base.html" %}

{% block content %}
  <h1>Drivers</h1>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Username</th>
        <th>License number</th>
      </tr>
    </thead>
    <tbody>
      {% for driver in driver_list %}
        <tr>
          <td>
            <a href="{% url 'taxi:driver-detail' pk=driver.id %}">
              {{ driver.username }}
            </a>
          </td>
          <td>{{ driver.license_number }}</td>
        </tr>
      {% empty %}
        <p>No drivers exist!</p>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
