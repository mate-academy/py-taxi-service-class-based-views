{% extends "base.html" %}

{% block content %}
  <h1>Drivers List</h1>

  <table border="1">
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>First name</th>
      <th>Last name</th>
    </tr>

    {% for driver in driver_list %}
      <tr>
        <td>{{ driver.id }}</td>

        <td>
          <a href="{% url 'taxi:driver-detail' pk=driver.id %}">
            {{ driver.username }}
          </a>
        </td>

        <td>{{ driver.first_name }}</td>
        <td>{{ driver.last_name }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
