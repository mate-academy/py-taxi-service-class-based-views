{% extends "base.html" %}

{% block content %}
  <h1>List of drivers</h1>

  {% if driver_list %}
    <ul>
    {% for driver in driver_list %}
      <li>
        <a href={{ driver.get_absolute_url }}> driver: <strong>{{ driver.username }}</strong></a>
      <hr>
      </li>
    {% endfor %}
    </ul>
  {% else %}
    <p>No drivers in list</p>
  {% endif %}
{% endblock %}
