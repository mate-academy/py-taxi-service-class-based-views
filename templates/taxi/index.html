{% extends "base.html" %}

{% block content %}
  <div class="container mt-4">
    <h1 class="display-4">Taxi Service Home</h1>
    <p class="lead">Welcome to Best Taxi Ever!</p>

    <div class="card mt-4">
      <div class="card-header bg-primary text-white">
        <h2 class="h5 mb-0">Dynamic content</h2>
      </div>
      <div class="card-body">
        <p>The Taxi service has the following record counts:</p>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <strong>Cars:</strong>
            <span class="badge bg-primary rounded-pill">{{ num_cars }}</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <strong>Drivers:</strong>
            <span class="badge bg-primary rounded-pill">{{ num_drivers }}</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <strong>Manufacturers:</strong>
            <span class="badge bg-primary rounded-pill">{{ num_manufacturers }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
{% endblock %}
