{% extends "base.html" %}

{% block title %}<title>Cars</title>{% endblock %}

{% block content %}
<h2>Cars</h2>

<ul>
  {% for car in car_list %}
    <li>
      <a href="{% url 'taxi:car-detail' car.id %}">
        {{ car.model }} ({{ car.manufacturer.name }})
      </a>
    </li>
  {% empty %}
    <p>No cars available.</p>
  {% endfor %}
</ul>

{% include "includes/pagination.html" %}
{% endblock %}
