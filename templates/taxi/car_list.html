{% extends "base.html" %}

{% block content %}
  <table>
    {% for car in car_list %}
      <tr>
        <td>
          <a href="{% url 'taxi:car-detail' car.pk %}">{{ car.id }} {{ car.model }} {{ car.manufacturer }} {{ car.drivers }}</a>
        </td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
