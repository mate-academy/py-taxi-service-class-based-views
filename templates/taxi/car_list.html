{% extends "base.html" %}

{% block content %}
  <h1>List of cars</h1>

  {% if car_list %}
    <ul>
    {% for car in car_list %}
      <li>
        <a href={{ car.get_absolute_url }}> model: <strong>{{ car.model }}</strong></a>
      <hr>
      </li>
    {% endfor %}
    </ul>
  {% else %}
    <p>No cars in list</p>
  {% endif %}
{% endblock %}
