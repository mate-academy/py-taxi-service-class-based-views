{% extends "base.html" %} {% block content %}
<h1>Cars</h1>
<table class="table">
  <thead>
    <tr>
      <th>id</th>
      <th>model</th>
      <th>manufacturer</th>
    </tr>
  </thead>
  <tbody>
    {% for car in car_list %}
    <tr>
      <td>
        <a href="{% url "taxi:car-detail" car.pk %}"> {{ car.id }}</a>
      </td>
      <td>{{ car.model }}</td>
      <td>{{ car.manufacturer }}</td>
    </tr>
  {% empty %}
  <tr>
    <td colspan="3">No cars available.</td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
