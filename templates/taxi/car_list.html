{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li> Car Id:
          <a href="{% url 'taxi:car-detail' car.pk %}"> {{ car.id }}</a><br>
          Model: {{ car.model }}</li>
      {% endfor %}
    </ul>
    {% else %}
      <p>There are no cars</p>
  {% endif %}
{% endblock %}
