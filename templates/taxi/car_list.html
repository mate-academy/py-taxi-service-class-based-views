{% extends 'base.html' %}

{% block content %}
  <table class="table">
    <thead>
    {% if car_list %}
      <tr>
        <th scope="col">id</th>
        <th scope="col">Model</th>
      </tr>
      </thead>
      {% for car in car_list %}
        <tr>
          <th scope="row">{{ car.id }}</th>
          <td>
            <a href="{% url "taxi:car-detail" pk=car.id %}">{{ car.model }}</a>
          </td>
        </tr>
      {% endfor %}
      </table>
    {% endif %}
{% endblock %}
