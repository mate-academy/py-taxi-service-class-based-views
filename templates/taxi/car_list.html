{% extends "base.html" %}

{% block content %}
  <h1>Cars</h1>
  <table>
    <tr><th>ID</th><th>Model</th><th>Manufacturer</th></tr>
      {% for car in car_list %}
        <tr>
          <td>{{ car.id }}</td>
          <td><a href="{{ car.get_absolute_url }}">{{ car.model }}</a></td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% empty %}
        <tr><td colspan="3">No cars found.</td></tr>
      {% endfor %}
  </table>
{% endblock %}
