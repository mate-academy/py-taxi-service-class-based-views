{% extends "base.html" %}

{% block content %}
  <table>
    <tr>
      <th>id</th>
      <th>Model</th>
    </tr>
    {% for car in car_list %}
      <tr>
        <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></td>
        <td>{{ car.model }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="2">There are no cars</td> </tr>
    {% endfor %}
  </table>
{% endblock %}
