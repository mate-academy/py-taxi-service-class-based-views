{% extends "base.html" %}
{% block content %}
  <h5>Cars:</h5>
  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{{ car.get_absolute_url }}">
            {{ car.model }} ({{ car.manufacturer.country }})
          </a>
        </li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
