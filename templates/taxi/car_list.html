{% extends "base.html" %}

{% block content %}
  <h2>Cars list</h2>
  {% if car_list %}
    <table class="ml-3 table table-bordered">
      <thead>
      <tr>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
      </thead>
      <tbody>
      {% for car in car_list %}
        <tr>
          <td><a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.id }}</a>
          </td>
          <td>{{ car.model }}</td>
          <td>
            <p>{{ car.manufacturer.name }}</p>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>There are no cars in db.</p>
  {% endif %}
{% endblock %}
