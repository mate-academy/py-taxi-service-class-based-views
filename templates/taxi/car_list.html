{% extends "base.html" %}

{% block content %}
  <h1>Cars</h1>
  {% if car_list %}
    <ul>
    {% for car in car_list %}
      <li><a href="{% url "taxi:car-detail" car.id %}">{{ car.id }}</a></li> {{ car.model }}
    {% empty %}
      <p>No cars found!</p>
    {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
