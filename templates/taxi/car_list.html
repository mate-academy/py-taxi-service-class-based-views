{% extends 'base.html' %}

{% block content %}
  <h1>Cars</h1>
  {% if car_list %}
    <table class="table">
      <thead>
      <tr>
        <th>Id</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
      </thead>
      <tbody>
      {% for car in car_list %}
        <tr>
          <th scope="row"><a href="{{ car.get_absolute_url }}">{{ car.id }}</a></th>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    There are no cars in taxi service
  {% endif %}
{% endblock %}
