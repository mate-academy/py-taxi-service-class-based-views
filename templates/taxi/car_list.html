{% extends "base.html" %}

{% block content %}
  <h1>Cars</h1>
  {% if car_list%}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url 'taxi:car-detail' car.id%}">
            {{ car.id }}
          </a>
          {{ car.model }} (Manufacturer: {{ car.manufacturer.name }})
        </li>
        {% empty %}
          <p>No cars available.</p>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
