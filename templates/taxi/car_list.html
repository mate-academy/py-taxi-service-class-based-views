{% extends "base.html" %}

{% block content %}
<table>
  <thead>
    <tr>
      <th>Manufacturer</th>
      <th>Model</th>
      <th>ID</th>
    </tr>
  </thead>
  <tbody>
    {% for car in car_list %}
    <tr>
      <td>{{ car.manufacturer.name }}</td>
      <td>{{ car.model }}</td>
      <td>
        <a href="{% url "taxi:car-detail" car.pk %}">Details link</a>
      </td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="3">No cars found.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
