{% extends 'base.html' %}
{% block content %}
  <table>
    <thead>
    <tr>
      <th>Cars</th>
    </tr>
    </thead>

    {% if car_list %}
      <tbody>
      {% for car in car_list %}
        <tr>
          <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}</a></td>
        </tr>
      {% endfor %}
      </tbody>
    {% else %}
      <p>There are no Cars</p>
    {% endif %}

  </table>
{% endblock %}
