{% extends "base.html" %}
{% block content %}
  <table>
    <tr>
      <th>ID</th>
      <th>Model</th>
      <th>Manufacturer</th>
      <th>Drivers</th>
    </tr>

    {% for car in car_list %}
    <tr>
      <td> <a href="{% url 'taxi:car-detail' car.pk %}">
        {{ car.pk }} </a>
      </td>
      <td>{{ car.model }}</td>
      <td>{{ car.manufacturer.name }}</td>
      <td>
        <ul>
          {% for driver in car.drivers.all %}
            <li>{{ driver.first_name }} {{ driver.last_name }}</li>
          {% endfor %}
        </ul>
      </td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
