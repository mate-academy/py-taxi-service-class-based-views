{% extends "base.html" %}
{% block content %}
  <h1>Car List</h1>
  {% if car_list %}
  <table class="table table-striped">
  <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Model</th>
      <th scope="col">Manufacturer</th>
    </tr>
  </thead>
  {% for car in car_list %}
    <tr>
      <td><a href="{{ car.get_absolute_url }}">{{ car.id }}</a></td>
      <td>{{ car.model }}</td>
      <td>{{ car.manufacturer }}</td>
    </tr>
  {% endfor %}
  </table>
  {% else %}
    <p>There are no cars!</p>
  {% endif %}
{% endblock %}
