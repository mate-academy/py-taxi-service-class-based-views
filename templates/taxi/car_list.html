{% extends "base.html" %}

{% block content %}
  <h1>Cars List</h1>

  {% if car_list %}
    <table>
      <thead>
        <tr>
          <th>Id</th>
          <th>Model</th>
          <th>Manufacturer</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
          <tr>
            <td>
              <a href="{% url 'taxi:car-detail' car.pk %}">{{ car.id }}</a>
            </td>
            <td>{{ car.model }}</td>
            <td>{{ car.manufacturer.name }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No car found.</p>
  {% endif %}
{% endblock %}
