{% extends "base.html" %}

{% block content %}
  <h1>Cars</h1>
  <hr>
  <ul>
    {% for car in car_list %}
      <li><a href="{% url "taxi:car-detail" car.id %}">{{ car.model }}. Manufacturer: {{ car.manufacturer.name }}.</a></li>
    {% empty %}
      <p>No car found</p>
    {% endfor %}
  </ul>
{% endblock %}
