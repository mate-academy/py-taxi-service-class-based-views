{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  <table>
    <tr>
      <th>ID</th>
      <th>Model</th>
      <th>Manufacturer</th>
    </tr>
    {% for car in object_list %}
    <tr>
      <td>
        <a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a>
      </td>
      <td>{{ car.model }}</td>
      <td>{{ car.manufacturer.name }} ({{ car.manufacturer.country }})</td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No cars found.</td></tr>
    {% endfor %}
  </table>

  {% include "includes/pagination.html" %}
{% endblock %}
