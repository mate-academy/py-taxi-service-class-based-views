{% extends "base.html" %}
{% block content %}
  <h1>Cars</h1>
  {% if car_list %}
    <table>
      <thead>
        <tr>
          <th>Model</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
          <tr>
            <td>{{ car.model }}</td>
            <td><a href="{{ car.get_absolute_url }}">{{ car.id }}</a></td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No cars found.</p>
  {% endif %}
{% endblock %}
