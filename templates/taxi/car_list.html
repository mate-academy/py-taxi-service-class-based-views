{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>

  <table class="data-table" border="1" cellpadding="15" cellspacing="0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
    </thead>
    <tbody>
      {% for car in car_list %}
        <tr>
          <td><a href="{{car.get_absolute_url}}">{{ car.id }}</a></td>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3">No cars found.</td>
        </tr>
      {%endfor%}
    </tbody>
  </table>
{% endblock %}
