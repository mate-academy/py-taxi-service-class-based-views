{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  <ul>
    {% for car in object_list %}
      <li>
        <a href="{% url 'taxi:car-detail' car.id %}">
          {{ car.model }}
        </a>
      </li>
    {% empty %}
      <li>No cars found.</li>
    {% endfor %}
  </ul>

{% endblock %}
