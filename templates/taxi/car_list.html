{% extends "base.html" %}

{% block content %}
  {% if car_list %}
    <h4>Cars</h4>
    <hr>
    <ul class="cars-nav">
    {% for item in car_list %}
      <li>
        <a href="{% url 'taxi:car-detail' item.id %}">
          <b>ID: {{ item.id }}</b>
        </a>
          {{ item.model }}
      </li>
    {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
