{% extends "base.html" %}

{% block content %}
  <h1>Cars</h1>
  <table class="table table-bordered">
    <thead>
    <tr>
      <th>ID</th>
      <th>Model</th>
    </tr>
    </thead>

    <tbody>
    {% for car in car_list %}
      <tr>
        <td>
          <a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.id }}</a>
        </td>
        <td>
          {{ car.model }}
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
