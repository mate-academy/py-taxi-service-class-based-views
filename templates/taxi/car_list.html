{% extends "base.html" %}
{% block content %}
<h1>Our cars:</h1>
  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a> {{ car.manufacturer.name }} - {{ car.model }}</li>
      {% endfor %}
    </ul>
  {% endif %}
  {% include "includes/pagination.html" %}
{% endblock content %}
