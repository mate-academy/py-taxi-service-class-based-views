{% extends "base.html" %}

{% block content %}
  <h1>Cars</h1>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Id</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
    </thead>
    <tbody>
      {% for car in car_list %}
        <tr>
          <td>
            <a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.id }}</a>
          </td>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% empty %}
        <p>No cars exist!</p>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
