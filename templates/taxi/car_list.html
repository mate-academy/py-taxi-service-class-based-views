{% extends "base.html" %}
{% block content %}
  <h1>Cars</h1>
  <table>
    <tr>
      <th>Model</th>
      <th>Manufacturer</th>
      <th>Details</th>
    </tr>
    {% for car in car_list %}
      <tr>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
        <td><a href="{% url 'car-detail' car.id %}">View</a></td>
      </tr>
    {% endfor %}
  </table>
  {% include "includes/pagination.html" %}
{% endblock %}
