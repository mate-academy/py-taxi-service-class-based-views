{% extends "base.html" %}

{% block content %}
  <h1>Cars list:</h1>
  {% if car_list %}
    <table border="1">
      <thead>
        <tr>
          <th>ID</th>
          <th>Manufacturer</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
        <tr>
          <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></td>
          <td>{{ car.model }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No cars found.</p>
  {% endif %}
{% endblock %}
