{% extends "base.html" %}
{% block content %}
  <h1>Cars</h1>
  {% if car_list %}
  	<table class="table" style="table-layout: fixed; width: 100%;">
      <thead>
        <tr>
          <th class="col">ID</th>
          <th class="col">Model</th>
          <th class="col">Manufacturer</th>
          <th class="col">Drivers</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
          <tr>
            <th scope="row">
              <a href={% url "taxi:car-detail" car.id %}>
                {{ car.id }}
              </a>
            </th>
            <th>
              {{ car.model }}
            </th>
            <th>
              {{ car.manufacturer.name }}
            </th>
            <th>
              {{ car.drivers.count }}
            </th>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
