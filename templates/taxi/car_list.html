{% extends "base.html" %}
{% block content %}
  <h1>Car list:</h1>
  <ul>
    {% for car in car_list %}
      <li>Model: {{ car.model }}, Made: {{ car.manufacturer.name }}, Country: {{ car.manufacturer.country }} ID:<a href="{{ car.get_absolute_url }}"> {{ car.id }} </a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
