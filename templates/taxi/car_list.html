{% extends "base.html" %}

{% block title %}
  <h1>Car list</h1>
{% endblock %}

{% block content %}
  {% if car_list %}
      {% for car in car_list %}
          <a href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}</a>
      {% endfor %}
  {% else %}
    <p>there's no cars</p>
  {% endif %}
{% endblock %}
