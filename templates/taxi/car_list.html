{% extends "base.html" %}
{% block content %}
  <h2>Car list</h2>
  <ul>
    {% for car in cars %}
      <li>
        <strong>ID:</strong>
        <a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a>
        <strong>Model:</strong> {{ car.model }}
        <strong>Manufacturer:</strong> {{ car.manufacturer.name }}
      </li>
    {% empty %}
      <li>No cars available.</li>
    {% endfor %}
  </ul>

  {% include "includes/pagination.html" %}
{% endblock %}
