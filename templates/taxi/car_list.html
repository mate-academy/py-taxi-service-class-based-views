{% extends "base.html" %}

{% block content %}
  <table class="table-bordered">
    <thead>
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Model</th>
        <th scope="col">Manufacturer</th>
        <th scope="col">Drivers</th>
      </tr>
    </thead>
    <tbody>
    {% for car in car_list %}
      <tr>
        <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></td>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
        <td>{% for driver in car.drivers.all %}
          <p>{{ driver.first_name }} {{ driver.last_name }}</p>
        {% endfor %}
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
