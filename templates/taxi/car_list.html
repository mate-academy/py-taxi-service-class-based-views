{% extends "base.html" %}
{% block content %}
	<ul>
  {% if car_list %}
  	{% for car in car_list %}
    	<li><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a> - {{ car.model }}, {{ car.manufacturer }}</li>
    {% endfor %}
    {% else %}
      <p>There are no cars!</p>
  {% endif %}

  </ul>
{% endblock %}
