{% extends "base.html" %}

{% block content %}
  <h2>Cars</h2>
  <table>
    <tr>
      <th>ID</th>
      <th>Model</th>
      <th>manufacturer</th>
    </tr>
    {% for car in cars %}
      <tr>
          <td><a href="{% url 'car-detail' car.id %}">{{ car.id }}</a></td>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
      </tr>
    {% endfor %}
  </table>
  {% include "includes/pagination.html" %}
{% endblock %}
