{% extends "base.html" %}
{% block title %}
  <title>Cars</title>
{% endblock %}
{% block content %}
  <h1>Car List</h1>
  {% if car_list %}
    <table cellpadding="8" cellspacing="4" border="1">
      <thead>
        <tr>
          <th>id</th>
          <th>Model</th>
          <th>Manufacturer</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
          <tr>
            <td>
              <a href="{% url 'taxi:car-detail' car.id %}">
                {{ car.id }}
              </a>
            </td>
            <td>{{ car.model }}</td>
            <td>{{ car.manufacturer.name }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
