{% extends "base.html" %}

{% block content %}
  <h1>Cars</h1>
  <p>
    <ul>
      {% if car_list %}
        {% for car in car_list %}
          <li>
          <a href="{% url "taxi:car-detail" car.id %}">{{ car.model }}</a>
          </li>
        {% endfor %}
      {% else %}
        Not any car in taxi
      {% endif %}
    </ul>
  </p>
{% endblock %}
