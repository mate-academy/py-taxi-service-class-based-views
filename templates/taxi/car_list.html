{% extends "base.html" %}
{% block content %}
  <h1>Cars list</h1>
  {% if car_list %}
    <table class="table">
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Model</th>
          <th scope="col">Manufacturer</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
          <tr>
            <th scope="row">
              <a href="{{car.get_absolute_url}}">{{ car.id }}</a>
            </th>
            <td>{{ car.model }}</td>
            <td>{{ car.manufacturer.name }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p> There are no cars</p>
  {% endif %}
{% endblock %}
