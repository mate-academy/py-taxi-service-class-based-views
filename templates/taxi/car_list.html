{% extends "base.html" %}

{% block content %}
  <h1>Car</h1>
    <table border="1px">
      <thead>
        <tr align="center">
          <th>ID</th>
          <th>Model</th>
          <th>Manufacturer</th>
          <th>Year</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
          <tr align="center">
            <td><a href="{% url 'taxi:car-detail' car.pk %}">{{ car.pk }}</a></td>
            <td>{{ car.model }}</td>
            <td>{{ car.manufacturer.name }} ({{ car.manufacturer.country }})</td>
            <td>{{ car.year }}</td>
          </tr>
        {% empty %}
          <tr align="center"><td colspan="4">No cars</td></tr>
        {% endfor %}
      </tbody>
    </table>
{% include "includes/pagination.html" %}
{% endblock %}
