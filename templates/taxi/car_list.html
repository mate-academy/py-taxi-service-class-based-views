{% extends "base.html" %}
{% block content %}
  <h1>List of cars</h1>
  {% if car_list %}
	<table>
    {% for car in car_list %}
      <tr><td><a href = "{{ car.get_car_url }}"> {{ car.model }} {{ car.manufacturer }} {{ car.drivers }}  </a></td></tr>
    {% endfor %}
  </table>
    {% else %}
    <p>There aren't any cars</p>
  {% endif %}

{% endblock %}
