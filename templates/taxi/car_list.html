{% extends "base.html" %}
{% block content %}
  {% if car_list %}
    <table class="table">
      <thead>
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Model</th>
        <th scope="col">Manufacturer</th>
      </tr>
      </thead>
      <tbody>
      {% for car in car_list %}
        <tr>
          <th scope="row">
            <a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a>
          </th>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% empty %}
        <p>No Data</p>
      {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
