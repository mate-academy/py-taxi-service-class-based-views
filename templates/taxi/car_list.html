{% extends "base.html" %}

{% block content %}
  <h1>
  Cars list
  </h1>
  {% if car_list is not None %}
    {% for car in car_list %}
      <div class="row">
      <div class="col col-3">
        <a class="btn" href="{% url 'taxi:car-detail' car.id %}">
          {{ car.model }}
        </a>
      </div>
      <div class="col col-3">
        <p>
          {{ car.manufacturer.name }}
        </p>
      </div>
      </div>
    {% endfor %}
  {% endif %}
{% endblock %}
