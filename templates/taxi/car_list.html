{% extends "base.html" %}
{% block title %}
  <title>Cars</title>
{% endblock %}
{% block content %}
  {% if car_list %}
    <table class="table">
      <thead class="table-dark">
      <tr>
        <th>№</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
      </thead>
      <tbody>
      {% for car in car_list %}
        <tr>
          <td><a href="{% url "taxi:car-detail" car.pk %}">{{ car.pk }}</a></td>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No cars</p>
  {% endif %}
{% endblock %}
