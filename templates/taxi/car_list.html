{% extends "base.html" %}

{% block content %}
  <table>
    <tr>
      <th>id</th>
      <th>Model</th>
      <th>Country</th>
    </tr>
    {% for car in car_list %}
    <tr>
      <td><a href="{% url 'taxi:car-detail' car.id %}">id {{ car.id }}</a></td>
      <td>{{ car.model }} </td>
      <td>{{ car.manufacturer.country }}</td>
    </tr>
    {% endfor %}
  </table>

{% endblock %}
