{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  <style>
    table, th, td {
      border: 1px solid black;
    }
  </style>

  {% if car_list %}
    <table style="width: 50%">
      <tr>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>

      {% for car in car_list %}
        <tr>
          <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></td>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>No cars available.</p>
  {% endif %}
{% endblock %}
