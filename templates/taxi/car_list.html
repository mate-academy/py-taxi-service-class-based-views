{% extends "base.html"%}

{% block content %}
  <h1>Car List</h1>
  {% if car_list %}
    <table>
      <tr>
        <th>ID</th>
        <th>Model</th>
      </tr>
      {% for car in car_list %}
        <tr>
          <th><a href="{{ car.get_absolute_url }}">{{ car.id}}</a></th>
          <th>{{ car.model }}</th>
        </tr>
      {% endfor %}
    </table>
  {% endif %}
{% endblock %}
