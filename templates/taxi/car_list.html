{% extends "base.html" %}

{% block content %}
  <h1>Cars:</h1>
  <hr>
  <table>
    {% for car in car_list %}
      <tr><td>
        <a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a>
        {{ car.model }}. Manufacturer: {{ car.manufacturer.name }}
      </td></tr>
    {% empty %}
      <tr><td>No car found!</td></tr>
    {% endfor %}
  </table>
{% endblock %}
