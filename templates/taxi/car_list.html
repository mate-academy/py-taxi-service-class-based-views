{% extends 'base.html' %}
{% block title %}
  <title>Car list</title>
{% endblock %}
{% block content %}
  <h1>Car list</h1>
  {% if car_list %}
    <ol>
      {% for car in car_list %}
        <li>
          <a href="{{ car.get_absolute_url }}">
            {{ car.model }}
          </a>
        </li>
      {% endfor %}
    </ol>
  {% else %}
    <p>There is no cars</p>
  {% endif %}
{% endblock %}
