{% extends "base.html" %}

{% block content %}
  <table>
    <tr>
      <th>Model</th>
      <th>Manufacturer</th>
      <th>Drivers</th>
    </tr>

    {% for car in car_list %}
    <tr>
      <td> <a href="{% url 'taxi:car-detail' car.pk %}">
        {{ car.pk }} </a>
      </td>
      <td>{{ car.model }}</td>
      <td>{{ car.manufacturer }}</td>
      <td>{{ car.drivers }}</td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
