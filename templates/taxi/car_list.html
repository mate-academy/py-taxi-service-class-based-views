{% extends "base.html" %}
{% block content %}
  <h1>List of Cars</h1>
  <ul>
    {% for car in car_list %}
      <li><a href="{{ car.get_absolute_url }}">{{ car.id }} - {{ car.model }} ({{ car.manufacturer.name }})</a></li>
    {% empty %}
      <p>No cars found.</p>
    {% endfor %}
  </ul>
{% endblock %}
