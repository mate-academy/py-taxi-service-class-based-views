{% extends "base.html" %}

{% block content %}
  <h1>Cars List</h1>
  <ul>
    {% for car in car_list %}
      <li><a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.id }}</a>: {{ car.model }} - {{ car.manufacturer.name }}</li>
    {% empty %}
      <p> No Cars </p>
    {% endfor %}
  </ul>
{% endblock %}
