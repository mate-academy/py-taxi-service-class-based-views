{% extends "base.html" %}

{% block content %}
  <h1>Taxi active cars</h1>
  {% if car_list %}
    <table>
    {% for car in car_list %}
      <li><a href="{% url 'taxi:car-detail' car.pk %}">Car ID: {{ car.id }}</a></li>
      <ul>
        <li>model: {{ car.model }}</li>
      </ul>
    {% endfor %}
    </table>
  {% else %}
    <p>No active cars :(</p>
  {% endif %}
{% endblock %}
