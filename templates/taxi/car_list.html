{% extends 'taxi/base.html' %}

{% block content %}
{% if car_list %}
<table>
  <caption>Car List</caption>
  <thead>
    <tr>
      <th>Id</th>
      <th>Model</th>
      <th>Manufacturer</th>
    </tr>
  </thead>
  <tbody>
    {% for car in car_list %}
      <tr>
        <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></td>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }} ({{ car.manufacturer.country }})</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p>No cars in this page</p>
{% endif %}
{% endblock %}
