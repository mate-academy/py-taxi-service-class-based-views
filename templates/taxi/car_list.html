{% extends "base.html" %}

{% block content %}
  <h1>Cars List</h1>
  <hr>
  {% if car_list %}
    <table>
      <tr>
        <th>Id</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
      {% for car in car_list %}
        <tr>
          <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></td>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
        </tr>
      {%  endfor %}

    </table>
  {% endif %}
{% endblock %}
