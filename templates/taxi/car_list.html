{% extends "base.html" %}

{% block content %}
  <h1>Cars list</h1>
  <table class="table table-striped">
    <tr>
      <th>Id</th>
      <th>Model</th>
    </tr>
    {% for car in cars %}
      <tr>
        <td><a href="{% url "taxi:car-detail" car.id %}">{{ car.id }}</a></td>
        <td>{{ car.model }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
