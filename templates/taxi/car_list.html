{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>

  <table>
    <thead>
      <tr>
        <th>Id</th>
        <th>Model</th>
      </tr>
    </thead>
    <tbody>
      {% for car in car_list %}
        <tr>
          <td>
            <a href="{% url 'taxi:car-detail' pk=car.id%}">
              {{ car.id }}
            </a>
          </td>
          <td>{{ car.model }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="2">There are no cars available.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
