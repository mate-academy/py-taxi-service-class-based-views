{% extends "base.html" %}

{% block content %}
  {% if car_list %}
    <table>
      <tr>
        <th>Car List</th>
      </tr>
      {% for car in car_list %}
      <tr>
        <td><a href="{{ car.get_absolute_url }}">{{ car.id }}</a></td>
      </tr>
      {% endfor %}
    </table>
  {% endif %}

{% endblock %}
