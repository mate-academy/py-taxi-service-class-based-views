{% extends "base.html" %}

{% block content %}
  <table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Model</th>
      <th>Manufacturer</th>
      <th>Drivers</th>
    </tr>
  </thead>
  <tbody>
    {% for car in car_list %}
    <tr>
      <td>
        <a href="{% url 'taxi:car-detail' car.id %}">
          {{ car.id }}
        </a>
        </td>
      <td>{{ car.model }}</td>
      <td>{{ car.manufacturer }}</td>
      <td>
        {% for driver in car.drivers.all %}
          {{ driver }}{% if not forloop.last %}, {% endif %}
        {% endfor %}
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
