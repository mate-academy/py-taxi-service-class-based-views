{% extends "base.html" %}
{% block title %}<title>Taxi Service - Cars</title>{% endblock %}
{% block content %}
  <ul>
    {% for car in car_list %}
      <li><a href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}</a></li>
    {% empty %}
      <p>There's no cars on a Taxi Service.</p>
    {% endfor %}
  </ul>
{% endblock %}
