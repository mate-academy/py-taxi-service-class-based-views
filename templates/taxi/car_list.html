{% extends "base.html" %}

{% block content %}
	<h2>Cars List</h2>

	<table border="1">
		<thead>
		<tr>
			<th>ID</th>
			<th>Model</th>
			<th>Manufacturer</th>
		</tr>
		</thead>
		<tbody>
		{% for car in car_list %}
			<tr>
				<td>
					<a href="{% url 'taxi:car_detail' car.id  %}">{{ car.id }}</a>
				</td>
				<td>{{ car.model }}</td>
				<td>{{ car.manufacturer.name }}</td>
				{% empty %}
			<tr>
				<td colspan="3">No cars available.</td>
			</tr>
		{% endfor %}
		</tbody>
	</table>

{% endblock %}
