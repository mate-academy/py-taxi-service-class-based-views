{% extends "base.html" %}
{% block title %}<title>Cars</title>{% endblock %}

{% block content %}
<h1>Cars</h1>
<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Model</th>
      <th>Manufacturer</th>
      <th>Year</th>
    </tr>
  </thead>
  <tbody>
    {% for car in cars %}
    <tr>
      <td><a href="{% url 'taxi:car-detail' car.pk %}">{{ car.pk }}</a></td>
      <td>{{ car.model }}</td>
      <td>{{ car.manufacturer.name }}</td>
      <td>{{ car.year }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No cars found.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
