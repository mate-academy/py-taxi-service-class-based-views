{% extends "base.html" %}

{% block content %}
<h2>Cars</h2>
<table class="table table-striped table-bordered table-sm">
  <thead class="thead-light">
    <tr>
      <th>ID</th>
      <th>Model</th>
      <th>Manufacturer</th>
      <th>Drivers count</th>
    </tr>
  </thead>
  <tbody>
    {% for car in object_list %}
    <tr>
      <td>
        <a href="{% url 'taxi:car_detail' car.pk %}">{{ car.id }}</a>
      </td>
      <td>{{ car.model }}</td>
      <td>{{ car.manufacturer.name }}</td>
      <td>{{ car.drivers.count }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="4" class="text-center">No cars found</td></tr>
    {% endfor %}
  </tbody>
</table>

{% include "includes/pagination.html" %}
{% endblock %}
