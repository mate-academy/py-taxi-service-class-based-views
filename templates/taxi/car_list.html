{% extends 'base.html' %}

{% block title %}<title>Cars</title>{% endblock %}

{% block content %}
  <h1>Cars</h1>
  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li><a href="{{ car.get_absolute_url }}">ID: {{ car.id }}</a> - {{ car.model }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
