{% extends "base.html" %}
{% block content %}
  <h1>Car list:</h1>
  {% if car_list %}
    <table border="1">
      <tr>
        <th>Model</th>
        <th>Manufacturer</th>
        <th>Country</th>
        <th>ID</th>
      </tr>
      {% for car in car_list %}
        <tr>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
          <td>{{ car.manufacturer.country }}</td>
          <td><a href="{{ car.get_absolute_url }}">{{ car.id }}</a></td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>No cars found.</p>
  {% endif %}
{% endblock %}
