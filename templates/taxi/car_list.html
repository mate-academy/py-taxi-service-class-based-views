{% extends "base.html" %}
{% block content %}
  {% if car_list %}
  <ul>
    {% for car in car_list %}
      <li>
        <a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a>
        {{ car.model }}
        {{ car.manufacturer.name }}
      </li>
    {% endfor %}
  </ul>
  {% else %}
    <p>No Data</p>
  {% endif %}
{% endblock %}
