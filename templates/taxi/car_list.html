{% extends  "base.html"%}

{% block content %}
  <h1>Cars</h1>
  {% if  car_list %}
    <ul class="list-unstyled">
      {% for car in car_list %}
        <li><a href="{{ car.get_absolute_url }}">{{ car.id }}</a> {{ car.model }} ({{ car.manufacturer.name }})</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No cars</p>
  {% endif %}
{% endblock %}
