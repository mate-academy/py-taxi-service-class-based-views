{% extends "base.html" %}

{% block content %}
  <h1>Cars List</h1>

  {% if car_list %}
    <table>
    {% for car in car_list %}
      <li><a href="{{ car.get_absolute_url }}">
        {{ car.model }}
      </a>
      </li>
    {% endfor %}
    </table>
  {% endif %}
  {% if is_paginated %}

  {% endif %}
{% endblock %}
