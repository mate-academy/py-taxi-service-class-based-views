{% extends "base.html" %}
{% block title %}
  <title>Cars</title>
{% endblock %}
{% block content %}
  <h1>Cars</h1>
  {% if car_list %}
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Model</th>
          <th>Manufacturer</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
          <tr>
            <td>
              <a href="{{ car.get_absolute_url }}">{{ car.id }}</a>
            </td>
            <td>{{ car.model }}</td>
            <td>{{ car.manufacturer.name }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No cars yet.</p>
  {% endif %}
{% endblock %}
