{% extends "base.html" %}
{% block content %}
  <h1>Car List</h1>
  {% if car_list %}
    <ul class="list-group-item">
      {% for car in car_list %}
        <li>
          <a href="{% url 'taxi:car-detail' car.id %}">{{ car.make }} {{ car.model }}</a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no cars.</p>
  {% endif %}


{% endblock %}
