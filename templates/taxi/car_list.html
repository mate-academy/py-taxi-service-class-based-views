{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  {% if car_list %}
  	<table class="table">
      {% for car in car_list %}
        <tr>
          <th scope="col">
            <a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a>
          </th>
        </tr>
      {% endfor %}
    </table>
  {% endif %}
{% endblock %}
