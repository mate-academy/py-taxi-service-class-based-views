{% extends "base.html" %}

{% block content %}
<h1>Car list:</h1>
  {% if car_list %}
    <table class="table">
      <thead>
        <tr>
          <th>Id</th>
          <th>Model</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
          <tr>
            <td>
              <a href="{% url 'taxi:car-detail' pk=car.id %}">
                {{ car.id }}
              </a>
            </td>
            <td>
              {{ car.model }}
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No cars exist.</p>
  {% endif %}
{% endblock %}
