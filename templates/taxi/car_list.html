{% extends "base.html" %}

{% block content %}
  {% if car_list %}
    <h1>Cars</h1>

    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Id</th>
          <th>Model</th>
          <th>Manufacturer</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
        <tr>
          <td><a href="{% url "taxi:car-detail" car.id %}">{{ car.id }}</a></td>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>There are no Cars!</p>
  {% endif %}
{% endblock %}
