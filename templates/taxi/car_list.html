{% extends "base.html" %}

{% block content %}
  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
            <a href="{% url 'taxi:car-detail' car.id %}">
            {{ car.id }}
            </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No Car!!!</p>
  {% endif %}
{% endblock %}
