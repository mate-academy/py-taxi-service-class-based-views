{% extends "base.html" %}

{% block content %}
  <h1>CAR</h1>
  {% if car_list %}
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Модель</th>
        <th>Виробник</th>
        <th>Країна виробництва</th>
      </tr>
    </thead>
    <tbody>
      {% for car in car_list %}
        <tr>
          <td><a href="{{ car.get_absolute_url }}">{{ car.id }}</a></td>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
          <td>{{ car.manufacturer.country }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endif %}
{% endblock %}
