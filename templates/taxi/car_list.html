{% extends "base.html" %}


{% block content %}
  <h1>Car List</h1>
    {% if car_list %}
      <table class="table table-bordered">
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Model</th>
          <th scope="col">Manufacturer</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
          <tr>
            <th scope="row">
              <a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a>
            </th>
            <td>{{ car.model }}</td>
            <td>{{ car.manufacturer.name }}</td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="3">No cars available.</td>
          </tr>
        {% endfor %}
      </tbody>
</table>
    {% endif %}
{% endblock %}
