{% extends "base.html" %}
{% block content %}
  <h1>Car list</h1>
  {% for car in car_list %}
  <ul>
    <li><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></li>
  <li>Name: {{ car.name }}</li>
  <li>Manufacturer: {{ car.manufacturer.name }}</li>
  </ul>
  {% endfor %}
{% endblock %}
