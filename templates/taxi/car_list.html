{% extends "base.html" %}

{% block DynamicTitle %}
<h3>Dynamic content Cars List</h3>
{% endblock %}
{% block content %}
    {% if car_list %}
        <ul>
            {% for car in object_list %}
                <li><a href="{% url 'taxi:car-detail' car.pk %}">{{ car.manufacturer.name }}</a></li>
            {% endfor %}
        </ul>
    {% else %}
    <p>there are no cars</p>
    {% endif %}
{% endblock %}
