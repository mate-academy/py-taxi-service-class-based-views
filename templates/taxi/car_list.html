{% extends "base.html" %}

{% block content %}
<table>
<h2>Cars</h2>
  <tr>
    <th>ID</th>
    <th>Model</th>
    <th>Manufacturer</th>
    <th>Country</th>
  </tr>
  {% for car in object_list %}
  <tr>
    <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></td>
    <td>{{ car.model }}</td>
    <td>{{ car.manufacturer.name }}</td>
    <td>{{ car.manufacturer.country }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
