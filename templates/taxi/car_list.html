{% extends "base.html" %}

{% block content %}
  <h2>Cars list</h2>
  <table class="table">
    <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Model</th>
    </tr>
    </thead>
    <tbody>
    {% for car in car_list %}
      <tr>
        <td><a href="{% url "taxi:car-detail" pk=car.id %}">{{ car.id }}</a></td>
        <td>{{ car.model }}</td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="2">No cars found.</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
