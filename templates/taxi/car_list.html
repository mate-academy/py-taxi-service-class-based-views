{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>

  {% if car_list %}
    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Manufacturer</th>
          <th>Model</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
          <tr>
            <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></td>
            <td>{{ car.manufacturer.name }}</td>
            <td>{{ car.model }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No cars to display</p>
  {% endif %}

  {% include "includes/pagination.html" %}

  <a class="btn btn-primary mt-3" href="{% url 'taxi:index' %}">Home</a>
{% endblock %}
