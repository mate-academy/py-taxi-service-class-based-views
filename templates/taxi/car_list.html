{% extends "base.html" %}
{% block content %}
  <h1>Cars</h1>
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Model</th>
    </tr>
    </thead>
    <tbody>
    {% for car in car_list %}
      <tr>
        <td>
          <a href="{{ car.get_absolute_url }}">{{ car.id }}</a>
        </td>
        <td>{{ car.model }}</td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="2">There are no cars in service</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
