{% extends "base.html" %}

{% block content %}
  <h1>Car list</h1>
  <table class="table table-sm table-striped table-hover">
    <thead class="thead-dark">
      <tr>
        <th>No.</th>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
    </thead>
    <tbody>
      {% for car in car_list %}
        <tr>
          <td>{{ forloop.counter|add:page_obj.start_index|add:"-1" }}</td>
          <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></td>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="4">No cars found.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
