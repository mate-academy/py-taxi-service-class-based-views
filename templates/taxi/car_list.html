{% extends "base.html" %}

{% block content %}
  <h1>Cars List</h1>
  <ul>
  {% for car in car_list %}
    <li><a href="{% url 'taxi:car-detail' car.pk %}">{{ car.id }}.</a> {{ car.model }} - {{ car.manufacturer.name }}</li>
  {% empty %}
    <p>There are no cars!</p>
  {% endfor %}
  </ul>
{% endblock %}
