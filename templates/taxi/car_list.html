{% extends "base.html" %}

{% block content %}
    <h1>Cars List</h1>
    {% if cars %}
        <table>
            <tr>
                <th>ID</th>
                <th>Model</th>
                <th>Manufacturer</th>
            </tr>
            {% for car in cars %}
                <tr>
                    <td>
                        <a href="{% url 'taxi:car-detail' car.id %}">{{car.id}}</a>
                    </td>

                    <td>{{car.model}}</td>
                    <td>{{car.manufacturer}}</td>
                </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No cars available.</p>
    {% endif %}

    {% include "includes/pagination.html" %}
{% endblock %}
