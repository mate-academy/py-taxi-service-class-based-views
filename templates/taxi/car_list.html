{% extends "base.html" %}

{% block content %}
  <h3 style="text-align: center;">Cars</h3>
  <table border="1" style="margin: 0 auto;">
    {% for car in car_list %}
      <tr>
        <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></td>
        <td>{{ car.model }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
