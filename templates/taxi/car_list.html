{% extends "base.html" %}

{% block content %}
  <h1><strong>Cars</strong></h1>

  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
    </thead>
    <tbody>
      {% for car in car_list %}
        <tr>
          <td>{{ car.id }}</td>
          <td><a href="{{ car.get_absolute_url }}">{{ car.model }}</a></td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3">There are no such a Car</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

{% endblock %}
