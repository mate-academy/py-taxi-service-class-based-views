{% extends "base.html" %}

{% block title %}
  <title>Car List</title>
{% endblock %}

{% block content %}
  {% if car_list %}
    <ul>
    {% for car in car_list %}
      <li><a href="{% url "taxi:car-detail" car.id %}">{{ car.id }}</a></li>
    {% empty %}
    <p>No cars found</p>
    {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
