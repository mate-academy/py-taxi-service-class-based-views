{% extends "base.html" %}

{% block content %}
	<h1>Cars List</h1>
  {% if car_list %}
  	<div class="table-responsive">
  <table class="table table-striped table-hover table-bordered">
    <thead class="thead-light">
      <tr>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
    </thead>
    <tbody>
      {% for car in car_list %}
      <tr>
        <td>
          <a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a>
        </td>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3">No cars available.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
  {% endif %}
{% endblock %}
