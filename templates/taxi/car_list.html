{% extends "base.html" %}

{% block content %}
  <h1>Car list</h1>
  {% if car_list %}
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Model</th>
            <th scope="col">Manufacturer</th>
          </tr>
        </thead>
        <tbody>
          {% for car in car_list %}
            <tr>
              <td><a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.id }}</a></td>
              <td>{{ car.model }}</td>
              <td>{{ car.manufacturer.name }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <p>No cars available.</p>
  {% endif %}
{% endblock %}
