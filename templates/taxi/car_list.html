{% extends "base.html" %}

{% block content %}
  <h2>Cars:</h2>
  <table>
    <tr>
      <th>ID</th>
      <th>Model</th>
      <th>Manufacture</th>
      <th>Country</th>
    </tr>
    {% for car in car_list %}
      <tr>
        <td><a href="{{ car.get_absolute_url }}">{{ car.id }}</a></td>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
        <td>{{ car.manufacturer.country }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
