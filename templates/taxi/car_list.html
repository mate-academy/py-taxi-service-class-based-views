{%  extends "base.html" %}

{% block content %}
  <h2>Cars list:</h2>
    {% if car_list %}
      <table class="table">
        <thead>
          <tr>
            <th scope="col">Id</th>
            <th scope="col">Model</th>
            <th scope="col">Manufacturer</th>
          </tr>
        </thead>
        <tbody>
          {% for car in car_list %}
            <tr>
            <th scope="row"><a href="{% url "taxi:car-detail" pk=car.id %}">{{ car.id }}</a></th>
              <td>{{ car.model }}</td>
              <td>{{ car.manufacturer.name }}</td>
            {% endfor %}
          </tr>
        </tbody>
      </table>
    {% else %}
      <p>No such cars!</p>
    {% endif %}
{% endblock %}
