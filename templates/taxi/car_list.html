{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  {% if car_list %}
    <table>
        <tr>
          <th>Model</th>
          <th>Manufacturer</th>
        </tr>
    {% for car in car_list %}
      <tr>
        <td><a rel="car_instance" href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}</a></td>
        <td>{{ car.manufacturer.name }}</td>
      </tr>
    {% endfor %}
    </table>
  {% else %}
    <p>No Cars</p>
  {% endif %}
{% endblock %}
