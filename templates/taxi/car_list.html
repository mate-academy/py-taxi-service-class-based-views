{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
    {% if car_list %}
      <table>
        <tr>
          <th>id</th>
          <th>Model</th>
          <th>Manufacturer</th>
        </tr>
        {% for car in car_list %}
          <tr>
            <th>
              <a href="{% url "taxi:car-detail" car.id %}">
                {{ car.id }}
              </a>
            </th>
            <th>
              {{ car.model }},
            </th>
            <th>
              {{ car.manufacturer }},
            </th>
          </tr>
        {% endfor %}
      </table>
    {% endif %}
{% endblock %}
