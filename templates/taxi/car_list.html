{% extends "base.html" %}

{% block content %}
  <h1>Cars:</h1>
  <ul>
    {% for car in car_list %}
      <li>
        <a href="{% url 'taxi:car-detail' car.id %}">
          {{ car.model }} ({{ car.manufacturer.name }})
        </a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
