{% extends "base.html" %}
{% block content %}
  {% if driver.cars.all %}
    {% for car in driver.cars.all %}
      <li>
        <a href="{% url 'taxi:car-detail' car.id %}">{{ car.model }} - {{ car.manufacturer.name }}</a>
      </li>
    {% endfor %}
  {% else %}
    <p>No cars assigned.</p>
  {% endif %}
{% endblock %}
