{% extends "base.html" %}

{% block content %}
  <h1>Cars</h1>
  <table class="table">
    <tr>
      <th>id</th>
      <th>model</th>
      <th>manufacturer</th>

    </tr>

    {% for car in car_list %}
      <tr>
        <td><a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.id }}</a></td>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>

      </tr>
    {% empty %}
      <p>No cars yet.</p>
    {% endfor %}

  </table>

{% endblock %}
