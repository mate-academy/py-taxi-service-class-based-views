{% extends "base.html" %}

{% block content %}
  <h1 class="text-center mb-4">Cars</h1>
  <div class="table-responsive">
    <table class="table align-middle">
      <thead>
      <tr>
        <th style="width: 20%;">ID</th>
        <th style="width: 40%;">Model</th>
        <th style="width: 40%;">Manufacturer</th>
      </tr>
      </thead>
      <tbody>
      {% for car in car_list %}
        <tr>
          <td><a href="{% url "taxi:car-detail" pk=car.pk %}">{{ car.id }}</a></td>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% empty %}
        <tr class="empty-row">
          <td colspan="3" class="text-center py-4">
            No cars available.
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
