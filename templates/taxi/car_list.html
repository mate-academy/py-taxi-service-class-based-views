{% extends "base.html" %}

{% block title %}<title>Car List</title>{% endblock %}
{% block content %}
  <h1>Car List</h1>
  {% if car_list %}
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Id</th>
          <th>Manufacturer</th>
          <th>Model</th>
        </tr>
      </thead>
      <tbody>
        {% for car in car_list %}
          <tr>
            <td>
              <a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a>
            </td>
            <td>{{ car.manufacturer.name }}</td>
            <td>{{ car.model }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
