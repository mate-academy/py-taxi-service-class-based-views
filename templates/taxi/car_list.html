{% extends "base.html" %}


{% block content %}

  <h1>Car</h1>
  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li><a href="{% url "taxi:car-detail" pk=car.id  %}">{{ car.id }}</a>, {{ car.drivers }}, {{ car.manufacturer }} {{ car.model }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
