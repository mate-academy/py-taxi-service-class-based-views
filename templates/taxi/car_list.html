{% extends "base.html" %}
{% block content %}
  <h1>Cars list</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
    </thead>
  <tbody>
    {% for car in object_list %}
    	<tr>
        <td>
          <a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a>
        </td>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
      </tr>
     {% empty %}
      <tr>
        <td colspan="3">No cars yet.</td>
      </tr>
    {% endfor %}
  </tbody>
  </table>
{% endblock %}

{% block pagination %}
  {% include "includes/pagination.html" %}
{% endblock %}
