{% extends "base.html" %}
{% block content %}
  <h1>Cars</h1>
  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url 'taxi:car-detail' car.id %}">
            <p>Id: {{ car.id }}</p>
          </a>
          <p>Model: {{ car.model }}</p>
          <p>Manufacturer: {{ car.manufacturer.name }}</p>
        </li>
        <hr>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
