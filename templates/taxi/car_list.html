{% extends "base.html" %}

{% block content %}
  <h1>Cars list</h1>
  {% if car_list %}
    <table>
      <tr>
        <th>ID</th>
        <th>Name</th>
		    <th>Manufacturer</th>
      </tr>

        {% for car in car_list %}
          <tr>
            <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></td>
            <td>{{ car.model }}</td>
			      <td>{{ car.manufacturer.name }}: {{ car.manufacturer.country }}</td>
          </tr>
        {% endfor %}
    </table>
  {% else %}
    No cars found
  {% endif %}
{% endblock %}
