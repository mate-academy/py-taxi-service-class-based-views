{% extends "base.html" %}

{% block content %}
<h1>Car list</h1>
  <ul>
  {% if car_list %}
    {% for car in car_list %}
      <li>
        {{ car.model }} {{ car.manufacturer.name }}
        <a href="{% url 'taxi:car-detail' pk=car.pk %}">{{ car.id }}</a>
      </li>
    {% endfor %}
  {% endif %}
  </ul>
{% endblock %}
