{% extends "base.html" %}
{% block content %}
  <h1>OUR CARS</h1>
  {% if car_list %}
      <table class="table table-hover table-bordered">
        <thead class="thead-dark">
          <tr>
            <th scope="col">#</th>
            <th scope="col">manufacturer</th>
            <th scope="col">model</th>
          </tr>
        </thead>
        {% for car in car_list %}
          <tbody>
            <tr>
              <th scope="row"><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></th>
              <td>{{ car.manufacturer.name }}</td>
              <td>{{ car.model }}</td>

            </tr>
          </tbody>

        {% endfor %}
        </table>
  {% endif %}
{% endblock %}
{% block pagination %}
  {% include "includes/pagination.html" %}
{% endblock %}
