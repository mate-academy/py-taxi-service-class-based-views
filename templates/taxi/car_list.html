{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  {% if car_list %}
    <table>
      {% for car in car_list %}
        <li><a href="{{ car.id }}">{{ car.model }} ({{ car.manufacturer.name }})</a></li>
      {% endfor %}
    </table>
  {% else %}
    <p>There are no cars in the Taxi Service</p>
  {% endif %}
{% endblock %}
