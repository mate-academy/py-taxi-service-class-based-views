{% extends "base.html" %}

{% block title %}
  <title>Car List</title>
{% endblock %}

{% block content %}
  {% if car_list %}
    <table>
      <tbody>
        {% for car in car_list %}
          <tr>
            <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="1">No cars found</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
