{% extends "base.html" %}

{% block content %}
  <h1>Cars</h1>
  <p>
    <table>
      {% if car_list %}
        {% for car in car_list %}
          <tr>
            <td>
              <a href="{% url "taxi:car-detail" car.id %}">{{ car.id }}</a>
            </td>
            <td>
              {{ car.model }}
            </td>
          </tr>
        {% endfor %}
      {% else %}
        Not any car in taxi
      {% endif %}
    </table>
  </p>
{% endblock %}
