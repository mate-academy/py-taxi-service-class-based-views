{% extends "base.html" %}

{% block content %}
  <h1>Cars</h1>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
    </thead>
    <tbody>
      {% for car in car_list %}
        <tr>
          <td>
            <a href="{% url 'taxi:car-detail' car.id %}">
              {{ car.model }}
            </a>
          </td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="2">No cars available.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
