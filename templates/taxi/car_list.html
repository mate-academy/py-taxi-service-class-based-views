{% extends "base.html" %}

{% block content %}
  <h2>Cars list:</h2>
  {% if object_list %}
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Model</th>
          <th>Manufacturer</th>
          <th>Country</th>
        </tr>
      </thead>
      <tbody>
        {% for car in object_list %}
          <tr>
            <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}</a></td>
            <td>{{ car.manufacturer.name }}</td>
            <td>{{ car.manufacturer.country }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No cars available!</p>
  {% endif %}
{% endblock %}
