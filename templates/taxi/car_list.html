{% extends "base.html" %}

{% block content %}
  {% if car_list %}
    <h1>Car List</h1>
    <table class="table table-bordered w-50">
      <tr>
        <th>id</th>
        <th>model</th>
      </tr>
      {% for car in car_list %}
        <tr>
          <th><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></th>
          <th>{{ car.model }}</th>
        </tr>
      {% endfor %}
    </table>
  {% endif %}
{% endblock  %}
