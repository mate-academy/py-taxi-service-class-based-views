<table border="2">
  <tr>
    <th>ID</th>
    <th>Модель</th>
    <th>Виробник</th>
  </tr>
  {% for car in car_list %}
    <tr>
      <td>
        <a href="{% url 'taxi:car-detail' car.pk %}">{{ car.id }}</a>
      </td>
      <td>{{ car.model }}</td>
      <td>{{ car.manufacturer.name }}</td>
    </tr>
  {% endfor %}
</table>

{% include "includes/pagination.html" %}
