{% extends "base.html" %}

{% block title %}
  Car list
{% endblock %}

{% block content %}
  <h1>Car list</h1>

  {% if car_list %}
    <table>
      <thead>
      <tr>
        <th>ID</th>
      </tr>
      </thead>

      <tbody>
      {% for car in car_list %}
        <tr>
          <td>
            <a href="{% url 'taxi:car-detail' car.id %}">
              {{ car.id }}
            </a>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>There are no cars.</p>
  {% endif %}
{% endblock %}
