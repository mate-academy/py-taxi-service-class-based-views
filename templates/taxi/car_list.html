{% extends "base.html" %}

{% block content %}

  <h3>Cars:</h3>

  <table>
    <thead>
    <tr>
      <th>Id</th>
      <th>Model</th>
      <th>Manufacturer</th>
      <th>Country</th>
    </tr>
    </thead>
    <tbody>
    {% for car in car_list %}
      <tr>
        <td>
          <a href="{% url 'taxi:car-detail' pk=car.id %}">{{ car.id }}</a>
        </td>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
        <td>{{ car.manufacturer.country }}</td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="4">Oops... there are no cars</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>

{% endblock %}
