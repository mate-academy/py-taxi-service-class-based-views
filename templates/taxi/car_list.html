{% extends "base.html" %}

{% block content %}
  {% if car_list %}
    <h1>Cars</h1>
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}</a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
  <p>No drivers found.</p>
  {% endif %}
{% endblock %}
