{% extends "base.html" %}

{% block content %}
  <h1>Car list</h1>
  {% if car_list %}
    <table class="table table-bordered">
      <thead>
      <tr>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
      </thead>
      <tbody>
      {% for car in car_list %}
        <tr>
        <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}</a></td>
        <td><a href="{% url 'taxi:manufacturer-detail' car.manufacturer_id %}">{{ car.manufacturer.name }}</a></td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <strong>No cars found</strong>
  {% endif %}
{% endblock %}
