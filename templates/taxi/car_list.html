{% extends "base.html" %}

{% block content %}

<div class="conteiner-fluid mt-4">

  <h2>Cars:</h2>
  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url 'taxi:car-detail' car.pk %}"
              class="list-link link-opacity-40-hover">
            {{ car.model }}
          </a> 
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>cars does not exist</p>
  {% endif %}

</div>

{% endblock %}
