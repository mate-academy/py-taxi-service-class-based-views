{% extends "base.html" %}

{% block content %}
  <h1>Car model: {{ car.manufacturer.name }} {{ car.manufacturer.country}}</h1>
  <div class="ml-3">
    <h3>Drivers:</h3>
    {% for driver in car.drivers.all %}
      <hr>
      <p class="text-muted">{{ driver.id }}</p>
      <p>{{ car.model }} {{ car.manufacturer }}</p>
      <p> {{ driver }}</p>
    {% empty %}
      <p>No cars!</p>
    {% endfor %}
  </div>
{% endblock %}
