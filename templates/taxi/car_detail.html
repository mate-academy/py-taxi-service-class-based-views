{% extends "base.html" %}

{% block content %}
  <h1>{{car.model}}</h1>
  <h4>
    Manufacturer:
  </h4>
  <p>
    {{car.manufacturer.name}} {{car.manufacturer.country}}
  </p>
  <h4>
    Drivers:
  </h4>
  <ul>
    {% for driver in car.drivers.all %}
      <li> {{ driver.first_name }} {{driver.last_name}}</li>
    {% endfor %}
  </ul>
{% endblock %}
