{% extends "base.html" %}

{% block content %}
  <h1>{{ car.model }}</h1>

  <h3>Manufacturer</h3>

  <p>Name: {{ car.manufacturer.name }}</p>
  <p>Country: {{ car.manufacturer.country }}</p>

  <h3>Drivers</h3>

  <ul>
    {% for driver in car.drivers.all %}
      <li>{{ driver.username }}</li>
    {% empty %}
      <li>No drivers</li>
    {% endfor %}
  </ul>
{% endblock %}
