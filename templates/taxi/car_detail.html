{% extends "base.html" %}

{% block content %}
	<h1>Model: {{ car.model }}</h1>
  <p>
    <strong>Manufacturer:</strong> {{ car.manufacturer }}
  </p>
  <p>
    <strong>Drivers:</strong></p>
    <ul>
    {% for driver in car.drivers.all %}
      <li>
        <a href="{% url 'taxi:driver-detail' driver.pk %}">
          {{ driver.username }} ({{ driver.pk }})</a>: {{ driver.license_number }}
      </li>
    {% empty %}
      <p>No drivers!</p>
    {% endfor %}
  </ul>
{% endblock %}
