{% extends "base.html" %}

{% block content %}
  <h1>Car details</h1>
  <p><strong>Manufacturer</strong>: {{ car.manufacturer.name }}</p>
  <p><strong>Country</strong>: {{ car.manufacturer.country }}</p>
  <h1>Drivers:</h1>
  {% for driver in car.drivers.all %}
    <hr>
    <p>{{ driver }}
  {% endfor %}

{% endblock %}
