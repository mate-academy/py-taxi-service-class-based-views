{% extends 'base.html' %}

{% block content %}
  <table class="table-bordered">
    <thead>
    <tr>
      <th scope="col">Manufacturer(name, country)</th>
      <th scope="col">Drivers</th>
    </tr>
    </thead>
    <tbody>
    <tr>
      <td>{{ car.manufacturer.name }} {{ car.manufacturer.country }}</td>
      <td>{% for driver in car.drivers.all %}
        <p>{{ driver.first_name }} {{ driver.last_name }}</p>
      {% endfor %}
      </td>
    </tr>
    </tbody>
  </table>
{% endblock %}
