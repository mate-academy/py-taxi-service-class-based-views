{% extends "base.html" %}

{% block content %}
  <h1>{{ car.model }}</h1>
  <hr>
  <p><strong>Manufacturer: </strong>{{ car.manufacturer.name }} {{ car.manufacturer.country }}</p>
  <ul>
    {% for driver in car.drivers.all %}
      <li>{{ driver.first_name }} {{ driver.last_name }} ({{ driver.license_number }})</li>
    {% endfor %}
  </ul>
{% endblock %}
