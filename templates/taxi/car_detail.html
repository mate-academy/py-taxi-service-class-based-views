{% extends "base.html" %}

{% block content %}
  <h1>Car: {{ car.model }}</h1>
  <div class="ml-3">
    <h3>Drivers:</h3>
    {% for driver in car.drivers.all() %}
      <hr>
      <p class="text-muted">{{ driver.id}}</p>
      <p>{{ driver.first_name }} {{ driver.last_name }}</p>
      {% empty %}
      <p>No drivers!</p>
    {% endfor %}
  </div>
{% endblock %}
