{% extends "base.html" %}

{% block content %}
  <h1>{{ car.model }}</h1>

  <p>
    <strong>Manufacturer:</strong>
    {{ car.manufacturer.name }}
  </p>
  <p>
    <strong>Country:</strong>
    {{ car.manufacturer.country }}
  </p>

  <h3>Drivers</h3>

  <ul>
    {% for driver in car.drivers.all %}
      <li>{{ driver.username }}</li>
    {% empty %}
      <li>No drivers</li>
    {% endfor %}
  </ul>
{% endblock %}
