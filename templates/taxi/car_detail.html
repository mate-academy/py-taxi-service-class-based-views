{% extends "base.html" %}

{% block content %}
    <h1>Car: {{ car.model }}</h1>
    <p><strong>Name:</strong> {{ car.manufacturer.name }}</p>
    <p><strong>Country:</strong> {{ car.manufacturer.country }}</p>
    {% if car.drivers.all %}
        <ul>
            {% for driver in car.drivers.all %}
                <li><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></li>
            {% endfor %}
        </ul>
    {% endif %}
{% endblock %}
