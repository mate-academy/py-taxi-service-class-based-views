{% extends "base.html" %}

{% block content %}
  <h1>Car details:</h1>
  <table class="table table-striped">
    <thead>
      <tr>
        <td>Manufacturer</td>
        <td>Drivers</td>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>{{ car.manufacturer.name }}, {{ car.manufacturer.country }}</td>
        <td>{% for driver in car.drivers.all %} {{ driver.username }}{% if not forloop.last %}, {% endif %} {% endfor %}</td>
      </tr>
    </tbody>
  </table>
{% endblock %}
