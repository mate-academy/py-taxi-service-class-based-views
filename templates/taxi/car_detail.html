{% extends "base.html" %}

{% block content %}
  <h1>{{ car.model }}</h1>
  <h2>Manufacturer</h2>
  <p>
    {{ car.manufacturer.name }}
    ({{car.manufacturer.country}})
  </p>
  <h2>Drivers</h2>
  <ul>
    {% for driver in car.drivers.all %}
    <li>{{ driver.username }}</li>
    {% empty %}
    <li>No drivers</li>
    {% endfor %}
  </ul>
{% endblock %}
