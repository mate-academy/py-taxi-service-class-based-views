{% extends "base.html" %}

{% block content %}
  <h1>{{ car.model }} - {{ car.manufacturer.name }}</h1>
  <ul>
    {% for driver in car.drivers.all %}
    <li>{{ driver.first_name }} {{ driver.last_name }}</li>
    {% empty %}
    <p>No drivers found</p>
    {% endfor %}
  </ul>
{% endblock %}
