{% extends "base.html" %}

{% block content %}
  <h1>{{ car.model }}</h1>
  <p><strong>Manufacturer name: </strong>{{ car.manufacturer.name }}</p>
  <p><strong>Manufacturer country: </strong>{{ car.manufacturer.country }}<p>
  {% for driver in car.drivers.all %}
    <p>{{ driver.first_name }} {{ driver.last_name }}</p>
  {% endfor %}
{% endblock %}
