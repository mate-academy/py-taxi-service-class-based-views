{% extends 'base.html' %}

{% block content %}
    <h1>Model: {{ car.model }}</h1>
    <div class ="ml-3">
        <p>Manufacturer: {{ car.manufacturer }}</p>

        <h3>Drivers: </h3>
        {% for driver in car.drivers.all %}
            <p>{{ driver.first_name }} {{ driver.last_name }}
            </p>
        {% empty %}
            <p>No drivers</p>
    {% endfor %}
    </div>
{% endblock %}
