
{% extends "base.html" %}

{% block content %}
  <h1>Car detail</h1>

  <h2>Model: {{ car.model }}</h2>

  <p>
    Manufacturer: {{ car.manufacturer.name }}
  </p>

  <p>
    Country: {{ car.manufacturer.country }}
  </p>

  <h3>Drivers</h3>

  <ul>
    {% for driver in car.drivers.all %}
      <li>{{ driver.username }}</li>
    {% endfor %}
  </ul>
{% endblock %}
