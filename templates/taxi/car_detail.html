{% extends "base.html" %}
{% block content %}
  <h1>Car: {{ car.model }}</h1>

  <div class="ml-3">
    <h3> Manufacturer:</h3>
    <p>{{ car.manufacturer.name }} from {{ car.manufacturer.country }}.</p>
    <h3>Drivers:</h3>
    {% for driver in car.drivers.all %}
      <hr>
      <p>{{ driver.first_name }} {{ driver.last_name }}</p>
    {% empty %}
      <p>No Drivers!</p>
    {% endfor %}
  </div>
{% endblock %}
