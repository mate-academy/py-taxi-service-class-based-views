{% extends "base.html" %}

{% block content %}
<h2>Car Detail</h2>
<p><strong>Model:</strong> {{ car.model }}</p>
<p><strong>Manufacturer:</strong> {{ car.manufacturer.name }} ({{ car.manufacturer.country }})</p>

<h3>Drivers</h3>
<ul>
    {% for driver in car.drivers.all %}
        <li>{{ driver.username }}</li>
    {% endfor %}
</ul>
{% endblock %}
