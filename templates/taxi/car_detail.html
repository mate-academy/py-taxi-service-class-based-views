{% extends 'base.html' %}
{% block content %}
  <h1>Car: {{ car.model }}</h1>
  <h2>Manufacturer: {{ car.manufacturer.name }}, {{ car.manufacturer.country }}</h2>
  <h2>All drivers:</h2>
  <ul>
    {% for driver in car.drivers.all %}
      <li>{{ driver.first_name }} {{ driver.last_name }}</li>
    {% endfor %}
  </ul>
{% endblock %}
