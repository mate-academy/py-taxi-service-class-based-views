{% extends "base.html" %}

{% block content %}
    <h1>Car: {{ car.model }} ({{ car.manufacturer.name }},  {{ car.manufacturer.country }})</h1>
    <h3>Drivers:</h3>
    {% for driver in car.drivers.all%}
            <hr>
            <p class="text-muted">{{ driver.id }}</p>
            <p>{{ driver.first_name }} {{ driver.last_name }}</p>
        {% endfor %}  
{% endblock content %}
