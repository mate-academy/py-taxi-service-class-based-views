{% extends "base.html" %}

{% block content %}
  <h1>{{ car.model }}</h1>
  <p>Manufacturer: {{ car.manufacturer.name }}</p>

  <h2>Drivers</h2>
  <ul>
    {% for driver in car.drivers.all %}
      <li><a href="{{ driver.get_absolute_url }}">{{ driver.username }} ({{ driver.license_number }})</a></li>
    {% empty %}
      <li>No drivers assigned.</li>
    {% endfor %}
  </ul>
{% endblock %}
