{% extends "base.html" %}
{% block content %}
  <h1> Car {{ car.model }}</h1>
  <div class="ml-3">
    <h3>Manufacturer: {{ car.manufacturer.name }} ({{ car.manufacturer.country }})</h3>
    <h3>Drivers:</h3>
  {% for driver in car.drivers.all %}
    <hr>
    <p class="text-muted"> {{ driver.username }}</p>
  {% empty %}
    <p>No drivers</p>
  {% endfor %}
  </div>
{% endblock %}
