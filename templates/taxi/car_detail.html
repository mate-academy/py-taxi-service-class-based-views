{% extends "base.html" %}

{% block content %}
  <h1>Car Detail</h1>

  <p><strong>Model:</strong> {{ car.model }}</p>

  <h3>Manufacturer</h3>
  <p>Name: {{ car.manufacturer.name }}</p>
  <p>Country: {{ car.manufacturer.country }}</p>

  <h3>Drivers</h3>
  <ul>
    {% for driver in car.drivers.all %}
      <li>{{ driver.username }}</li>
    {% endfor %}
  </ul>
{% endblock %}
