{% extends "base.html" %}
{% block content %}
<h1>Car: {{ car.model }}</h1>
<p>Manufacturer: {{ car.manufacturer.name }} - {{ car.manufacturer.country }}</p>

<p>Drivers:</p>
<ul>
  {% for driver in car.drivers.all %}
    <li>
      <a href="{{ driver.get_absolute_url }}">{{ driver.first_name }} {{ driver.last_name }}</a>
    </li>
  {% endfor %}
</ul>



{% endblock %}
