{% extends "base.html" %}
{% block content %}
  <h1>Car</h1>
  <hr>
  <p>Car: {{ car.model }}</p>
  <p>Name: {{ car.manufacturer.name }}</p>
  <p>Country: {{ car.manufacturer.country }}</p>
  <hr>
  {% for driver in car.drivers.all %}
    <p>Driver: {{ driver.first_name }} {{ driver.last_name }}</p>
  {% endfor %}
{% endblock %}
