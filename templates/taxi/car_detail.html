{% extends "base.html" %}

{% block content %}

  <h1>{{ car.model }}</h1>
  <p><strong>Manufacturer:</strong>{{ car.manufacturer }}</p>
  <h2>Drivers:</h2>
  {% if car.drivers.all %}
    <ul>
      {% for driver in car.drivers.all %}
        <li><strong>Driver</strong> {{ driver.first_name }} {{ driver.last_name }}:</li>
      {% endfor %}
    </ul>
  {% endif %}

{% endblock %}
