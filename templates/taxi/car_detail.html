{% extends "base.html" %}
{% block content %}
  <h1>Car details</h1>
  <p>Model: {{ object.model }}</p>
  <p>Manufacturer: {{ object.manufacturer.name }} {{ object.manufacturer.country }}</p>
  <h2>Drivers</h2>
  <ul>
    {% for driver in object.driver_sel.all %}
      <li>{{ driver.username }}</li>
    {% endfor %}
  </ul>
{% endblock %}
