{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer</h1>
  <p>{{ car.manufacturer.name }} {{ car.manufacturer.country }}</p>
  <h1>Drivers</h1>
  <ul>
    {% for driver in car.drivers.all %}
      <li>{{ driver.first_name }} {{ driver.last_name }} - {{ driver.license_number }}</li>
    {% endfor %}
  </ul>

{% endblock %}
