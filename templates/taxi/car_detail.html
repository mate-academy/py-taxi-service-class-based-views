{% extends "base.html" %}

{% block content %}
  <h1>{{ car.model }}</h1>

  <h3>
    {{ car.manufacturer.name }} //
    {{ car.manufacturer.country }}
  </h3>

  <ul>
    {% for driver in car.drivers.all %}
      <li>{{driver.first_name}} {{driver.last_name}}</li>
    {% endfor %}
  </ul>
{% endblock %}
