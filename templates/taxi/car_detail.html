{% extends "base.html" %}

{% block content %}
  <p>
    <strong>Model: </strong> {{ car.model }}
    <strong>Manufacturer: </strong> {{ car.manufacturer.name }}
  </p>
  <ul>
  {% for driver in car.drivers.all %}
    <li>{{ driver.username }}: {{ driver.first_name }} {{ driver.last_name }}</li>
  {% empty %}
    <p>No drivers!</p>
  {% endfor %}
  </ul>
{% endblock %}
