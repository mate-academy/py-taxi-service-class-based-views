{% extends "base.html" %}

{% block content %}
	<h1>Car: {{ car.model }}</h1>
  <h3>Manufacturer: {{ car.manufacturer.name }}, {{ car.manufacturer.country }}</h3>
  <hr>
  <h3>Drivers:</h3>
  <ul>
    {% for driver in car.drivers.all %}
      <li>{{ driver.first_name }} {{ driver.last_name }}</li>
    {% endfor %}
  </ul>
{% endblock %}
