{% extends "base.html" %}

{% block content %}
<h1>Name: {{ car.model }}</h1>
<p><strong>Country:</strong> {{ car.manufacturer }}</p>
<div class="m-3">
    <h3>Drivers:</h3>
    {% for driver in car.drivers.all %}
    <hr>
    <p class="text-muted">{{ driver.id }}</p>
    <p>{{ driver.first_name }} {{ driver.last_name }}</p>
    {% endfor %}
</div>
{% endblock %}
