{% extends "base.html" %}

{% block content %}
  <h1>Drivers</h1>
  {% if car.drivers.all %}
    <ul>
      {% for driver in car.drivers.all %}
        <li>
          <a href = {% url 'taxi:driver-detail' car.id %}>
            Driver: {{ driver.first_name }} {{ driver.last_name }}
          </a>
        </li>
      {% endfor %}
    </ul>

  {% endif %}
{% endblock %}
