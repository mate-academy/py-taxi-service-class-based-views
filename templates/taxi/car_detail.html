{% extends "base.html" %}

{% block content %}
  <h2>Model: {{ car.model }}</h2>
  <h2>Manufacturer name: {{ car.manufacturer.name }}</h2>
  <h2>Manufacturer country: {{ car.manufacturer.country }}</h2>
  <div>
    <h2>Drivers:</h2>
    <ul>
      {% for driver in car.drivers.all %}
      <li><h3>Username: {{ driver.username }}</h3></li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
