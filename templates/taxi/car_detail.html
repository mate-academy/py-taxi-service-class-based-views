{% extends "base.html" %}

{% block content %}
  <h1>Title: {{ car.model }}</h1>
  <p><strong>Manufactures : {{ car.manufacturer }}</strong></p>
  <div>
    <h3>Drivers:</h3>
    {% for driver in car.drivers.all %}
      <p>{{ driver.username }}</p>
      <p>{{ driver.first_name }}</p>
      <p>{{ driver.last_name }}</p>
    {% empty %}
      <p>No drivers!</p>
    {% endfor %}
  </div>
{% endblock %}
