{% extends "base.html" %}
{% block content %}
    <h1>Car Detail</h1>
    <p><strong>Model: </strong>{{ car.model }}</p>
    <p><strong>Manufacturer: </strong>{{ Manufacturer.name }} {{ Manufacturer.country }}</p>
    <h4>Drivers:</h4>
      <ul>
        {% for driver in car.drivers.all %}
        <li>{{ driver.username }}</li>
        {% endfor %}
      </ul>
  {% include 'includes/pagination.html' %}
{% endblock %}
