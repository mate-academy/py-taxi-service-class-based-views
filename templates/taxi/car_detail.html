{% extends "base.html" %}

{% block content %}
  <h1>{{ car.model }}</h1>
  <hr>
  <p><strong>Manufacturer:</strong> ({{ car.manufacturer.name }}, {{ car.manufacturer.country }})</p>
  <div class="ml-3">
    <h3>Drivers:</h3>
    {% for driver in car.drivers.all %}
      <p>id: {{ driver.id }}</p>
      <p>{{ driver.first_name }} {{ driver.last_name }}</p>
    {% endfor %}
  </div>
{% endblock %}
