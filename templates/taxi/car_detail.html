{% extends "base.html" %}
{% block content %}
  <h1>{{ car.model }}</h1>
  <h2>Manufacturer</h2>
  <p>Name: {{ car.manufacturer.name }} Country: {{ car.manufacturer.country }}</p>
  {% for driver in car.drivers.all %}
    <li>{{ driver.first_name }} {{ driver.last_name }}</li>
  {% endfor %}
{% endblock %}
