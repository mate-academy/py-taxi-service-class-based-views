{% extends "base.html" %}
{% block content %}
  <h1>Car model: {{ car.model }}</h1>
  <h2>Manufacturer: {{ car.manufacturer.name }} {{ car.manufacturer.country }}</h2>
  <h3>Drivers:</h3>
  {% for driver in car.drivers.all %}
    <p>{{ driver.first_name }} {{ driver.last_name }}</p>
  {% endfor %}
{% endblock %}
