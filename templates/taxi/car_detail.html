{% extends "base.html" %}

{% block content %}
  <table>
    <thead>
    <tr>
      <th>Model</th>
      <th>Car manufacturer</th>
      <th>Manufacturer country</th>
    </tr>
    </thead>
    <tbody>
    <tr>
      <td>{{ car.model }}</td>
      <td>{{ car.manufacturer.name }}</td>
      <td>{{ car.manufacturer.country }}</td>
    </tr>
    </tbody>
  </table>
  <table>
    <thead>
    <tr>
      <th>Drivers:</th>
    </tr>
    </thead>
    <tbody>
    {% for driver in car.drivers.all %}
      <tr>
        <td><a href="{{ driver.get_absolute_url }}">{{ driver.license_number }}</a></td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
