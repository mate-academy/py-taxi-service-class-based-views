{% extends "base.html" %}

{% block content %}
  <h1>Car: {{ car.model }}</h1>
  <p><strong>Car manufacturer:</strong> {{ car.manufacturer.name }}</p>
  <p><strong>Origin:</strong> {{ car.manufacturer.country }}</p>
  <p><strong>Car drivers:</strong></p>
  <ul>
    {% for driver in  car.drivers.all %}
      <li>{{ driver.first_name }} {{ driver.last_name }}</li>
    {% endfor %}
  </ul>

{% endblock %}
