{% extends "base.html" %}

{% block content %}
<h2>Model: {{car.model}}</h2>
<h3>Manufacturer:</h3>
<p>Name: {{car.manufacturer.name}}</p>
<p>Country: {{car.manufacturer.country}}</p>

<h3>Drivers of the car:</h3>
{% for driver in car.drivers.all %}
  <p>{{driver.username}}</p>
{% empty %}
<p>No drivers</p>
{% endfor %}

{% endblock %}
