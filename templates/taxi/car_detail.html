{% extends "base.html" %}
{% block content %}
  <h1>Car model: {{ car.model }}</h1>
  <p>Manufacturer: {{ car.manufacturer.name }}</p>
  <p>Drivers: </p>
    <ul>
      {% for driver in car.drivers.all %}
        <li>{{ driver.first_name }} {{ driver.last_name }}</li>
      {% endfor %}
    </ul>
{% endblock %}
