{% extends "base.html" %}

{% block content %}
  <h1>Car detail</h1>
  {% if car %}
    <ul>
      <li>Manufacturer: {{car.manufacturer.name}}</li>
      <li>Country: {{car.manufacturer.country}}</li>
      {% for driver in car.drivers.all %}
      <li>{{ driver.username }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
