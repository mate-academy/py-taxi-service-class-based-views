{% extends "base.html" %}

{% block content %}
  <h1>Car detail</h1>
  <table class="table table-striped">
    <thead>
    <th>Manufacturer</th>
    <th>Country</th>
    <th>Drivers</th>
    </thead>
    <tbody>
    <tr>
      <td>{{ car.manufacturer.name }}</td>
      <td>{{ car.manufacturer.country }}</td>
      <td>
        {% for driver in car.drivers.all %}
          <p>{{ driver.first_name }} {{ driver.last_name }}</p>
        {% endfor %}
      </td>
    </tr>
    </tbody>
  </table>
{% endblock %}
