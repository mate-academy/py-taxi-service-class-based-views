{% extends "base.html" %}
{% block content %}
  <h1 class="title">"{{ car.model }} ({{ car.manufacturer.name }}, {{ car.manufacturer.country }})" Drivers</h1>
  <ul class="list-group">
    {% for driver in car.drivers.all %}
      <li class="list-group-item">
        <a href={% url 'taxi:driver-detail' driver.id %}>
          {{ driver.first_name }} {{ driver.last_name }}
        </a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
