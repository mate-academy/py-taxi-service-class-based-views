{% extends "base.html" %}

{% block content %}
  <h1>Car Information</h1>
  <h3>Manufacturer</h3>
  <p>Name: {{ car.manufacturer.name }}</p>
  <p>Country: {{ car.manufacturer.country }}</p>

  <ul>
    {% for driver in car.drivers.all %}
      <li>{{ driver.first_name }} {{ driver.last_name }}</li>
    {% endfor %}
  </ul>
{% endblock %}
