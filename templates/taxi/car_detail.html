{% extends "base.html" %}

{% block content %}
  <span>
    Model: {{ car.model }}
    Manufacturer: {{ car.manufacturer.name }}
    Country: {{ car.manufacturer.country }}
  </span>

  {% for driver in car.drivers.all %}
    <p>{{ driver }}</p>
  {% empty %}
    <p>No drivers!</p>
  {% endfor %}
{% endblock %}
