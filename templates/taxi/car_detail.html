{% extends 'base.html' %}

{% block content %}
  <h1>Car</h1>
  <h3>{{ car.model }}</h3>
  <div class="ml-3">
    <p>Manufacturer:</p>
    <p>Name:{{ car.manufacturer.name }}</p>
    <p>Country:{{ car.manufacturer.country }}</p>
    <ul> Drivers:
      {% for driver in car.drivers.all %}
        <li>Username: <a href="{% url 'taxi:driver-detail' pk=driver.id %}">
          {{ driver.username }}
        </a>
        </li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
