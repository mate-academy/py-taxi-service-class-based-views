{% extends "base.html" %}

{% block content %}
    <p>Car Id: {{ car.id }}</p>
    <p>Manufacturer: {{ car.manufacturer.name }}</p>
    <p>Country: {{ car.manufacturer.country }}</p>
    <p>Drivers License Numbers:</p>
    {% for driver in car.drivers.all %}
        <p>{{ driver.license_number }}</p>
    {% endfor %}
    <br>
    <br>
{% endblock %}
