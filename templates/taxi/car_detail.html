{% extends "base.html" %}

{% block content %}
	<h1>Car info</h1>
  <p><strong>Model:</strong> {{ car.model }}</p>
  <p><strong>Country:</strong> {{ car.manufacturer.country }}</p>
  {% for driver in car.drivers.all %}
  	<li>{{ driver.first_name }} {{ driver.last_name }}</li>
  {% endfor %}

{% endblock %}
