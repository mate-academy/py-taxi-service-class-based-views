{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer: </h1>
    <p>Company: {{ car.manufacturer.name }}</p>
    <p>Country: {{ car.manufacturer.country }}</p>
  <h2>Drivers: </h2>
    {% for driver in car.drivers.all %}
      <p>{{ driver.username }} - {{ driver.first_name }} {{ driver.last_name }}</p>
  {% endfor %}
{% endblock %}
