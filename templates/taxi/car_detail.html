{% extends "base.html" %}

{% block content %}
  <h1>{{ car.model }}</h1>

  <p>
    <strong>Manufacturer:</strong>
    {{ car.manufacturer.name }} ({{ car.manufacturer.country }})
  </p>

  <h2>Drivers</h2>
  <ul>
    {% for driver in car.drivers.all %}
      <li>
        <a href="{% url 'taxi:driver-detail' pk=driver.id %}">
          {{ driver }}
        </a>
      </li>
    {% empty %}
      <li>No drivers for this car</li>
    {% endfor %}
  </ul>
{% endblock %}
