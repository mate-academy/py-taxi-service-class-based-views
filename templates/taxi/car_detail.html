{% extends "base.html" %}

{% block content %}
  <h1>Car detail</h1>

  <p>
    <strong>Model:</strong> {{ car.model }}
  </p>

  <p>
    <strong>Manufacturer:</strong>
    {{ car.manufacturer.name }}
    ({{ car.manufacturer.country }})
  </p>

  <h2>Drivers</h2>

  <ul>
    {% for driver in car.drivers.all %}
      <li>
        {{ driver.username }}
      </li>
    {% endfor %}
  </ul>
{% endblock %}
