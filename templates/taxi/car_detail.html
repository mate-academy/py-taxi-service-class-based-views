{% extends "base.html" %}
{% block content %}
<h1>Manufacturer name: {{ car.manufacturer.name }}</h1>
<h2>Country: {{ car.manufacturer.country }}</h2>
<div class="ml-3">
  <h3>Drivers:</h3>
  {% for driver in car.drivers.all %}
  <hr>
  <p>{{ driver.first_name }} {{ driver.last_name }}</p>
  {% endfor %}
</div>
{% endblock %}
