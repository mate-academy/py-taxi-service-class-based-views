{% extends 'base.html' %}

{% block content %}
  <h1>Drivers</h1>
  {% if car.drivers.all %}
    <ul>
      {% for car in car.drivers.all %}
        <a href={% url 'taxi:driver-detail' car.id %}>
          Driver: {{ driver.first_name }} {{ driver.last_name }}
        </a>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
