{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer {{ manufacturer.name }}</h1>
  <p><strong>Country: </strong>{{ manufacturer.country }}</p>
  <h3>Cars</h3>
  <table class="table">
    <tr>
      <th>ID</th>
      <th>Model</th>
    </tr>
    {% for car in manufacturer.cars.all %}
      <tr>
        <td><a href="{% url 'taxi:car-detail' car.id %}">{{ car.id }}</a></td>
        <td>{{ car.model }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
