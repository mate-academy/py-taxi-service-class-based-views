{% extends "base.html" %}

{% block content %}
  <div>
    <h1>
      Driver:
      {{ driver.first_name }} {{ driver.last_name }}
      {% if driver.username %}
        ({{ driver.username }})
      {% endif %}
    </h1>
    <h2>
      Cars:
    </h2>
    <ul>
      {% for car in driver.cars.all%}
        <li>
          <a href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}</a>
        </li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
