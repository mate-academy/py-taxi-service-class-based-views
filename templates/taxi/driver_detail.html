{% extends "base.html" %}

{% block content %}
<h1>Information about all driver's cars</h1>
<h3>Driver's cars: {{ object.username }}</h3>
<table>
  <thead>
  <tr>
    <th>Model</th>
    <th>Manufacturer</th>
    <th>Country</th>
  </tr>
  </thead>
  <tbody>
  {% for car in object.cars.all %}
  <tr>
    <td>{{ car.model }}</td>
    <td>{{ car.manufacturer.name }}</td>
    <td>{{ car.manufacturer.country }}</td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
