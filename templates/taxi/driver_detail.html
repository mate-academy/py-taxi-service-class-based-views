<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Driver Details</title>
</head>
<body>
  <h1>{{ driver.first_name }} {{ driver.last_name }}</h1>

  <h2>Cars:</h2>
  <ul>
    {% for car in driver.cars.all %}
      <li>{{ car.model }} ({{ car.manufacturer.name }})</li>
    {% empty %}
      <li>This driver has no cars.</li>
    {% endfor %}
  </ul>
</body>
</html>
