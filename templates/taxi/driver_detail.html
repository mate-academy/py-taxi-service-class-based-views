{% extends "base.html" %}

{% block content %}
  <h1>Driver detail: _{{ driver.first_name }}_</h1>
  <p><strong>License number: </strong>{{ driver.license_number }}</p>

  <h3>Cars: </h3>
  {% for car in driver.cars.all %}
    <p>{{ car.model }}</p>
  {% empty %}
    <p>No cars in this driver</p>
  {% endfor %}

{% endblock %}
