{% extends "base.html" %}
{% block content %}
  <strong>{{ driver.first_name }}, {{ driver.last_name }}</strong>
  <strong>{{ driver.license_number }}</strong>
  <ul>
    {% for car in driver.cars.all %}
      <li>{{ car.model }} {{ car.manufacturer.name }}</li>
    {% empty %}
      <li>Порожньо</li>
    {% endfor %}
  </ul>
{% endblock %}
