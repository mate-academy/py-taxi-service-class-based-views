{% extends "base.html" %}

{% block content %}
  <h3 style="text-align: center;">Car info</h3>
  <table border="1" style="margin: 0 auto;">
    {% for car in driver.cars.all %}
      <tr>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
        <td>{{ car.manufacturer.country }}</td>
      </tr>
  {% endfor %}
  </table>
{% endblock %}
