{% extends "base.html" %}

{% block content %}
  <div class="ml-3">
    <h3>Cars:</h3>
    {% for car in driver.cars.all %}
      <p class="text-muted">Model: {{ car.model }}</p>
      <p>Name: {{ car.manufacturer.name }}</p>
      <p>Country: {{ car.manufacturer.country }}</p>
      <hr>
    {% empty %}
      <p>No cars!</p>
    {% endfor %}
  </div>
{% endblock %}
