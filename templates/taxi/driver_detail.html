{% extends "base.html" %}

{% block content %}
  <h1>Driver: {{ driver.username }}</h1>
  <p><strong>All cars of a driver:</strong></p>
  <ul>
    {% for car in driver.cars.all %}
      <li>Model: {{ car.model }}, manufacturer: {{ car.manufacturer.name }}.</li>
    {% endfor %}
  </ul>
{% endblock %}
