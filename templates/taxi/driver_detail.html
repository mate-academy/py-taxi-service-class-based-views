{% extends "base.html" %}

{% block content %}
<h1>Name: {{ driver.first_name }} {{ driver.last_name }}</h1>
<p><strong>License:</strong> {{ driver.license_number }}</p>
<div class="m-3">
    <h3>Drivers:</h3>
    {% for car in driver.cars.all %}
    <hr>
    <p class="text-muted">{{ car.id }}</p>
    <p>{{ car.model }}</p>
    {% endfor %}
</div>
{% endblock %}
