{% extends "base.html" %}
{% block content %}
<h2>driver: {{ object.username }}</h2>
<p><strong>Licence:</strong> {{ object.license_number }}</p>
<h3>Cars:</h3>
<ul>
  {% for car in object.cars.all %}
    <li>{{ car.model }} ({{ car.manufacturer.name }})</li>
  {% endfor %}
</ul>
{% endblock %}
