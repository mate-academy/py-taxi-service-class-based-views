{% extends "base.html" %}

{% block content %}
  <h1>Driver: {{ driver.username }} {{ driver.first_name }} {{ driver.last_name }}</h1>
  <p><strong>License number: {{ driver.license_number }}</strong></p>
  <div>
    <h3>Cars:</h3>
    {% for car in driver.cars.all %}
      <hr>
      <p>Car: {{ car.model }}</p>
    {% endfor %}
  </div>
{% endblock %}
