{% extends "base.html" %}

{% block content %}
	<h3>Car this driver</h3>
	<table class="table table-hover">
		<tr>
			<th>ID</th>
			<th>Model</th>
			<th>Manufacturer</th>

		</tr>
		{% for car in driver.cars.all %}
			<tr>
				<td>{{ car.id }}</td>
				<td>{{ car.model }}</td>
				<td>{{ car.manufacturer.name }}</td>
			</tr>
		{% empty %}
			This driver does not have a car
		{% endfor %}
	</table>
{% endblock %}
