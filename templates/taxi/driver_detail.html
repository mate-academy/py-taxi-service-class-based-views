{% extends "base.html" %}

{% block content %}
  <h1> Driver: {{ driver.username }}</h1>
  <div class="ml-3">
    <h3> Cars:</h3>
  {% for car in driver.cars.all %}
    <hr>
    <p class="text-muted"> Car ID: {{ car.id }} </p>
    <p> Model: {{ car.model }}
    <p> Manufacturer: {{ car.manufacturer.name }}
    </p>
    {% empty %}
    <p>No cars!</p>
  {% endfor %}
  </div>
{% endblock %}
