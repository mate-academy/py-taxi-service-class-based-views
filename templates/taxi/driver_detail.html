{% extends "base.html" %}

{% block content %}
  <h1>Driver Detail</h1>
  <h2>{{ driver.username }}</h2>
  <h4>{{ driver.first_name }} {{ driver.last_name }}</h4>
  <h6>Cars:</h6>
  <table>
    <tr>
      <th>ID</th>
      <th>Model</th>
      <th>Manufacturer</th>
    </tr>
    {% for car in driver.cars.all %}
      <tr>
        <td>{{ car.id }}</td>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
