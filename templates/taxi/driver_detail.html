{% extends "base.html" %}

{% block content %}
  <h1>Driver {{ driver.id }} Information</h1>
  <p>{{ driver.first_name }} {{ driver.last_name }}</p>

  <div class="ml-3">
    <h3>Cars:</h3>
    <br>
    <ul>
      {% for car in driver.cars.all %}
        <li>{{ car.model }} ({{ car.manufacturer.name }})</li>
      {% empty %}
        <li class="text-gray-500">No cars found</li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
