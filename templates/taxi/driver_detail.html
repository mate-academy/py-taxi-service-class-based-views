{% extends "base.html" %}

{% block content %}
  <h1>{{ driver }}</h1>

  <h2>Cars</h2>
  <ul>
    {% for car in driver.cars.all %}
      <li>
        <a href="{% url 'taxi:car-detail' pk=car.id %}">
          {{ car.model }} ({{ car.manufacturer.name }})
        </a>
      </li>
    {% empty %}
      <li>No cars for this driver</li>
    {% endfor %}
  </ul>
{% endblock %}
