{% extends "base.html" %}

{% block content %}
  <h1>Driver detail</h1>
  {% if driver %}
    <ul>
      {% for car in driver.cars.all %}
      <li>Model: {{ car.model }}</li>
      <li>Country: {{car.manufacturer.country}}</li>
      <li>Manufacturer: {{car.manufacturer.name}}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
