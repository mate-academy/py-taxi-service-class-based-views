{% extends "base.html" %}
{% block title %}
  <title>Driver</title>
{% endblock %}
{% block content %}
  {% if driver %}
    <h1>Driver: {{ driver.first_name }} {{ driver.last_name }}</h1>
    <ul>
      {% for car in driver.cars.all %}
        <li>
          <a href="{{ car.get_absolute_url }}">{{ car.id }}</a>
        </li>
      {% empty %}
        <p>No cars yet.</p>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
