{% extends "base.html" %}

{% block content %}
  <h1>Driver:{{ driver.username }}</h1>
  {% if driver.cars %}
    <ul>
      {% for car in driver.cars.all %}
        <li><a href="{% url "taxi:car-detail" car.id %}">{{ car.id }}</a> {{ car.model }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
