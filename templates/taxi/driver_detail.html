{% extends "base.html" %}

{% block content %}
  <h1>Driver: {{ object.username }}</h1>
  <p>License Number: {{ object.license_number }}</p>
  <h2>Cars</h2>
  <ul>
    {% for car in object.car_set.all %}
      <li>{{ car.model }} (Manufacturer: {{ car.manufacturer.name }})</li>
    {% endfor %}
  </ul>
{% endblock %}
