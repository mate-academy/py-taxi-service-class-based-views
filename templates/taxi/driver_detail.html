{% extends "base.html" %}
{% block content %}
  <h1>Driver details</h1>
  <ul>
    <li><strong>Driver cars:</strong></li>
      {% for car in object.cars.all %}
        <li>{{ car.model }} ({{ car.manufacturer.name }})</li>
      {% empty %}
        <li>No cars assigned to this driver</li>
      {% endfor %}
  </ul>
{% endblock %}
