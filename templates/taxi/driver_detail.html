{% extends "base.html"  %}
{% block content %}
<h1> {{ driver.username }} is owner of:</h1>
  {% if driver.cars.all %}
    <ul>
    {% for car in driver.cars.all %}
      <li>{{ car.model }}  {{ car.manufacturer.name }}  {{ car.manufacturer.country }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
