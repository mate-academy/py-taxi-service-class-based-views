{% extends "base.html" %}

{% block content %}
  <h1>Driver Detail</h1>
  <p><strong>Username: </strong>{{ driver.username }}</p>
  <p><strong>Email: </strong>{{ driver.email }}</p>
  <p><strong>License number: </strong>{{ driver.license_number }}</p>
  <h2>Cars</h2>
  <ul>
    {% for car in driver.cars.all %}
      <li>{{ car.model }} ({{ car.manufacturer.name }})</li>
    {% endfor %}
  </ul>
{% endblock %}
