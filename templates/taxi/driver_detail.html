{% extends "base.html" %}

{% block content %}
  <h1>{{ driver.username }}</h1>
  <p>License number: {{ driver.license_number }}</p>

  <h2>Cars</h2>
  <ul>
    {% for car in driver.cars.all %}
      <li><a href="{{ car.get_absolute_url }}">{{ car.model }} ({{ car.manufacturer.name }})</a></li>
    {% empty %}
      <li>No cars assigned.</li>
    {% endfor %}
  </ul>
{% endblock %}
