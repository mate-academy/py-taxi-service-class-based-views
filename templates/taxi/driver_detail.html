{% extends "base.html" %}

{% block content %}
  <h1>{{ driver.first_name }} {{ driver.last_name }}</h1>
  <h3>({{ driver.username }})</h3>
  {% if driver.cars %}
  	<ul>
      {% for car in driver.cars.all %}
        <li><a href="{% url "taxi:car-detail" car.id %}">{{ car.model }}</a></li>
      {% empty %}
        <p>Driver does not have any car!</p>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
