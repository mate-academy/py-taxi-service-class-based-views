{% extends "base.html" %}

{% block content %}
  <h4>{{ driver.username }}</h4>
  {% if driver.cars.all %}
    {% for car in driver.cars.all %}
      <ul>
        <li>
          <p>{{ car.model }}</p>
        </li>
      </ul>
    {% endfor %}
  {% else %}
    <p>No cars found</p>
  {% endif %}
{% endblock %}
