{% extends "base.html" %}

{% block content %}
  <p>{{ driver.username }}, {{ driver.license_number }}</p>
  <p>First name: {{ driver.first_name }}, Last name: {{ driver.last_name }}</p>
  <ul>
    {% for car in driver.cars.all %}
      <li>{{ car.model }}, {{ car.manufacturer.name }}</li>
    {% endfor %}
  </ul>
{% endblock %}
