{% extends "base.html" %}

{% block content %}
  <h1>{{ driver.first_name }} {{ driver.last_name }}</h1>
  {% if driver.cars.all %}
    <h3>Cars:</h3>
    <ul>
      {% for car in driver.cars.all %}
        <li>{{ car.model }}</li>
      {% endfor %}
    </ul>
    {% else %}
      <p>There are no cars for this driver</p>
    {% endif %}
{% endblock %}
