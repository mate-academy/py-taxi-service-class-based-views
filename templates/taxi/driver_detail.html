{% extends "base.html" %}

{% block content %}
<h1>Driver: {{ object.username }}</h1>
<p>License Number: {{ object.license_number }}</p>

<h2>Cars of this driver</h2>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Model</th>
      <th>Manufacturer</th>
    </tr>
  </thead>
  <tbody>
    {% for car in object.cars.all %}
    <tr>
      <td><a href="{% url 'taxi:car-detail' car.pk %}">{{ car.id }}</a></td>
      <td>{{ car.model }}</td>
      <td>{{ car.manufacturer.name }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
