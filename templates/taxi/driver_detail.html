{% extends "base.html" %}

{% block content %}
  <h1>Driver: {{ driver.first_name }} {{ driver.last_name }} </h1>
  <p><strong>Driver license number: </strong>{{ driver.license_number }}</p>
  <p><strong>Driver cars: </strong></p>
  <div class="ml-3">
    {% for car in driver.cars.all %}
      <p>{{ car.model }}</p>
    {% empty %}
     <p>No cars!</p>
  {% endfor %}
  </div>
{% endblock %}
