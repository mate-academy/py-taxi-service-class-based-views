{% extends "base.html" %}
{% block content %}
  <h1>Driver details</h1>
  <p>Username: {{ object.username }}</p>
  <p>License: {{ object.license_number }}</p>
  <h2>Cars</h2>
  <ul>
  {% for car in object.cars.all %}
  <li>{{ car.model }} ({{ car.manufacturer.name }})</li>
  {% endfor %}
  </ul>
{% endblock %}
