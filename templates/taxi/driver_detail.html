{% extends "base.html" %}

{% block content %}
  <h1>{{ driver.username }}</h1>
  <p><strong>First_name: </strong>{{ driver.first_name }}</p>
  <p><strong>Last_name: </strong>{{ driver.last_name }}</p>
  <div class="ml-3">
    <h3>Cars: </h3>
    {% for car in driver.cars.all %}
      <hr>
      <p class="text-muted">{{ car.id }}</p>
      <p>{{ car.model }}</p>
    {% empty %}
      <p>No cars</p>
    {% endfor %}
  </div>
{% endblock %}
