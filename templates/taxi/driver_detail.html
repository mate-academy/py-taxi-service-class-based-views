{% extends "base.html" %}

{% block content %}
  <h1>Driver: {{ driver.username }}</h1>
  <p>First name: {{ driver.first_name }}</p>
  <p>Last name: {{ driver.last_name }}</p>
  <div class="ml-3">
    <h3>Cars:</h3>
    {% for car in driver.cars.all %}
      <hr>
      <p class="text-muted">{{ car.id }}</p>
      <p>{{ car.model }} {{ car.manufacturer.name }}</p>
      {% empty %}
        <p>No cars</p>
    {% endfor %}
  </div>
{% endblock %}
