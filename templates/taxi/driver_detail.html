{% extends "base.html" %}
{% block content %}
<h1>Driver: {{ object.username }}</h1>
<p><strong>First Name:</strong> {{ object.first_name }}</p>
<p><strong>Last Name:</strong> {{ object.last_name }}</p>
<h2>Cars:</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
    </tr>
    {% for car in object.car_set.all %}
    <tr>
        <td>{{ car.id }}</td>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
