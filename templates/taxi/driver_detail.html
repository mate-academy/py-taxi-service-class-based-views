{% extends "base.html" %}
{% block content %}
<h1>Driver details</h1>
  <ul>
  <li>Driver: {{ driver.first_name }} {{ driver.last_name }}</li>
    {% for car in driver.cars.all %}
  <li>Cars: {{ car.model }}</li>
  <li>Manufacturer: {{ car.manufacturer.name }}</li>
      {% endfor %}
  </ul>

{% endblock %}
