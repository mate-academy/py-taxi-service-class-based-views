{% extends "base.html" %}

{% block content %}
    <h1>Driver {{ driver.username }} detail</h1>
    <h2>Drivers cars</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>id</th>
                    <th>Model</th>
                    <th>Manufacturer</th>
                </tr>
            </thead>
            {% if driver.cars.all %}
                {% for car in driver.cars.all %}
                    <tr>
                        <td><a href={% url "taxi:car-detail" car.id %}> {{ car.id }}</a></td>
                        <td>{{ car.model }}</td>
                        <td>{{ car.manufacturer }}</td>
                    </tr>
                {% endfor %}
            {% endif %}
        </table>
{% endblock %}
