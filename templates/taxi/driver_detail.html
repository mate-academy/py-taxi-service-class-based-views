{% extends 'base.html' %}

{% block content %}
  <h1>{{ driver.first_name }} {{ driver.last_name }}'s cars:</h1>
  <ul>
  {% for car in driver.cars.all %}
    <li><a href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}</a></li>
  {% empty %}
    Driver has no cars.
  {% endfor %}
  </ul>
{% endblock %}
