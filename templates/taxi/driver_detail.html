{% extends "base.html" %}

{% block content %}
  <h2>Driver: {{ driver.first_name }} {{ driver.last_name }}</h2>
  <h3>Cars:</h3>
  <table>
    <tr>
      <th>ID</th>
      <th>Model</th>
      <th>Manufacturer</th>
      <th>Country</th>
    </tr>
    {% for car in driver.cars.all %}
    	<tr>
        <td><a href="{{ car.get_absolute_url }}">{{ car.id }}</a></td>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
        <td>{{ car.manufacturer.country }}</td>
      </tr>
    {% endfor %}
  </table>
{%  endblock %}
