{% extends "base.html" %}

{% block title %}
  Driver detail
{% endblock %}

{% block content %}
  <h1>Driver detail</h1>

  <table>
    <thead>
    <tr>
      <th>Car ID</th>
      <th>Manufacturer</th>
    </tr>
    </thead>

    <tbody>
    {% for car in driver.cars.all %}
      <tr>
        <td>
          <a href="{% url 'taxi:car-detail' car.id %}">
            {{ car.id }}
          </a>
        </td>
        <td>{{ car.manufacturer }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="2">This driver has no cars.</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
