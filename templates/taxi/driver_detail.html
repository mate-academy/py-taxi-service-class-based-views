{% extends "base.html" %}
{% block content %}
  <h1>Driver details</h1>
  <p>Username: {{ driver.username }}</p>
  <p>First name: {{ driver.first_name }}</p>
  <p>Last name: {{ driver.last_name }}</p>
  <h2>Cars</h2>
  <ul>
    {% for car in driver.cars.all %}
      <li>
        {{ car.model }} — {{ car.manufacturer.name }}
      </li>
    {% endfor %}
  </ul>
{% endblock %}
