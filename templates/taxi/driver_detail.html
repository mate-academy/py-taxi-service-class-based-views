{% extends "base.html" %}

{% block content %}
  <h1>Driver Detail</h1>
  <h2>{{ driver.first_name }} {{ driver.last_name }}</h2>
  <p>License number: {{ driver.license_number }}</p>
  <br>
  <h2>Cars:</h2>
  <ul>
    {% for car in driver.cars.all %}
      <hr>
      <li>{{ car.model }} | {{ car.manufacturer.name }}</li>
    {% endfor %}
  </ul>
{% endblock %}
