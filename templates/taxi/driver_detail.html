{% extends "base.html" %}

{% block content %}
  <h1>{{ driver.username }}</h1>
  {% if driver.cars.exists %}
    <ul>
      {% for car in driver.cars.all %}
        <li>
          {{ car.model }} {{ car.manufacturer.name }}
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>This driver has no cars.</p>
  {% endif %}
{% endblock %}
