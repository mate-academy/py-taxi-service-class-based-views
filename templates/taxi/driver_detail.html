{% extends "base.html" %}

{% block content %}
  <h1>Driver: {{ driver.first_name }} {{ driver.last_name }}</h1>
  <p><strong>Cars: </strong></p>
  <ul>
    {% for car in driver.cars.all %}
      <li><a href="{% url "taxi:car-detail" car.id %}">{{ car.model }}, {{ car.manufacturer.name }}</a></li>
    {% endfor %}
  </ul>
{% endblock %}
