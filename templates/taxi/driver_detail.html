{% extends "base.html" %}

{% block content %}
  <h1>Driver Cars: </h1>
  <p><strong>Driver: </strong>{{ driver.first_name }} {{ driver.last_name }}</p>
  <div class="ml-3">
  <h3>Cars:</h3>
    {% for car in driver.cars.all %}
      <hr>
      <p>{{ car.model }}</p>
    {% empty %}
      <p>No cars!</p>
    {% endfor %}
  </div>
{% endblock %}
