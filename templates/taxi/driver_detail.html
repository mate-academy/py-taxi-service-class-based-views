{% extends "base.html" %}

{% block content %}
  <h1>{{ driver.username }}</h1>

  <p>License number: {{ driver.license_number }}</p>

  <h3>Cars</h3>

  <ul>
    {% for car in driver.cars.all %}
      <li>
        {{ car.model }} ({{ car.manufacturer.name }})
      </li>
    {% empty %}
      <li>No cars</li>
    {% endfor %}
  </ul>
{% endblock %}
