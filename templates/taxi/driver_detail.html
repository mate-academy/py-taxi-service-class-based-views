{% extends "base.html" %}

{% block content %}
  <h1>Driver: {{ object.username }}</h1>
  <p>License number: {{ object.license_number }}</p>

  <h3>Cars</h3>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Car ID</th>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
    </thead>
    <tbody>
      {% for car in object.cars.all %}
      <tr>
        <td><a href="{% url 'taxi:car-detail' car.pk %}">{{ car.pk }}</a></td>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3">No cars.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
