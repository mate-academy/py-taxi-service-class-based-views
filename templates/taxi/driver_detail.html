{% extends "base.html" %}

{% block content %}
  <h1>{{ driver.username }}</h1>
  <hr style="height: 4px; background-color: black; border: none;">
  <h3>Cars:</h3>
    <ul class="list-group d-inline-block">
      {% for car in driver.cars.all %}
        <li class="list-group-item">
          {{ car.model }} - {{ car.manufacturer.name }}
        </li>
      {% empty %}
        <li class="list-group-item">
          No cars assigned
        </li>
      {% endfor %}
    </ul>
{% endblock %}
