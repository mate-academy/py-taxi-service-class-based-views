{% extends "base.html" %}

{% block content %}
  <h1>Driver {{ driver.username }}</h1>
  <h3>Cars</h3>
  <ul>
    {% for car in driver.cars.all %}
      <li>{{ car.model }} ({{ car.manufacturer.name }} - {{ car.manufacturer.country }})</li>
    {% empty %}
      <li>No cars.</li>
    {% endfor %}
  </ul>
{% endblock %}
