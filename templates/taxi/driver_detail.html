{% extends "base.html" %}

{% block content %}
  <h1>Driver detail</h1>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Model</th>
          <th>Manufacturer</th>
          <th>Country</th>
        </tr>
      </thead>
      <tbody>
        {% for car in driver.cars.all %}
        <tr>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
          <td>{{ car.manufacturer.country }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
{% endblock %}
