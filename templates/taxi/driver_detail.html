{% extends "base.html" %}

{% block content %}
  <h1>
    Driver: {{ driver.first_name }} {{ driver.last_name }}
    <br>
    <p class="text-muted">{{ driver.username }}</p>
  </h1>
  <h3>Driver's cars:</h3>
  <div class="ml-3">
    <ul>
      {% for car in driver.cars.all %}
        <li>{{ car.model }} - {{ car.manufacturer.name }}</li>
      {% empty %}
        <li>No cars found.</li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
