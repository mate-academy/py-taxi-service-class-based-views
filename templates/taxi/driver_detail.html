{% extends "base.html" %}

{% block content %}
<h2>All cars</h2>
<table>
  <tr>
    <th>Car id</th>
    <th>Model</th>
    <th>Manufacturer</th>
  </tr>
  {% for car in driver.cars.all %}
  <tr>
    <td><a href="{% url 'taxi:car-detail' car.pk %}">{{ car.id }}</a></td>
    <td>{{ car.model }}</td>
    <td>{{ car.manufacturer.name }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
