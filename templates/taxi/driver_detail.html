{% extends "base.html" %}

{% block content %}
  <h1>Drivers Ditail</h1>
  <p><strong> Driver: </strong>{{ driver.first_name }} {{ driver.last_name }}</p>
    <p><strong>Cars:</strong></p>
  <ul>
    {% for car in driver.cars.all %}
      <li>{{ car.model }}</li>
    {% empty %}
      <li>No cars assigned.</li>
    {% endfor %}
  </ul>
{% endblock %}
