{% extends "base.html" %}

{% block content %}
  <h1>Driver: {{ driver.first_name }} {{ driver.last_name }}</h1>
  <p><strong>Driver's cars:</strong></p>
  <ul>
    {% for car in  driver.cars.all %}
      <li>{{ car.model }} by {{ car.manufacturer.name }} from {{ car.manufacturer.country }}</li>
    {% endfor %}
  </ul>

{% endblock %}
