{% extends "base.html" %}

{% block content %}
<h2>{{ driver.username }}</h2>
<p><strong>{{ driver.first_name }} {{ driver.last_name }}</strong></p>
<h3 class="ml-2">Cars:</h3>
{% for car in driver.cars.all %}
<hr>
<p class="ml-3"><a rel="driver_instance" href="{% url 'taxi:car-detail' car.id %}">{{ car.model }} ({{ car.manufacturer.name }} {{ car.manufacturer.country }})</a></p>
{% empty %}
<p class="ml-3">No cars yet.</p>
{% endfor %}
{% endblock %}
