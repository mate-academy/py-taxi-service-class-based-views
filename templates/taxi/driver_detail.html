{% extends "base.html" %}

{% block content %}
  <h2>Driver: {{ driver.first_name }} {{ driver.last_name }}</h2>
  <div class="ml-3">
    <h3>Driver's Cars:</h3>

    {% for car in driver.cars.all %}
      <hr>
      <p>{{ car.model }}</p>
    {% empty %}
      <p>This driver has no cars yet.</p>
    {% endfor %}

  </div>
{% endblock %}
