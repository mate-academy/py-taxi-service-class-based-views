{% extends "base.html" %}

{% block content %}
  <h2>Driver: {{ driver.username }}</h2>
  <p>License number: {{ driver.license_number }}</p>
  <h3>Cars</h3>
  <table>
    <thead>
      <tr>
        <th>Model</th>
        <th>Manufacturer</th>
        <th>Country</th>
      </tr>
    </thead>
    <tbody>
      {% for car in driver.cars.all %}
        <tr>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
          <td>{{ car.manufacturer.country }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
