{% extends "base.html" %}

{% block content %}
  <h1>Driver Detail</h1>
  <p><strong>Username:</strong> {{ driver.username }}</p>
  <p><strong>Driver license:</strong> {{ driver.license_number }}</p>
  <ul>
    {% for car in driver.cars.all %}
      <li>{{ car.model }}</li>
    {% endfor %}
  </ul>

{% endblock %}
