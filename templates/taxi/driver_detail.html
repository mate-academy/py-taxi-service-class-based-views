{% extends "base.html" %}

{% block content %}
  <h1>{{ driver.first_name }} {{ driver.last_name }}</h1>
  <hr>
  <p><strong>Username: </strong>{{ driver.username }}</p>
  <h3>Cars:</h3>
  {% for car in driver.cars.all %}
    <hr>
      <p><a href="{{ car.get_absolute_url }}">{{ car.model }}</a></p>
    {% empty %}
      <p>No cars!</p>
  {% endfor %}
{% endblock %}
