{% extends "base.html" %}

{% block content %}
    <h2>{{ driver.first_name }} {{ driver.last_name }} ({{ driver.username }})</h2>
    <p>License number: {{ driver.license_number }}</p>

    <h3>Cars</h3>
    <ul>
        {% for car in driver.cars.all %}
            <li>{{ car.model }} — {{ car.manufacturer.name }}</li>
        {% endfor %}
    </ul>
{% endblock %}
