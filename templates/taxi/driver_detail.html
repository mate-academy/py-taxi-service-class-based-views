{% extends "base.html" %}
{% block content %}
  <h1> Driver {{ driver.username }}</h1>
  <div class="ml-3">
    <h3>Cars:</h3>
  {% for car in driver.cars.all %}
    <hr>
    <p class="text-muted"> {{ car.model }}</p>
    <p>Manufacturer: {{ car.manufacturer }}</p>
  {% empty %}
    <p>Have no cars</p>
  {% endfor %}
  </div>
{% endblock %}
