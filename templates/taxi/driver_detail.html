{% extends "base.html" %}

{% block content %}
  <h1>Driver fullname: {{ driver.first_name }} {{ driver.last_name }}</h1>
  License number: {{ driver.license_number }}
  <div class="ml-3">
    <h3>Cars:</h3>
    {% for car in driver.cars.all() %}
      <hr>
      <p><strong>Id:</strong> {{ car.id }}
      <strong>Car model:</strong> {{ car.model }}</p>
    {% empty %}
      <p>No cars.</p>
    {% endfor %}
  </div>
{% endblock %}
