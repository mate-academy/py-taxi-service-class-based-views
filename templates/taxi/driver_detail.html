{% extends "base.html" %}

{% block content %}
  <h1>Driver: {{ driver.username }}</h1>
  
  <h2>Cars:</h2>
  <ul>
    {% for car in driver.cars.all %}
      <li>{{ car.model }} (Manufacturer: {{ car.manufacturer.name }})</li>
    {% empty %}
      <li>No cars assigned to this driver.</li>
    {% endfor %}
  </ul>
{% endblock %}
