{% extends "taxi/base.html" %}

{% block content %}
  <h1>Driver: {{ object.username }}</h1>

  <h3>Cars driven by this driver:</h3>
  <ul>
    {% for car in object.cars.all %}
      <li>
        <a href="{% url 'taxi:car-detail' car.id %}">
          {{ car.model }} ({{ car.manufacturer.name }})
        </a>
      </li>
    {% empty %}
      <li>No cars assigned</li>
    {% endfor %}
  </ul>
{% endblock %}
