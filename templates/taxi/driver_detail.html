{% extends "base.html" %}
{% block content %}
  <h1 class="title">"{{ driver.first_name }} {{ driver.last_name }}" Cars</h1>
	<ul class="list-group">
    {% for car in driver.cars.all %}
      <li class="list-group-item">
        <a href={% url 'taxi:car-detail' car.id %}>{{ car.model }}</a>
        - ({{ car.manufacturer.name }}, {{ car.manufacturer.country }})
      </li>
    {% endfor %}
  </ul>
{% endblock %}
