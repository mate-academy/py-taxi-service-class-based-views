{% extends "base.html" %}

{% block content %}
  <h3>Driver: {{ driver.username }}</h3>
  <h4>Cars:</h4>
  {% if driver.cars.all %}
    <ul>
      {% for car in driver.cars.all %}
        <li>{{ car.model }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Driver has no cars</p>
  {% endif %}
{% endblock %}
