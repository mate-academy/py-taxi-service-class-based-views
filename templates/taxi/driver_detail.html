{% extends "base.html" %}
{% block content %}
<h1>Driver Detail</h1>
<p>Username: {{ object.username }}</p>
<p>License Number: {{ object.license_number }}</p>

<h2>Cars</h2>
<ul>
    {% for car in object.cars.all %}
    <li>{{ car.model }} - {{ car.manufacturer.name }} ({{ car.manufacturer.country }})</li>
    {% endfor %}
</ul>
{% endblock %}
