{% extends "base.html" %}
{% block content %}
  <h1>Driver's cars list</h1>
    <ul>
    {% for car in object.cars.all %}
      <li>
        <a href="{% url 'taxi:car-detail' car.pk %}">
          {{ car.model }}, {{ car.id }}, {{ car.manufacturer.name }}
        </a>
      </li>
    {% endfor %}
    </ul>
{% endblock %}
