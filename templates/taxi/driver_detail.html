{% extends "base.html" %}

{% block content %}
  <h1>Driver: {{ driver.username }}</h1>
  <p>License number: {{ driver.license_number }}</p>

  <h2>Cars</h2>
  <ul>
    {% for car in driver.cars.all %}
      <li>
        <a href="{% url 'taxi:car-detail' pk=car.pk %}">{{ car.model }}</a>
        — {{ car.manufacturer.name }}
      </li>
    {% empty %}
      <li>No cars assigned.</li>
    {% endfor %}
  </ul>
{% endblock %}
