{% extends "base.html" %}

{% block content %}
  <h1>Driver detail</h1>
  <p>{{ driver.first_name }} {{ driver.last_name }} - {{ driver.license_number }}</p>
  {% if driver.cars %}
    <ul>
      {% for car in driver.cars.all %}
        <li>
          <a href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}</a>
        </li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
