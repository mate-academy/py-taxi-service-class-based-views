{% extends "base.html" %}

{% block content %}
  <h1>Driver detail</h1>

  <p><strong>Username:</strong> {{ driver.username }}</p>
  <p><strong>License:</strong> {{ driver.license_number }}</p>

  <h3>Cars</h3>
  <ul>
    {% for car in driver.cars.all %}
      <li>
        {{ car.model }} ({{ car.manufacturer.name }})
      </li>
    {% empty %}
      <li>No cars assigned</li>
    {% endfor %}
  </ul>
{% endblock %}
