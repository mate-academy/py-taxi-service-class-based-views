{% extends 'base.html' %}
{% block content %}
  <h1>Driver: {{ driver.username }}</h1>
  <h3>Cars:</h3>
  {% for car in driver.cars.all %}
    <p>Model: {{ car.model }} | Manufacturer: {{ car.manufacturer.name }} | Country: {{ car.manufacturer.country }}</p>
  {% empty %}
    <p> No cars</p>
  {% endfor %}
{% endblock %}
