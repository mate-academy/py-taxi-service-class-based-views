{% extends "base.html" %}

{% block content %}
  <h1>{{ driver.first_name }} {{ driver.last_name }}</h1>
  <hr>
  <div>
    <h3>Cars</h3>
  {% for car in driver.cars.all %}
    <p><strong>Car:</strong> {{ car.manufacturer.name }}</p>
    <p><strong>Country:</strong> {{ car.manufacturer.country }}</p>
    <hr>
  {% endfor %}
  </div>
{% endblock %}
