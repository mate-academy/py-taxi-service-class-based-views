{% extends "base.html" %}

{% block content %}
  <table>
    <h1>Driver: {{ driver.username }}</h1>
    <tr>
      <th>Model</th>
      <th>Name</th>
      <th>Country</th>
    </tr>
    {% for car in driver.cars.all %}
      <tr>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
        <td>{{ car.manufacturer.country }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
