{% extends 'base.html' %}

{% block content %}
<h1>{{ driver.first_name }} {{ driver.last_name }}</h1>
<h3>License Number: {{driver.license_number}}</h3>


<div class="ml-3">
  <h3>Cars</h3>
  {% for car in driver.cars.all %}
  <p class="text-muted">{{car.model}}</p>
  {% endfor %}
</div>
{% endblock %}
