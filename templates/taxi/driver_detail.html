{% extends "base.html" %}

{% block content %}
  <h1>Driver: {{ driver.username }}</h1>
  <p><strong>All cars of a driver:</strong></p>
  <table class="table table-striped">
    <thead>
      <tr>
        <td>Model</td>
        <td>Manufacturer</td>
      </tr>
    </thead>
    <tbody>
      {% for car in driver.cars.all %}
        <tr>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
