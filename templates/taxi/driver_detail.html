{% extends "base.html" %}

{% block content %}
  <h1>Driver: {{ driver.username }}</h1>
  <p><strong>{{ driver.first_name }}.{{ driver.last_name }}</strong></p>
  <div class="ml-3">
    <h3>Cars:</h3>
    <table>
    <tr>
      <th>ID</th>
      <th>Model</th>
      <th>Manufacturer</th>
    </tr>
    {% for car in driver.cars.all %}
      <tr>
        <td>{{ car.id }}</td>
        <td>{{ car.model }}</td>
        <td>{{ car.manufacturer.name }}</td>
      </tr>
    {% empty %}
      <tr>
        <td>No cars!</td>
      </tr>
    {% endfor %}
    </table>
  </div>
{% endblock %}
