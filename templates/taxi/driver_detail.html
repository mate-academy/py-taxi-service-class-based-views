{% extends "base.html" %}
{% block title %}<title>Taxi Service - Driver: {{ driver.username }}</title>{% endblock %}
{% block content %}
  <h1>{{ driver.username }}</h1>
  <p>Cars:</p>
  <ul>
  {% for car in driver.cars.all %}
    <li>{{ car.model }}</li>
  {% empty %}
    <li>The driver has no cars.</li>
  {% endfor %}
  </ul>
{% endblock %}
