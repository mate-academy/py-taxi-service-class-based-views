{% extends "base.html" %}

{% block content %}
  <h1>Driver Detail</h1>
  <p>First name: {{ driver.first_name }}</p>
  <p>Last name: {{ driver.last_name }}</p>

  <h2>Driver's cars</h2>
  <ol>
    {% for car in driver.cars.all %}
      <li class="list-item">
        <a href="{% url 'taxi:car-detail' car.id %}">{{ car.make }} {{ car.model }}</a>
      </li>
    {% endfor %}
  </ol>
  <div><a class="active" href="{% url 'taxi:driver-list' %}">Back to Driver List</a></div>

{% endblock %}
