{% extends "base.html" %}

{% block content %}
  <h1>Driver Detail</h1>
  <p>
    <strong>First Name:</strong> {{ driver.first_name }}
    <br>
    <strong>Last Name:</strong> {{ driver.last_name }}
  </p>
  <div class="ml-3">
    <h2>Cars</h2>
    <table>
      {% for car in driver.cars.all %}
        <tr>
          <td>
            <a href="{% url 'taxi:car-detail' car.id %}">
              {{ car.model }}
            </a>
          </td>
        </tr>
      {% endfor %}
    </table>
  </div>
{% endblock %}
