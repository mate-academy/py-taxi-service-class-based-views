{% extends 'base.html' %}
{% block content %}
  <h1>Driver: {{ object.first_name }} {{ object.last_name }}</h1>
  {% if object.cars.all %}
    <ul>
      {% for car in object.cars.all %}
        <li>{{ car.model }}, {{ car.manufacturer.name }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
