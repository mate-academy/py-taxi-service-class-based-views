{% extends "base.html" %}

{% block title %}<title>Driver Details</title>{% endblock %}

{% block content %}
  <h3>Driver: {{ driver.first_name }} {{ driver.last_name }}</h3>
  <div>
    <h4>Cars:</h4>
    {% for car in driver.cars.all %}
      <hr>
      <p>{{ car.model }} , {{ car.manufacturer.country }}</p>
    {% empty %}
      <p>No cars found</p>
    {% endfor %}
  </div>
{% endblock %}
