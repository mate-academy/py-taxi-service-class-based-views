{% extends 'base.html' %}
{% block content %}
    <h1>Driver: {{ driver.first_name }} {{ driver.last_name }}</h1>
    {% if driver.cars.all %}
        <ul>
            {% for car in driver.cars.all %}
                <li>{{ car.model }} {{ car.manufacturer}}</li>
            {% endfor %}
        </ul>
    {% endif %}
{% endblock %}
