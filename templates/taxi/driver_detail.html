{% extends "base.html" %}

{% block content %}
  <h1>Driver: {{ driver.first_name }} {{ driver.last_name }}</h1>
  <p><strong>License: {{ driver.license_number }}</strong></p>
  <div class="ml-3">
    <h2>Cars</h2>
    {% for car in driver.cars.all%}
      <hr>
      <p>{{ car.id }}</p>
      <p><strong>{{ car.model }}</strong> Manufacturer: <strong>{{ car.manufacturer.name }}</strong></p>
    {% endfor %}
    
  </div>
{% endblock %}
