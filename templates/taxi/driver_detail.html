{% extends "base.html" %}
{% block content %}
  <h1>{{ driver.first_name }} {{ driver.last_name }}</h1>
  <h2>№: {{ driver.license_number }}</h2>
  {% if driver.cars.all %}
    <hr>
    <h4>Cars:</h4>
    <div>
    <table class="table table-hover">
      <thead class="thead-dark">
        <tr>
          <th>Model</th>
          <th>Manufacturer</th>
        </tr>
      </thead>
      <tbody>
      {% for car in driver.cars.all %}
        <tr>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
  {% endif %}
{% endblock %}
