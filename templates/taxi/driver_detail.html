{% extends "base.html" %}

{% block content %}
  <h2>Driver: {{ driver.username }}</h2>
  <p>License Number: {{ driver.license_number }}</p>

  <h3>Cars:</h3>
  <table class="table table-sm table-bordered w-auto">
    <thead>
      <tr>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
    </thead>
    <tbody>
      {% for car in driver.cars.all %}
        <tr>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
