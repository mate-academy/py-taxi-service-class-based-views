<!-- Exemplo de inclusão no seu base.html (ajuste conforme seu layout) -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Serviço de Táxi</title>
    <style>
        /* Estilos mínimos para a estrutura */
        .content { display: flex; }
        .sidebar { width: 200px; padding: 1em; border-right: 1px solid #ccc; }
        .main { flex-grow: 1; padding: 1em; }
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; }
    </style>
</head>
<body>
    <div class="content">
        {% include "includes/sidebar.html" %}
        <div class="main">
         <h1>{% block title %}Bem-vindo{% endblock %}</h1>
            {% block content %}
            {% endblock %}
        </div>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
