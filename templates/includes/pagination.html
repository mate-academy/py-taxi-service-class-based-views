{% if is_paginated %}
  <nav class="fixed-bottom bg-light py-3 shadow">
    <ul class="pagination justify-content-center mb-0">
      {% if page_obj.has_previous %}
        <li class="page-item">
          <a href="?page={{ page_obj.previous_page_number }}" class="page-link text-dark">
            <i class="fas fa-chevron-left"></i> Prev
          </a>
        </li>
      {% endif %}

      <li class="page-item active">
        <span class="page-link bg-secondary text-white">
          Page {{ page_obj.number }} of {{ paginator.num_pages }}
        </span>
      </li>

      {% if page_obj.has_next %}
        <li class="page-item">
          <a href="?page={{ page_obj.next_page_number }}" class="page-link text-dark">
            Next <i class="fas fa-chevron-right"></i>
          </a>
        </li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
