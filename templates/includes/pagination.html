  {% if is_paginated %}
    <div class="paginator">
      <hr>
      {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}"><-</a>
      {% endif %}
      <span>{{ page_obj.number }} of {{ paginator.num_pages }}</span>
      {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}">-></a>
      {% endif %}
      <hr>
    </div>
  {% endif %}
