{% if is_paginated %}
<ul class="pagination">
  {% if page_obj.has_previous %}
    <li class="page-link"><a href="?page=1">&laquo;</a></li>
    <li class="page-link"><a href="?page={{ page_obj.previous_page_number }}">Previous</a></li>
  {% endif %}
  <li class="page-item active">
    <span class="page-link">
      {{ page_obj.number }} of {{ paginator.num_pages }}
    </span>
  </li>
  {% if page_obj.has_next %}
    <li class="page-link"><a href="?page={{ page_obj.next_page_number }}">Next</a></li>
    <li class="page-link"><a href="?page={{ paginator.num_pages }}">&raquo;</a></li>
  {% endif %}
</ul>
{% endif %}
