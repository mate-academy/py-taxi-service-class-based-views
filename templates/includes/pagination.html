{% if is_paginated %}
    <ul class="paginator">
      {% if page_obj.has_previous %}
        <li><a href="?page={{ page_obj.previous_page_number }}">Prev</a> </li>
      {% endif %}
      <li>{{ page_obj.number }} / {{ paginator.num_pages }}</li>
      {% if page_obj.has_next %}
      <li><a href="?page={{ page_obj.next_page_number }}">Next</a> </li>
      {% endif %}
    </ul>
  {% endif %}
