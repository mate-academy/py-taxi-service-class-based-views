{% if is_paginated %}
    <ul class="pagination"> <!-- делаем переходы между страницами -->
      {% if page_obj.has_previous %}  <!-- предыдущая страница и проверка есть ли она -->
      	<li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}">Prev</a></li>
      {% endif %}
      <li class="page-item active"><span class="page-link">{{ page_obj.number }}</span></li> <!-- текущая страница -->
      {% if page_obj.has_next %}  <!-- следующая страница и проверка есть ли она -->
      	<li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}">Next</a></li>
      {% endif %}
    </ul>
{% endif %}
