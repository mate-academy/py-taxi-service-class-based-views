{% if is_paginated %}
  <ul class="pagination">
    {% if page_obj.has_previous %}
      <li class="page-item">
        <a class="page-link" href="?page={{ page_obj.previous_page_number }}">Prev</a>
      </li>
    {% endif %}
    <li class="page-item">
      <a class="page-link" href="?page={{ page_obj.number }} of {{ page_obj.paginator.num_pages }}">Current</a>
    </li>
    {% if page_obj.has_next %}
      <li class="page-item">
        <a class="page-link" href="?page{{ page_obj.next_page_number }}">Next page</a>
      </li>
    {% endif %}
  </ul>
{% endif %}
