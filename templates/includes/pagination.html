

{% if is_paginated %}
  {% with request.GET.urlencode as q %}
  <nav aria-label="pagination">
    <ul>
      {% if page_obj.has_previous %}
        <li>
          <a href="?{% if q %}{{ q }}&{% endif %}page={{ page_obj.previous_page_number }}">
            Previous
          </a>
        </li>
      {% endif %}
      <li>Page {{ page_obj.number }} of {{ paginator.num_pages }}</li>
      {% if page_obj.has_next %}
        <li>
          <a href="?{% if q %}{{ q }}&{% endif %}page={{ page_obj.next_page_number }}">
            Next
          </a>
        </li>
      {% endif %}
    </ul>
  </nav>

  {% endwith %}
{% endif %}
