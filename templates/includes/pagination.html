{% if is_paginated %}
  <div class="pagination">
    {% if page_obj.has_previous %}
      <a class="pagination__item" href="?page={{ page_obj.previous_page_number }}">Previous</a>
    {% endif %}
    <span class="pagination__item">
      Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
    </span>
    {% if page_obj.has_next %}
      <a class="pagination__item" href="?page={{ page_obj.next_page_number }}">Next</a>
    {% endif %}
  </div>
{% endif %}
