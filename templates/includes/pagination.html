{% if is_paginated %}
  <div>
    {% if page_obj.has_previous %}
      <a href="?page={{ page_obj.previous_page_number }}">&#8592; </a>
    {% endif %}
      <span>{{ page_obj.number }} of {{ paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a href="?page={{ page_obj.next_page_number }}"> &#8594;</a>
    {% endif %}
  </div>
{% endif %}
