{% extends "base.html" %}

{% block content %}
  <h2>Driver Details</h2>
  <p><strong>Username:</strong> {{ object.username }}</p>
  <p><strong>First Name:</strong> {{ object.first_name }}</p>
  <p><strong>Last Name:</strong> {{ object.last_name }}</p>

  <h3>Cars</h3>
  <ul>
    {% for car in object.cars.all %}
      <li>{{ car.model }} ({{ car.manufacturer.name }})</li>
    {% endfor %}
  </ul>
{% endblock %}
