{% extends "base.html" %}
{% block content %}
<h1>Driver: {{ object.username }}</h1>
<p><strong>Name:</strong> {{ object.first_name }} {{ object.last_name }}</p>

<h3>Cars:</h3>
<ul>
  {% for car in object.cars.all %}
    <li>{{ car.model }} ({{ car.manufacturer.name }}, {{ car.manufacturer.country }})</li>
  {% endfor %}
</ul>
{% endblock %}
