{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  <ul>
    {% for car in car_list %}
      <li><a href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}</a> (Manufacturer: {{ car.manufacturer.name }})</li>
    {% empty %}
      <p>No cars available.</p>
    {% endfor %}
  </ul>
{% endblock %}
