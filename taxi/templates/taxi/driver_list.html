{% extends "base.html" %}

{% block content %}
  <h1>Drivers</h1>
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>UserName</th>
      <th>Cars</th>
    </tr>
    </thead>
    <tbody>
    {% for driver in object_list %}
      <tr>
        <td>{{ driver.id }}</td>
        <td><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></td>
        <td>{{ driver.cars.count }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  {% include "includes/pagination.html" with page_obj=page_obj %}
{% endblock %}
